[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonia"
version = "0.2.0"
description = "Audio to chord chart: beats, chord posteriors, sections, folding, served as one Flask app."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Only what harmonia/**/*.py actually imports (refactor sprint 20, 2026-09-14
# — grep of top-level imports across the package). requirements-lock.txt is
# still the real env freeze; this list is the declared surface.
dependencies = [
    "numpy<2.5",
    "scipy>=1.12",
    "torch>=2.2",
    "flask>=3.0",
    "beat_this>=1.1",
    "librosa>=0.10,<1.0",
    "soundfile>=0.12",
    "vamp>=1.1",
    "huggingface_hub>=0.24",
    "safetensors>=0.4",
    "curl_cffi>=0.7",
    "pyRealParser",
    "yt-dlp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
harmonia-server = "harmonia.server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harmonia*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=harmonia --cov-report=term-missing"
