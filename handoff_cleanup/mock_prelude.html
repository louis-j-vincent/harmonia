<script>
/* MOCK ONLY — le cas de charge de Louis (2026-08-19) : A×3 B A×3 B A×3 B
   bridge B A×3 = 17 passages, 9 groupes. Ajouter ?form=stress à l'URL.
   On remplace `sections` du MODEL, jamais rien dans le shell. */
(function(){
  if(new URLSearchParams(location.search).get('form')!=='stress') return;
  const of=window.fetch;
  window.fetch=function(u,o){
    const r=of.apply(this,arguments);
    if(String(u).indexOf('/api/chart-model/')!==0) return r;
    return r.then(res=>res.json()).then(M=>{
      const seq=['A','A','A','B','A','A','A','B','A','A','A','B','bridge','B','A','A','A'];
      const proto=M.sections[0].bars.slice(0,4);
      const byLabel={}; const order=[];
      seq.forEach((L,j)=>{
        let s=byLabel[L];
        if(!s){ s=byLabel[L]={id:'x'+order.length,label:L,tag:'',reps:0,spans:[],barRanges:[],
                              bars:JSON.parse(JSON.stringify(proto))}; order.push(s); }
        s.spans.push([j*8,j*8+8]); s.barRanges.push([j*4,j*4+3]); s.reps++;
      });
      M.sections=order; M.n_bars=seq.length*4;
      return new Response(JSON.stringify(M),{status:200,headers:{'Content-Type':'application/json'}});
    });
  };
})();
</script>

<script>
/* MOCK ONLY — de quoi voir les marques de T4 : ?marks=1 rend deux accords peu
   sûrs (c=0.30 → le point) et deux accords verrouillés (→ le tiret vert). */
(function(){
  if(new URLSearchParams(location.search).get('marks')!=='1') return;
  const of=window.fetch;
  window.fetch=function(u,o){
    const r=of.apply(this,arguments);
    if(String(u).indexOf('/api/chart-model/')!==0) return r;
    return r.then(res=>res.json()).then(M=>{
      let k=0;
      M.sections.forEach(s=>s.bars.forEach(bar=>bar.forEach(ch=>{
        k++;
        if(k%5===0){ ch.c=0.30; }
        if(k%7===0){ ch.confirmed=true; ch.c=1; }
      })));
      return new Response(JSON.stringify(M),{status:200,headers:{'Content-Type':'application/json'}});
    });
  };
})();
</script>

<script>
/* MOCK ONLY — ?audio=1 : un WAV silencieux de 48 s, fabriqué en JS (aucun
   fichier dans le dépôt), pour que la lecture, la tête de lecture et le suivi
   d'accord du clavier soient réellement exerçables sans serveur. */
(function(){
  if(new URLSearchParams(location.search).get('audio')!=='1') return;
  function silentWav(sec, rate){
    const n=sec*rate, b=new Uint8Array(44+n), dv=new DataView(b.buffer);
    const S=(o,t)=>{ for(let i=0;i<t.length;i++) b[o+i]=t.charCodeAt(i); };
    S(0,'RIFF'); dv.setUint32(4,36+n,true); S(8,'WAVEfmt ');
    dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
    dv.setUint32(24,rate,true); dv.setUint32(28,rate,true);
    dv.setUint16(32,1,true); dv.setUint16(34,8,true);
    S(36,'data'); dv.setUint32(40,n,true); b.fill(128,44);
    let s=''; for(let i=0;i<b.length;i+=4096) s+=String.fromCharCode.apply(null,b.subarray(i,i+4096));
    return 'data:audio/wav;base64,'+btoa(s);
  }
  const URL_=silentWav(48,4000);
  const of=window.fetch;
  window.fetch=function(u,o){
    const r=of.apply(this,arguments);
    if(String(u).indexOf('/api/chart-model/')!==0) return r;
    return r.then(res=>res.json()).then(M=>{
      M.audio_url=URL_;
      if(!M.barGrid){ M.barGrid=[]; for(let i=0;i<=24;i++) M.barGrid.push(i*2); }
      return new Response(JSON.stringify(M),{status:200,headers:{'Content-Type':'application/json'}});
    });
  };
})();
</script>
