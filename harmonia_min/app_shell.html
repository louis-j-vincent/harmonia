<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harmonia</title>
<link rel="manifest" href="/pwa/manifest.json">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harmonia">
<meta name="theme-color" content="#8a2b2b">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #e7e0d0; overscroll-behavior-y: none; }
  body { -webkit-overflow-scrolling: touch; }
  a { color: #8a2b2b; }
  @keyframes ap-in { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
  @keyframes ap-fade { from { opacity:0;} to { opacity:1;} }
  @keyframes ap-spin { to { transform: rotate(360deg); } }
  @keyframes ap-sheet { from { transform:translateY(100%);} to { transform:translateY(0);} }
  @keyframes ap-pulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.06);opacity:.85;} }
  /* delta2 §6: la cellule dont la carte de voicing est ouverte — comme la
     cellule du playhead mais en bleu (l'accent est déjà pris par la lecture) */
  [data-voicing-open] { box-shadow: inset 0 0 0 2px #2a6fb0; background: rgba(42,111,176,.10); }
  /* keyframes MUST carry the button's own translate(-50%,-50%): with
     fill-mode:both the final keyframe REPLACES the inline transform, and a
     bare scale(1) left every orb shifted +half its size — that offset, not
     the sizing, is what glued orbs onto the hub/rim (found 2026-08-08). */
  @keyframes ap-orb { from { opacity:0; transform:translate(-50%,-50%) scale(.4);} to { opacity:1; transform:translate(-50%,-50%) scale(1);} }
  .ap-scroll::-webkit-scrollbar{width:7px;height:7px;} .ap-scroll::-webkit-scrollbar-thumb{background:#cdc4ad;border-radius:4px;}
  /* the cylinder's columns scroll but must show no bar (iOS picker look) */
  .ap-nobar::-webkit-scrollbar{display:none;width:0;height:0;}
  #app { height: 100dvh; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Harmonia app shell — the design-handoff engine (window.APP), wired to the
   live server. Demo data and the mock re-infer are gone: every screen reads
   real endpoints (/api/library, /api/chart-model, /api/yt-search, /api/analyze,
   /api/reinfer, /api/annotations). The one clean shape the UI consumes is the
   ChartModel from harmonia/output/chart_model.py — see that module's docstring.

   Deliberate deviation from the handoff: playback is the LOCAL cached audio
   (/audio/<slug>.m4a), not a YouTube iframe. The server already keeps the
   audio it downloaded for inference, and local playback is what the shipped
   chart uses — it sidesteps the iframe's origin/playsinline/embedding-disabled
   failures on iOS (see harmonia_server.py's _yt_audio_meta rationale). */
window.APP = (function(){
  "use strict";
  const UI="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif";
  const SERIF="Georgia,'Times New Roman',serif";
  // Theme + visualisation preferences (new-chord-ux handoff, "Visualisation
  // preferences" board). accent/green/amber/blue are SHARED across themes;
  // deep chrome bars keep fixed light text (#f4eee2). Chart colour (paper)
  // is a light-theme preference; dark keeps its own paper. All styling is
  // inline-from-T at render time, so a theme change is: mutate T, rebuild.
  const LIGHT={ bg:"#e7e0d0", paper:"#f7f3e9", card:"#fffdf6", ink:"#1c1c1c", rule:"#b9b09a", faint:"#8a8371", line:"#e5dcc6", deep:"#2a2622" };
  const DARK ={ bg:"#151210", paper:"#211c17", card:"#2a241d", ink:"#f2ebde", rule:"#5b5344", faint:"#a99f8c", line:"#39332a", deep:"#0e0c0a" };
  const T=Object.assign({ accent:"#8a2b2b", green:"#1f8a5b", amber:"#c58a2e", blue:"#2a6fb0" }, LIGHT);
  const PREF={
    theme:(()=>{ try{return localStorage.getItem("harmTheme")||"light";}catch(e){return "light";} })(),
    notation:(()=>{ try{return localStorage.getItem("harmNotation")||"normal";}catch(e){return "normal";} })(),
    cof:(()=>{ try{return localStorage.getItem("harmCof")!=="0";}catch(e){return true;} })(),
    paper:(()=>{ try{return localStorage.getItem("harmPaper")||"#f7f3e9";}catch(e){return "#f7f3e9";} })(),
  };
  function applyTheme(){
    Object.assign(T, PREF.theme==="dark"?DARK:LIGHT);
    if(PREF.theme!=="dark") T.paper=PREF.paper;
    try{
      document.body.style.background=T.bg;
      document.documentElement.style.background=T.bg;
      const mt=document.querySelector('meta[name="theme-color"]');
      if(mt) mt.content=PREF.theme==="dark"?"#0e0c0a":"#8a2b2b";
    }catch(e){}
  }
  applyTheme();
  const FLAT=["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
  const SHARP=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
  // Key-aware enharmonic spelling (2026-07-19, user report: "G♭m7" shown in E
  // major — must be F♯m7). Same rule as chart_interactive.preferFlats: flat
  // majors are C D♭ E♭ F G♭ A♭ B♭; sharp majors G D A E B. Minor keys follow
  // their relative major. NOTES is set on model load; flats until then (the
  // library list shows key tonics, which are conventionally flat-spelled).
  const FLAT_MAJ=new Set([0,1,3,5,6,8,10]);
  const mod=(n,m)=>((n%m)+m)%m;
  let NOTES=FLAT;
  function setSpelling(tonic,mode){ const maj=(mode==="minor")?mod(tonic+3,12):mod(tonic,12); NOTES=FLAT_MAJ.has(maj)?FLAT:SHARP; }
  const note=pc=>NOTES[mod(pc,12)];
  const el=(t,c,x)=>{const e=document.createElement(t); if(c)e.style.cssText=c; if(x!=null)e.textContent=x; return e;};
  const clear=n=>{ while(n.firstChild) n.removeChild(n.firstChild); };

  // iReal quality tails as parse_token emits them. Half-diminished arrives as
  // "h7" (iReal's own spelling), not "-7b5" — it must typeset as ø7 and behave
  // as half-dim everywhere, or it renders as a literal "h7" and gets classed
  // as a dominant.
  const TOK={"":"","6":"6","^7":"maj7","^":"maj7","7":"7","-":"m","-7":"m7","-^7":"mMaj7","-6":"m6",
             "o":"dim","o7":"dim7","-7b5":"m7♭5","h7":"ø7","h":"ø","9":"9","-9":"m9","^9":"maj9",
             "13":"13","7b9":"7♭9","7#9":"7♯9","7b5":"7♭5","7#11":"7♯11","sus":"sus","7sus":"7sus",
             "sus4":"sus4","7sus4":"7sus4","+":"+","+7":"+7","69":"6/9"};
  const isHalfDim=q=>q.indexOf("-7b5")===0||q.indexOf("h")===0;
  const isDim=q=>q.indexOf("o")===0||q.indexOf("dim")===0;
  function seventhOf(q){ if(q==="6"||q.indexOf("^")===0)return "^7"; if(isHalfDim(q))return "h7"; if(isDim(q))return (q==="o7"?"o7":"o"); if(q.indexOf("-")===0)return "-7"; if(q==="")return ""; return "7"; }
  function famSuffix(q){ if(isHalfDim(q)||isDim(q))return "°"; if(q.indexOf("-")===0)return "m"; if(q.indexOf("+")===0)return "+"; return ""; }
  function confColor(c){ if(c>=.82)return T.ink; if(c>=.66)return "#5c4a30"; if(c>=.5)return "#9a6a1e"; if(c>=.38)return "#bd6a22"; return "#a8281f"; }
  function depthOf(c){ return c>=.66?"exact":(c>=.42?"seventh":"family"); }
  // How the chord's confidence reads in words. `n` = how many times the whole
  // song plays this chord (root + family); it is what the colour is derived
  // from, so the label and the tint can never disagree.
  function playedLabel(ch){
    const n=ch.n|0;
    if(n<=1) return "played once in this song";
    if(n<=3) return "played "+n+" times in this song";
    if(n<=7) return "played "+n+" times";
    return "played "+n+" times — a chord of the song";
  }
  // The Georgia italic "♭"/"♯" glyph carries a lot of built-in side-bearing —
  // at bold+italic it reads as a visible GAP between the letter and the
  // accidental (user report 2026-07-21, comparing against iRealB's much
  // tighter chord typesetting, worst on a crammed 3-4-chord bar). Splitting
  // the accidental into its own smaller, negatively-margined span pulls it
  // in against the letter instead of relying on the font's own spacing.
  function noteEl(pc,size){
    const w=el("span","display:inline-flex;align-items:baseline;");
    const n=note(pc), m=n.match(/^([A-G])([♭♯]?)$/);
    w.appendChild(el("span",`font-size:${size}px;`,m?m[1]:n));
    if(m&&m[2]) w.appendChild(el("span",`font-size:${Math.round(size*0.74)}px;margin-left:${Math.round(size*-0.1)}px;`,m[2]));
    return w;
  }
  // Compact chord notation (new-chord-ux handoff, panel 7): accidental and
  // quality stacked in a narrow column beside a full-size root letter, with
  // standard jazz symbols (△ maj7, − min, ø half-dim, ° dim). The top
  // (accidental) slot is ALWAYS reserved — a hidden ♭ spacer when the root
  // is natural — so the quality sits at the same low baseline either way.
  const CTOK={"":"","6":"6","^7":"△7","^":"△7","^9":"△9","7":"7","-":"−","-7":"−7","-^7":"−△7","-6":"−6",
              "-7b5":"ø7","h7":"ø7","h":"ø","o":"°","o7":"°7","9":"9","-9":"−9","13":"13",
              "7b9":"7♭9","7#9":"7♯9","7b5":"7♭5","7#11":"7♯11","sus":"sus","sus2":"sus2","sus4":"sus4",
              "7sus":"7sus","7sus4":"7sus4","+":"+","+7":"+7","69":"6/9"};
  // Tight glyph (UI refresh delta2, §7 / design 4a) — replaces glyphCompact.
  // Relevé sur la capture iReal de « 9.20 Special » (C7 B7 B♭7 A7 dans ~90px):
  // la qualité est un INDICE tucké sous l'épaule droite de la lettre, dans la
  // même colonne étroite que l'altération, et la taille descend avec le nombre
  // d'accords dans la barre — 19px est un plancher dur (en dessous on ne lit
  // plus à un mètre, mains occupées; c'est la barre qu'il faut couper).
  const TIGHT_SIZE={1:30, 2:25, 3:22, 4:19};
  const TIGHT_GAP ={1:0,  2:9,  3:6,  4:4};
  function tightSize(n){ return TIGHT_SIZE[Math.min(4, Math.max(1, n))]; }
  function tightGap(n){ return TIGHT_GAP[Math.min(4, Math.max(1, n))]; }
  function glyphTight(root,q,size,depth,color,bass){
    const w=el("span",
      `position:relative;display:inline-flex;align-items:stretch;height:${size}px;`+
      `font:italic 600 ${size}px ${SERIF};line-height:1;white-space:nowrap;color:${color};`);
    const nm=note(root), m=nm.match(/^([A-G])([♭♯]?)$/);
    w.appendChild(el("span","", m?m[1]:nm));
    const acc=m?m[2]:"";
    let suf;
    if(depth==="family"){ const f=famSuffix(q); suf=(f==="m")?"−":f; }
    else if(depth==="seventh"){ const s7=seventhOf(q); suf=CTOK[s7]!=null?CTOK[s7]:(TOK[s7]||""); }
    else suf=CTOK[q]!=null?CTOK[q]:(TOK[q]!=null?TOK[q]:q);
    const sz=Math.round(size*0.52);
    // La colonne étroite fait toute la hauteur de la lettre, altération collée
    // en haut, qualité posée sur la ligne de base (padding-bottom 19%: Georgia
    // assied ses capitales à ~80% de la boîte — sans ce padding l'indice tombe
    // SOUS la ligne de base et l'accord a l'air décroché). margin-left:-1px:
    // l'italique de Georgia dépasse à droite; ce dépassement est de la place
    // gratuite, même raisonnement que noteEl() sur ses altérations.
    if(acc||suf){
      const col=el("span",
        `display:inline-flex;flex-direction:column;justify-content:space-between;`+
        `align-items:flex-start;margin-left:-1px;height:100%;box-sizing:border-box;`+
        `padding:3% 0 19%;line-height:.92;`);
      // le slot du haut est TOUJOURS réservé (♭ masqué quand la note est
      // naturelle): sans ça la qualité remonte et deux accords voisins n'ont
      // plus la même assise. max-width:0 sur le fantôme — il garde sa HAUTEUR
      // (l'assise) mais plus sa largeur: dans une barre serrée, ~5px de boîte
      // invisible par accord poussaient le voisin (mesuré sur Goodbye Yellow
      // Brick Road). Pas de colonne du tout quand il n'y a rien à y écrire.
      col.appendChild(el("span",
        `font-size:${sz}px;font-weight:600;${acc?"":"visibility:hidden;max-width:0;"}`, acc||"♭"));
      if(suf) col.appendChild(el("span",`font-size:${sz}px;font-weight:700;`, suf));
      w.appendChild(col);
    }
    if(bass!=null && bass>=0 && mod(bass,12)!==mod(root,12)){
      // Louis, 2026-08-08: in compact writing the slash bass sits BELOW the
      // chord, to the right — the classical convention — not at half height
      // beside it. (Kept over the delta2 draft's inline baseline bass: the
      // convention was Louis's explicit round-2 call, verified on device.)
      // ABSOLUTE, sous l'épaule droite: la basse n'ajoute AUCUNE largeur —
      // dans une barre serrée à 3-4 accords, une basse en flux poussait le
      // voisin hors de la cellule (mesuré: 3 débordements sur Goodbye Yellow
      // Brick Road). Elle pend sous la ligne de base, où il n'y a que du
      // papier.
      const bassSize=Math.round(size*0.5);
      const bw=el("span",`position:absolute;right:0;bottom:${-Math.round(size*0.40)}px;`+
        `display:inline-flex;align-items:baseline;font-weight:600;opacity:.7;`);
      bw.appendChild(el("span",`font-size:${bassSize}px;`,"/"));
      bw.appendChild(noteEl(bass,bassSize));
      w.appendChild(bw);
    }
    return w;
  }
  function glyph(root,q,size,depth,color,bass){
    if(PREF.notation==="compact") return glyphTight(root,q,size,depth,color,bass);
    const w=el("span",`font-family:${SERIF};font-style:italic;line-height:1;white-space:nowrap;color:${color};display:inline-flex;align-items:baseline;`);
    const rootEl=noteEl(root,size); rootEl.style.fontWeight="600"; w.appendChild(rootEl);
    let suf; if(depth==="family") suf=famSuffix(q); else if(depth==="seventh") suf=TOK[seventhOf(q)]||""; else suf=(TOK[q]!=null?TOK[q]:q);
    if(suf) w.appendChild(el("sup",`font-size:${Math.round(size*0.44)}px;font-weight:600;`,suf));
    // Slash-bass inversion (2026-07-21): "/D" for a sounding bass note distinct
    // from the root — small, low-opacity, matching prettyChordLabel's preview.
    if(bass!=null && bass>=0 && mod(bass,12)!==mod(root,12)){
      const bassSize=Math.round(size*0.5);
      const bw=el("span",`display:inline-flex;align-items:baseline;font-weight:600;opacity:.7;`);
      bw.appendChild(el("span",`font-size:${bassSize}px;`,"/"));
      const bEl=noteEl(bass,bassSize); bw.appendChild(bEl);
      w.appendChild(bw);
    }
    return w;
  }
  const fifthsIndex=pc=>mod(pc*7,12);
  const keyHue=pc=>fifthsIndex(pc)/12*360;
  const keyFill=pc=>`hsl(${keyHue(pc)} 42% 62%)`;
  // Full-cell lens band colour (handoff #5). Light pastel on light theme,
  // deep tint on dark; minor collections slightly duller than major. With
  // "Key colours" OFF the bands fall back to one neutral maroon wash.
  function lensBand(hue,minor){
    if(!PREF.cof) return PREF.theme==="dark"?"rgba(138,43,43,.22)":"rgba(138,43,43,.13)";
    return PREF.theme==="dark"
      ? `hsl(${hue} ${minor?24:30}% ${minor?22:27}% / .9)`
      : `hsl(${hue} ${minor?40:58}% ${minor?80:87}% / .92)`;
  }
  function lensLabelColor(hue,minor){
    return PREF.theme==="dark" ? `hsl(${hue} 40% 78%)` : `hsl(${hue} ${minor?38:52}% ${minor?30:33}%)`;
  }
  function fnColor(root,keyTonic){ const d=mod(root-keyTonic,12);
    if(d===0||d===9) return T.green;         // I / vi  (home)
    if(d===5||d===2) return T.blue;          // IV / ii (setting up)
    if(d===7||d===11) return T.accent;       // V / vii (pulling)
    return "#8a7d5a"; }
  const rootHue=pc=>Math.round(fifthsIndex(pc)/12*360);
  function petalFill(pc,conf){ return `hsl(${rootHue(pc)} ${Math.round(46+conf*26)}% ${Math.round(84-conf*34)}%)`; }
  function petalEdge(pc,conf){ return `hsl(${rootHue(pc)} ${Math.round(50+conf*26)}% ${Math.round(60-conf*22)}%)`; }
  function keyTint(pc){ return `hsl(${rootHue(pc)} 52% 90%)`; }
  const SVGNS="http://www.w3.org/2000/svg";
  function sv(t,a){ const e=document.createElementNS(SVGNS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }

  function qClass(q){ if(q===""||q.startsWith("^")||q.startsWith("6")) return "maj"; if(isHalfDim(q)) return "m7b5"; if(isDim(q)) return "dim"; if(q.startsWith("-")) return "min"; if(q.startsWith("sus")) return (q.indexOf("7")>=0)?"dom":"sus"; if(q.startsWith("+")) return q.indexOf("7")>=0?"dom":"aug"; return "dom"; }

  // ── local-key/scale continuity tracker — JS port of harmonia/theory/local_key.py's
  // continuity_scale_track_v2 + consolidate_dominant_chains (2026-07-21). Operates on
  // (root pc, iReal quality tail) pairs already on hand (ch.root/ch.q), not token
  // strings — the algorithm itself (hold the diatonic collection until a chord's tones
  // contradict it, then jump to the nearest circle-of-fifths collection that fits) is
  // unchanged from the Python reference; see that module's docstring for the "why".
  // Ported here (not fetched from the server) because colouring is a pure function of
  // chords already in S.chords — no round trip needed, and this view must also recolour
  // instantly after an in-browser transpose (transposeTo() just re-renders the chart).
  const MAJOR_SCALE_IVS=[0,2,4,5,7,9,11];
  const MAJOR_COLL=[]; for(let c=0;c<12;c++) MAJOR_COLL.push(new Set(MAJOR_SCALE_IVS.map(i=>mod(c+i,12))));
  const HARMONIC_MIN_COLL=[]; for(let c=0;c<12;c++){ const s=new Set(MAJOR_COLL[c]); s.delete(mod(c+7,12)); s.add(mod(c+8,12)); HARMONIC_MIN_COLL.push(s); }
  const MELODIC_MIN_COLL=[]; for(let c=0;c<12;c++){ const s=new Set(MAJOR_COLL[c]); s.delete(mod(c+5,12)); s.delete(mod(c+7,12)); s.add(mod(c+6,12)); s.add(mod(c+8,12)); MELODIC_MIN_COLL.push(s); }
  const _subset=(a,b)=>{ for(const x of a) if(!b.has(x)) return false; return true; };
  // chord_pcs(token, include_bass=False) ported straight off (root, q) — the interval
  // set a chord contributes, weighted only in the Python version for estimate_key's
  // chroma histogram; the continuity tracker only needs SET membership, so weights are
  // dropped here and this returns a plain Set of absolute pitch classes.
  function coreTones(root,q){
    const ivs=new Set([0]);
    if(q.startsWith("sus")){
      if(q.indexOf("2")<0) ivs.add(5);
      ivs.add(q.indexOf("2")>=0?2:7);
      ivs.add(7);
    } else {
      if(q[0]==="-"||q[0]==="h"||q.startsWith("o")||q.startsWith("dim")||q.startsWith("m")) ivs.add(3);
      else ivs.add(4);
      if(q.startsWith("o")||q.startsWith("dim")||q.startsWith("h")||q.indexOf("b5")>=0) ivs.add(6);
      else if(q.startsWith("+")||q.startsWith("aug")||q.indexOf("#5")>=0) ivs.add(8);
      else ivs.add(7);
    }
    if(q.indexOf("^")>=0||q.indexOf("maj7")>=0||q.indexOf("M7")>=0) ivs.add(11);
    else if((q.startsWith("o")||q.startsWith("dim")) && q.indexOf("7")>=0) ivs.add(9);
    else if(q.indexOf("6")>=0 && q.indexOf("b6")<0) ivs.add(9);
    else if(q.indexOf("7")>=0 || q[0]==="-" || q[0]==="h" || q.startsWith("m")) ivs.add(10);
    const out=new Set(); ivs.forEach(iv=>out.add(mod(root+iv,12))); return out;
  }
  function fitsCollection(tones,c,root){
    if(_subset(tones,MAJOR_COLL[c])) return true;
    if(_subset(tones,HARMONIC_MIN_COLL[c])) return true;
    if(root===mod(c+9,12) && _subset(tones,MELODIC_MIN_COLL[c])) return true;
    return false;
  }
  function cofDist(a,b){ const d=Math.abs(mod(a*7,12)-mod(b*7,12)); return Math.min(d,12-d); }
  const keyLabelName=(tonic,mode)=>note(tonic)+" "+mode;
  function labelCollection(coll,run){
    const rel=mod(coll+9,12); let majHits=0,minHits=0,needsMinor=false;
    run.forEach(c=>{
      const cls=qClass(c.q);
      if(c.root===coll && cls==="maj") majHits++;
      else if(c.root===rel && (cls==="min"||cls==="m7b5")) minHits++;
      const t=coreTones(c.root,c.q);
      if(!_subset(t,MAJOR_COLL[coll]) && _subset(t,HARMONIC_MIN_COLL[coll])) needsMinor=true;
    });
    if(minHits>majHits) return [rel,"minor"];
    if(minHits===0 && majHits===0 && needsMinor) return [rel,"minor"];
    return [coll,"major"];
  }
  function continuityScaleTrackV2(seq,homeTonic,homeMode,lookahead){
    // CAUSAL by default (Louis's locked rule 2026-07-21): "the key holds until a
    // non-diatonic chord, no lookahead, never per-chord, min=triad." The jump
    // tie-break must NOT peek at future chords — a forced jump lands on the
    // nearest circle-of-fifths collection that fits the CURRENT chord, ties broken
    // by tonic index only. Was `lookahead||2` (a 2-chord peek); now defaults to 0.
    // Matches Python theory.local_key.continuity_scale_track_v2(..., lookahead=0),
    // the single source of truth. An explicit value (incl. 2) is still honoured for
    // A/B comparison, but the shipped key track is causal.
    lookahead=(lookahead===undefined)?0:lookahead;
    const n=seq.length; if(!n) return [];
    const tones=seq.map(c=>coreTones(c.root,c.q)), roots=seq.map(c=>c.root);
    const homeColl=homeMode==="major"?homeTonic:mod(homeTonic+3,12);
    let cur=homeColl; const coll=new Array(n);
    for(let i=0;i<n;i++){

  // The prompter's SPLIT default is two stacked keyboards, one per hand —
  // right hand on top (it is what you read while playing), left below.
  // Hand split rule: the lowest note is the left hand; anything within 14
  // semitones of it that is not part of the upper structure joins it.
  function splitHands(midis){
    const s=midis.slice().sort((a,b)=>a-b);
    if(s.length<=2) return {left:s.slice(0,1), right:s.slice(1)};
    const lo=s[0];
    const left=s.filter(m=>m-lo<=14 && s.indexOf(m)<=1);
    const right=s.filter(m=>left.indexOf(m)<0);

  }

  /* One keyboard for one hand. `role` is "bass" (maroon) or "chord" (blue).
     `rng` {lo, oct} is the FIXED per-song window (Louis, 2026-08-05: the view
     must never re-frame between chords) — the handoff draft zoomed each chord
     on its own octave, which is exactly the reframe that rule bans; when rng
     is absent (one-off renders) the old per-chord zoom applies. */
  function renderHand(host, midis, h, role, rng){
    clear(host);
    host.style.cssText=`position:relative;height:${h}px;`;
    if(!midis || !midis.length) return;
    const lo = rng ? rng.lo : 12*Math.floor(Math.min(...midis)/12);
    const octaves = rng ? rng.oct
      : Math.max(1, Math.ceil((Math.max(...midis)-lo+1)/12));
    const on = new Set(midis);
    const whitePc=[0,2,4,5,7,9,11], wOrder={0:0,2:1,4:2,5:3,7:4,9:5,11:6}, bLeft={1:0,3:1,6:3,8:4,10:5};
    const nW = octaves*7, wW = 100/nW;
    const fillFor = () => role==="bass" ? T.accent : role==="opt" ? "rgba(138,43,43,.3)" : "#2a6fb0";
    const inkFor  = () => role==="opt" ? T.accent : "#fff";

    for(let o=0;o<octaves;o++) for(const pc of whitePc){
      const midi=lo+o*12+pc, slot=o*7+wOrder[pc], lit=on.has(midi);
      const k=el("div",
        `position:absolute;top:0;bottom:0;left:${slot*wW}%;width:${wW}%;`+
        `border:1px solid ${T.rule};border-radius:0 0 5px 5px;`+
        `background:${lit?fillFor():T.card};`);
      if(lit) k.appendChild(el("span",
        `position:absolute;bottom:6px;left:0;right:0;text-align:center;`+
        `font:700 12px ${UI};color:${inkFor()};`, note(midi%12)));
      host.appendChild(k);
    }
    for(let o=0;o<octaves;o++) for(const pc of [1,3,6,8,10]){
      const midi=lo+o*12+pc, slot=o*7+bLeft[pc], lit=on.has(midi);
      const k=el("div",
        `position:absolute;top:0;height:62%;left:${(slot+1)*wW - wW*0.32}%;width:${wW*0.64}%;`+
        `border-radius:0 0 4px 4px;background:${lit?fillFor():"#2b2f36"};z-index:2;`);
      if(lit) k.appendChild(el("span",
        `position:absolute;bottom:4px;left:0;right:0;text-align:center;`+
        `font:700 11px ${UI};color:${inkFor()};`, note(midi%12)));
      host.appendChild(k);
    }
  }

  /* The card. TWO independent choices (Louis, 2026-08-08 — the first cut
     conflated them): WHAT you play — a two-hand voicing (left bass, right
     shapes) or a one-hand voicing (bass folded into the single hand) — and
     HOW it is drawn — one keyboard per hand, or both hands on one keyboard
     (the layout choice only exists for two hands).
     `getTwo()`/`getOne()` return the current voicings; card._repaint() on
     chord change only. `ranges` {lh, rh, all, oh} are the fixed per-song
     windows — see renderHand. */
  function buildHandsCard(getTwo, getOne, onPlay, ranges){
    let hands=(()=>{ try{ return localStorage.getItem("harmPrompterHands")==="1"?1:2; }catch(e){ return 2; } })();
    let split=(()=>{ try{ return localStorage.getItem("harmPrompterSplit")!=="0"; }catch(e){ return true; } })();

    const card=el("div",
      `width:min(100%,460px);background:${T.card};border:1px solid ${T.line};`+
      `border-radius:${SZ.radiusLg}px;padding:12px 12px 10px;margin-top:14px;cursor:pointer;`);
    // Louis, 2026-08-08 (iPhone): the two big segmenteds ate the screen — the
    // play button ended below the fold. They live in a PIANO SETUP sheet now,
    // behind one small button; the card is names + keyboards, nothing else.
    const head=el("div","display:flex;align-items:center;gap:8px;margin-bottom:8px;");
    const names=el("div",`flex:1;min-width:0;font:600 13px ${UI};color:${T.faint};min-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`);
    head.appendChild(names);
    head.appendChild(kitButton("setup", openSetup, {small:true}));
    card.appendChild(head);
    function openSetup(){
      const back=overlay(); const sheet=sheetBox(); sheet.appendChild(handle());
      sheet.appendChild(el("div",`text-align:center;font:700 15px ${UI};color:${T.ink};margin-bottom:12px;`,"Piano"));
      const body=el("div","display:flex;flex-direction:column;gap:14px;");
      sheet.appendChild(body);
      function paintSheet(){
        clear(body);
        const row=(label,seg)=>{
          const r=el("div","display:flex;align-items:center;justify-content:space-between;gap:10px;");
          r.appendChild(el("span",`font:600 13px ${UI};color:${T.ink};`,label));
          r.appendChild(seg); return r;
        };
        body.appendChild(row("Hands", kitSegmented([[2,"Two"],[1,"One"]],
          ()=>hands,
          v=>{ hands=v; try{ localStorage.setItem("harmPrompterHands",String(v)); }catch(e){}
               paintSheet(); repaint(); },
          {inline:true, height:SZ.control, font:13})));
        if(hands===2){
          body.appendChild(row("Keyboards", kitSegmented([["split","One per hand"],["joined","One for both"]],
            ()=>split?"split":"joined",
            v=>{ split=(v==="split");
                 try{ localStorage.setItem("harmPrompterSplit", split?"1":"0"); }catch(e){}
                 paintSheet(); repaint(); },
            {inline:true, height:SZ.control, font:13})));
        }
      }
      paintSheet();
      const closeBtn=el("button",`width:100%;margin-top:14px;background:transparent;border:none;color:${T.faint};font:600 13px ${UI};padding:8px;min-height:${SZ.control}px;cursor:pointer;`,"Close");
      closeBtn.onclick=()=>closeOverlay(back);
      sheet.appendChild(closeBtn);
      back.appendChild(sheet); root.appendChild(back);
    }

    const body=el("div","display:flex;flex-direction:column;gap:9px;");
    card.appendChild(body);
    card.onclick=e=>{
      if(e.target.closest && e.target.closest("button")) return;
      const m=(hands===2?getTwo():getOne());
      if(m&&m.length&&onPlay) onPlay(m);
    };

    function row(tag, host){
      const r=el("div","display:flex;align-items:center;gap:9px;");
      r.appendChild(el("div",`flex:0 0 auto;width:26px;font:700 11px ${UI};letter-spacing:.08em;color:${T.faint};`,tag));
      host.style.flex="1"; r.appendChild(host);
      return r;
    }

    function repaint(){
      clear(body);
      if(hands===1){
        const midis=getOne()||[];
        if(!midis.length){ names.textContent=""; return; }
        names.textContent=midis.map(m=>note(m%12)).join(" ");
        const kb=el("div","");
        body.appendChild(row("", kb));
        const bass=Math.min(...midis), mp=new Map();
        midis.forEach(x=>mp.set(x,x===bass?"bass":"chord"));
        if(ranges&&ranges.oh) renderKeys(kb,mp,ranges.oh.lo,ranges.oh.oct,88,true);
        else renderVoicing(kb,midis,88,true);
        kb.style.flex="1";   // renderKeys' cssText reset drops it
        return;
      }
      const midis=getTwo()||[];
      if(!midis.length){ names.textContent=""; return; }
      if(split){
        const {left,right}=splitHands(midis);
        clear(names);
        const l=el("span",`color:${T.accent};`,"L "+left.map(m=>note(m%12)).join(" "));
        const r=el("span",`color:#2a6fb0;`,"R "+right.map(m=>note(m%12)).join(" "));
        names.appendChild(l); names.appendChild(el("span",""," · ")); names.appendChild(r);
        const rh=el("div",""), lh=el("div","");
        body.appendChild(row("R", rh));
        body.appendChild(row("L", lh));
        renderHand(rh, right, 64, "chord", ranges&&ranges.rh);
        renderHand(lh, left, 64, "bass", ranges&&ranges.lh);
        rh.style.flex="1"; lh.style.flex="1";   // renderHand's cssText reset drops it
      } else {
        names.textContent=midis.map(m=>note(m%12)).join(" ");
        const kb=el("div","");
        body.appendChild(row("", kb));
        // fixed whole-song window here too — renderVoicing would re-frame
        const bass=Math.min(...midis), mp=new Map();
        midis.forEach(x=>mp.set(x,x===bass?"bass":"chord"));
        if(ranges&&ranges.all) renderKeys(kb,mp,ranges.all.lo,ranges.all.oct,88,true);
        else renderVoicing(kb,midis,88,true);
        kb.style.flex="1";   // renderKeys' cssText reset drops it
      }
    }
    repaint();
    card._repaint=repaint;
    return card;
  }
  function playMidis(midis){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==="suspended") actx.resume();
      midis.slice().sort((a,b)=>a-b).forEach((mn,i)=>{
        const f=440*Math.pow(2,(mn-69)/12), t0=actx.currentTime+i*0.075;
        const o=actx.createOscillator(), o2=actx.createOscillator(), g=actx.createGain();
        o.type="triangle"; o2.type="sine"; o.frequency.value=f; o2.frequency.value=f*2;
        g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.16,t0+0.012);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+0.55);
        o.connect(g); o2.connect(g); g.connect(actx.destination);
        o.start(t0); o2.start(t0); o.stop(t0+0.6); o2.stop(t0+0.6);
      });
    }catch(e){}
  }

  // ── smooth voice-leading cascade (pedagogical spec §9): voice each chord to
  // minimise hand movement from the voicing actually chosen for the PREVIOUS
  // chord — "hold what's already in place, move only what must move". Two
  // deliberate departures from §9's own candidate description, both because
  // §11 (written later the same day, from Louis's explicit reasoning) governs
  // candidate generation: (1) no close-position inversions — an inversion
  // changes the sounding bass, which §11 forbids; the variety comes from
  // styles and octave registers instead, with upper voices free; (2) every
  // non-rootless candidate is guaranteed to sound the chord's INTENDED bass
  // lowest (drop-2 therefore gets the bass added beneath its spread, which is
  // how a pianist actually plays it — left hand root, right hand drop-2).
  // Rootless stays the one documented exception: the bassist plays the root.
  const VOICE_PEN=7;                       // per unmatched voice (§9)
  const PERMS={};
  function permsOf(n){
    if(PERMS[n]) return PERMS[n];
    const out=[];
    (function rec(cur,rest){
      if(!rest.length){ out.push(cur.slice()); return; }
      for(let i=0;i<rest.length;i++){ cur.push(rest[i]); rec(cur,rest.slice(0,i).concat(rest.slice(i+1))); cur.pop(); }
    })([],[...Array(n).keys()]);
    PERMS[n]=out; return out;
  }
  const meanOf=a=>a.reduce((s,v)=>s+v,0)/a.length;
  // Movement between two voicings = minimum-cost bipartite matching of their
  // note sets (brute-forced; n is tiny). Common tones match at distance 0 and
  // are thus "held". `pure` returns semitone motion only — that is the number
  // quoted to the reader; the cost used for CHOOSING adds the voice-count
  // penalty and a small register-drift tiebreak.
  function assignCost(a,b,pure){
    const big=a.length>=b.length?a:b, sml=a.length>=b.length?b:a;
    const n=big.length, m=sml.length;
    let best=Infinity;
    if(n<=6){
      permsOf(n).forEach(p=>{
        let c=0; for(let i=0;i<m;i++) c+=Math.abs(sml[i]-big[p[i]]);
        if(c<best) best=c;
      });
    } else {                                  // never hit today; keeps it total
      best=0; for(let i=0;i<m;i++) best+=Math.abs(sml[i]-big[i]);
    }
    if(pure) return best;
    return best + VOICE_PEN*(n-m) + 0.15*Math.abs(meanOf(a)-meanOf(b));
  }
  function ensureBass(midis,bassPc){
    const lo=Math.min(...midis);
    if(mod(lo,12)===bassPc) return midis;
    let bp=48+bassPc; while(bp>=lo) bp-=12;
    return [bp].concat(midis);
  }
  const VL_STYLES=[["close",voClose],["shell",voShell],["rootless A",voRootlessA],
                   ["rootless B",voRootlessB],["drop-2",voDrop2]];
  // freeBass (2026-08-05, prompter two-hand mode): the LEFT hand carries the
  // bass, so the right hand's shapes drop the keep-the-bass-lowest constraint
  // (§11 applies to one-hand illustration) — inversions (index-0 lifts) and
  // rootless shapes all become legal, which is what lets the cascade keep the
  // hand nearly still.
  function vlCandidates(root,q,level,bass,freeBass){
    const styles = level>=3 ? VL_STYLES : VL_STYLES.slice(0,2);
    const bassPc = (bass!=null&&bass>=0)?mod(bass,12):mod(root,12);
    const out=[];
    const push=(name,m)=>{
      if(Math.min(...m)<48 || Math.max(...m)>83) return;     // C3–B5 hand window
      out.push({style:name, midis:m.slice().sort((a,b)=>a-b)});
    };
    styles.forEach(([name,fn])=>{
      const base=fn(root,q); if(!base) return;
      const rootless=name.indexOf("rootless")===0;
      if(freeBass){
        // STANDARD COMPACT INVERSIONS only (Louis, 2026-08-06: the free
        // per-voice lifts produced one-hand-unplayable spreads): cyclic
        // rotations of the shape, octave-shifted, hard-capped at an octave
        // of span so the right hand always covers the voicing.
        let inv=base.slice().sort((a,b)=>a-b);
        for(let r=0;r<inv.length;r++){
          [-12,0,12].forEach(sh=>{
            const m=inv.map(x=>x+sh);
            if(Math.max.apply(null,m)-Math.min.apply(null,m)<=12)
              push(r?name+" inv"+r:name, m);
          });
          inv=inv.slice(1).concat(inv[0]+12);
        }
        return;
      }
      [-12,0,12].forEach(sh=>{
        let m=base.map(x=>x+sh).sort((a,b)=>a-b);
        if(!rootless) m=ensureBass(m,bassPc);
        push(name,m);
        // §11 explicitly allows the UPPER voices to be reordered/reregistered
        // freely — only the bass is fixed. Without this the cascade can only
        // shift a whole voicing by octaves, which on a triad-heavy chart
        // leaves it almost nothing to choose from (measured: This Love barely
        // improved before this). One voice moved at a time keeps the
        // candidate set small and the voicings playable.
        for(let i=1;i<m.length;i++){
          const up=m.slice(); up[i]+=12; push(name,up);
        }
        if(m.length>2){
          const dn=m.slice(); dn[m.length-1]-=12;
          if(dn[m.length-1]>m[0]) push(name,dn);
        }
      });
    });
    if(!out.length) out.push({style:"close",
      midis:freeBass?voClose(root,q).slice().sort((a,b)=>a-b):ensureBass(voClose(root,q),bassPc)});
    return out;
  }
  // The cascade runs over S.chords in RENDER order — the order the chart is
  // read. A folded repeat re-enters its section from the written voicing
  // rather than continuing the previous pass's hand position.
  function voiceLeadTrack(){
    const lv=learnLevel(), track=new Array(S.chords.length).fill(null);
    let prev=null;
    S.chords.forEach((ch,i)=>{
      if(ch.nc) return;
      const cands=vlCandidates(ch.root,dispQ(ch.q),lv,(lv>=3)?ch.bass:-1);
      let best=null,bestC=Infinity;
      cands.forEach(c=>{
        // First chord: anchor near mid-register, preferring plain close.
        const cost = prev ? assignCost(prev.midis,c.midis,false)
                          : Math.abs(meanOf(c.midis)-64)+(c.style==="close"?0:4);
        if(cost<bestC){ bestC=cost; best=c; }
      });
      track[i]=best; prev=best;
    });
    return track;
  }
  function vlTrack(){
    const k=learnLevel()+":"+S.key+":"+S.chords.length+":"+(S._vlBump||0);
    if(S._vlKey!==k){ S._vlTrack=voiceLeadTrack(); S._vlKey=k; S._vlTotals=null; }
    return S._vlTrack;
  }
  // Both totals, so the effect is inspectable rather than asserted (spec §9's
  // flow panel printed the same pair).
  function vlTotals(){
    // vlTrack() FIRST: it is what clears a stale total when the level or key
    // changed. Checking the cache before calling it handed back the previous
    // level's numbers unchanged (caught 2026-08-02 by comparing L3 vs L1).
    const t=vlTrack(), lv=learnLevel();
    if(S._vlTotals) return S._vlTotals;
    let smooth=0, naive=0, prevS=null, prevN=null;
    S.chords.forEach((ch,i)=>{
      if(!t[i]) return;
      const bassPc=(lv>=3&&ch.bass!=null&&ch.bass>=0)?mod(ch.bass,12):mod(ch.root,12);
      const nv=ensureBass(voClose(ch.root,dispQ(ch.q)),bassPc);
      if(prevS) smooth+=assignCost(prevS,t[i].midis,true);
      if(prevN) naive+=assignCost(prevN,nv,true);
      prevS=t[i].midis; prevN=nv;
    });
    S._vlTotals={smooth:Math.round(smooth), naive:Math.round(naive)};
    return S._vlTotals;
  }

  // ── Learn-mode difficulty ladder (Axis-A reduction, pedagogical spec §2 +
  // concept-engine RED). Pure quality→quality relabel: L1 = triads only,
  // L2 = the three everyday 7ths (^7/7/-7), L3 = full detected vocabulary.
  // Root and timing NEVER change; monotone (L1 ⊂ L2 ⊂ L3). Extended app
  // tokens (9/13/alterations, sus, h7…) map to their family per the same
  // logic; sus keeps its sus flavour at every level (a sus4 IS a triad —
  // relabelling it major would invent a 3rd the song doesn't play).
  const RED={
    1:{"":"","^7":"","^":"","^9":"","6":"","69":"","7":"","9":"","13":"","7b9":"","7#9":"","7b5":"","7#11":"",
       "-":"-","-7":"-","-6":"-","-^7":"-","-9":"-",
       "-7b5":"o","h7":"o","h":"o","o":"o","o7":"o",
       "+":"+","+7":"+","sus":"sus","sus2":"sus2","sus4":"sus4","7sus":"sus4","7sus4":"sus4"},
    2:{"":"","^7":"^7","^":"^7","^9":"^7","6":"","69":"","7":"7","9":"7","13":"7","7b9":"7","7#9":"7","7b5":"7","7#11":"7",
       "-":"-","-7":"-7","-6":"-","-^7":"-7","-9":"-7",
       "-7b5":"o","h7":"o","h":"o","o":"o","o7":"o",
       "+":"+","+7":"7","sus":"sus","sus2":"sus2","sus4":"sus4","7sus":"sus4","7sus4":"sus4"}
  };
  function reduceQ(q,lv){ return lv>=3?q:(RED[lv][q]!=null?RED[lv][q]:q); }
  function dispQ(q){ return S.learn?reduceQ(q,S.level):q; }
  function learnLevel(){ return S.learn?S.level:3; }

  // ── visualisation preferences sheet (theme, notation, CoF colours, paper).
  // A pref change mutates T (applyTheme) then rebuilds everything currently
  // on screen, including the transport (built once, so it holds stale colours
  // otherwise). The Audio element itself is untouched — playback continues.
  function rebuildChrome(){
    // The dock + coach panel are part of renderChart's tree, so go() rebuilds
    // them; just drop the stale references first (the Audio element itself is
    // untouched — playback continues).
    S._coachPanel=null; S._coachGlyph=null; S._coachNames=null; S._coachKb=null; S._coachNote=null;
    S._playBtn=null; S._dockFill=null; S._dockNow=null; S._dockWhere=null; S._dockEnd=null;
    root.style.background=T.bg;
    go(S.screen,{push:false});
    if(S.coach && S._lastCoachIdx!=null) paintCoachChord(S._lastCoachIdx);
  }
  // UI refresh 2026-08-08 (§2): this sheet is now the home of everything the
  // old chart chrome carried as sub-44px toggles — Learn + its level ladder,
  // Follow, Metronome, Coach — plus Share. One family of controls, all 44px.
  function openPrefsSheet(){
    const back=overlay(); const sheet=sheetCol(); sheet.appendChild(handle());
    sheet.appendChild(el("div",`flex:0 0 auto;font:600 9px ${UI};letter-spacing:.06em;text-transform:uppercase;color:${T.faint};margin-bottom:12px;`,"Preferences"));
    const body=el("div","flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;"); body.className="ap-scroll";
    function seg(label,opts,get,set){
      const row=el("div","display:flex;align-items:center;justify-content:space-between;gap:10px;");
      row.appendChild(el("span",`font:600 13px ${UI};color:${T.ink};`,label));
      const sg=kitSegmented(opts,get,v=>{ set(v); closeOverlay(back); rebuildChrome(); },
        {inline:true, height:SZ.control, font:13});
      row.appendChild(sg); return row;
    }
    body.appendChild(seg("Theme",[["light","Light"],["dark","Dark"]],()=>PREF.theme,v=>{ PREF.theme=v; try{localStorage.setItem("harmTheme",v);}catch(e){} applyTheme(); }));
    body.appendChild(seg("Notation",[["normal","Normal"],["compact","Compact"]],()=>PREF.notation,v=>{ PREF.notation=v; try{localStorage.setItem("harmNotation",v);}catch(e){} }));
    body.appendChild(seg("Key colours",[["on","On"],["off","Off"]],()=>PREF.cof?"on":"off",v=>{ PREF.cof=(v==="on"); try{localStorage.setItem("harmCof",PREF.cof?"1":"0");}catch(e){} }));
    const pl=el("div","display:flex;align-items:center;justify-content:space-between;gap:10px;");
    pl.appendChild(el("span",`font:600 13px ${UI};color:${T.ink};`,"Chart colour"));
    const sw=el("div","display:flex;gap:8px;");
    [["#f7f3e9","Cream"],["#ffffff","White"],["#efe3cb","Sepia"],["#eef1ec","Cool"]].forEach(([col,nm])=>{
      const b=el("button",`width:${SZ.control}px;height:${SZ.control}px;border-radius:${SZ.radius}px;border:2px solid ${PREF.paper===col?T.accent:T.line};background:${col};cursor:pointer;`);
      b.title=nm;
      b.onclick=()=>{ PREF.paper=col; try{localStorage.setItem("harmPaper",col);}catch(e){} applyTheme(); closeOverlay(back); rebuildChrome(); };
      sw.appendChild(b);
    });
    pl.appendChild(sw);
    body.appendChild(pl);
    if(PREF.theme==="dark") body.appendChild(el("div",`font:italic 11.5px ${SERIF};color:${T.faint};`,"Chart colour applies to the light theme."));
    // reading level — was the Learn pill + the ladder row above the grid
    body.appendChild(seg("Chords",[["advanced","Full detail"],["learn","Learn"]],
      ()=>S.learn?"learn":"advanced",
      v=>{ S.learn=(v==="learn"); try{ localStorage.setItem("harmLearn",S.learn?"1":"0"); }catch(e){} }));
    if(S.learn){
      body.appendChild(seg("Level",[[1,"L1 triads"],[2,"L2 7ths"],[3,"L3 full"]],
        ()=>S.level,
        v=>{ S.level=v; try{ localStorage.setItem("harmLearnLevel",String(v)); }catch(e){} }));
      body.appendChild(el("div",`font:italic 12px ${SERIF};color:${T.faint};margin-top:-8px;`,LEVEL_CAPTION[S.level]));
    }
    // Louis, 2026-08-09 : taper une mesure y emmène le curseur et joue. « Chord
    // sheet » est l'ancien comportement (la feuille piano + voicings), gardé
    // parce que c'est là qu'on édite un accord en Read.
    body.appendChild(seg("Tap a bar",[["play","Play from there"],["sheet","Chord sheet"]],
      ()=>S.tapSeek?"play":"sheet",
      v=>{ S.tapSeek=(v==="play");

  // ── diatonic-vs-altered upper extensions (pedagogical spec §10.3). The
  // three upper slots are the NATURAL intervals above the root: 9th = R+2,
  // 11th = R+5, 13th = R+9. Each is read against the song's home-key scale:
  // in the scale = a safe added colour; outside it = snap to the nearest
  // scale tone, and THAT is the alteration the key actually wants (♭9/♯9/
  // ♯11/♭13) — standard secondary-dominant practice. The natural 11 over a
  // major 3rd is flagged separately as an avoid note (a semitone above the
  // 3rd clashes; jazz raises it to ♯11). Spec's stated frame, kept: tensions
  // are read off the PREVAILING key, not the chord's own secondary key, so a
  // secondary dominant's tensions read "altered" relative to home. Shown only
  // at L3 and only for chords that have a 7th.
  const EXT_SLOTS=[[2,"9"],[5,"11"],[9,"13"]];
  // An altered tension is spelled by its OWN accidental, not by the chart's
  // key spelling: a ♯11 printed "D♭" contradicts its own label. Diatonic
  // slots keep the key's spelling, since they belong to that scale.
  const spellAs=(pc,sharp)=>(sharp?SHARP:FLAT)[mod(pc,12)];
  function classifyExtensions(root,q){
    const scaleRoot = (S.keyMode==="minor")?mod(S.key+3,12):S.key;
    const scale=MAJOR_COLL[scaleRoot];
    const iv=CE_IV[q]||CE_IV[""];
    const majThird=iv.indexOf(4)>=0;
    return EXT_SLOTS.map(([semi,name])=>{
      const pc=mod(root+semi,12);
      if(name==="11" && majThird){
        return {name, kind:"avoid", label:"♯11", note:spellAs(mod(root+6,12),true),
                why:"the natural 11 sits a semitone above the 3rd — raise it to ♯11"};
      }
      if(scale.has(pc)) return {name, kind:"diatonic", label:name, note:note(pc),
                                why:"in the key — a safe added colour"};
      const dn=mod(pc-1,12), up=mod(pc+1,12);
      const to = scale.has(dn)?dn:(scale.has(up)?up:null);
      if(to===null) return {name, kind:"diatonic", label:name, note:note(pc), why:"outside the key"};
      const down = (to===dn);
      const label = name==="9" ? (down?"♭9":"♯9") : name==="11" ? "♯11" : (down?"♭13":"♯13");
      return {name, kind:"altered", label, note:spellAs(to,label.indexOf("♯")>=0),
              why:"borrowed to fit the key — the tension it actually wants here"};
    });
  }
  function buildExtensions(root,q){
    if(!sev4(q)) return null;
    const box=el("div","flex:0 0 auto;");
    box.appendChild(el("div",`font:600 9px ${UI};letter-spacing:.06em;text-transform:uppercase;color:${T.faint};margin:14px 0 8px;`,"Colours you can add"));
    const row=el("div","display:flex;gap:8px;");
    const COL={diatonic:T.green, altered:T.amber, avoid:T.faint};
    classifyExtensions(root,q).forEach(x=>{
      const c=el("div",`flex:1;min-width:0;background:${T.paper};border:1px solid ${T.line};border-left:3px solid ${COL[x.kind]};border-radius:9px;padding:7px 8px;`);
      const h=el("div","display:flex;align-items:baseline;gap:5px;");
      h.appendChild(el("span",`font:italic 700 15px ${SERIF};color:${T.ink};`,x.label));
      h.appendChild(el("span",`font:600 11px ${UI};color:${COL[x.kind]};`,x.note));
      c.appendChild(h);
      c.appendChild(el("div",`font:500 9.5px ${UI};color:${T.faint};margin-top:3px;line-height:1.3;`,x.why));
      row.appendChild(c);
    });
    box.appendChild(row);
    return box;
  }

  // bass accented, then the level's alternate voicings side by side.
  function openChordSheet(idx){
    const ch=S.chords[idx]; if(!ch||ch.nc) return;

    const closeBtn=el("button",`flex:0 0 auto;width:100%;margin-top:12px;background:transparent;border:none;color:${T.faint};font:600 13px ${UI};padding:8px;min-height:44px;cursor:pointer;`,"Close");
    closeBtn.onclick=()=>closeOverlay(back);
    sheet.appendChild(closeBtn);
    back.appendChild(sheet); root.appendChild(back);
    // draw + sound the default (close) voicing
    selCard=cards[0];
    const m0=selCard.rootless?selCard.midis:withBass(selCard.midis,ch.root,bass);
    renderVoicing(kb,m0,92,true);
    [...strip.children].forEach(c=>{ c.style.outline=(c._card===selCard)?`2.5px solid ${T.accent}`:""; c.style.outlineOffset=(c._card===selCard)?"1px":""; });

  // ── Harte parsing — the /api/reinfer response is the ONE place labels are
  // Harte ("G:hdim7"), because that is the model's native tongue.
  const NOTE_PC={C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11};
  const HARTE_Q={maj:"",maj7:"^7",min:"-",min7:"-7","7":"7",hdim7:"-7b5",dim:"o",dim7:"o7","6":"6",min6:"-6",maj6:"6","9":"9","min9":"-7"};
  function parseLabel(l){ if(!l) return {root:0,q:""}; const p=String(l).split(":"); return { root: NOTE_PC[p[0]]!=null?NOTE_PC[p[0]]:0, q: HARTE_Q[p[1]]!=null?HARTE_Q[p[1]]:(p[1]||"") }; }
  function overlaps(a0,a1,b0,b1){ return Math.min(a1,b1)-Math.max(a0,b0) > 1e-6; }

  // ── Training-mode ground truth (McGill Billboard hand annotations) ──────
  // Only present on model.gt for songs from the training corpus (see
  // scripts/harmonia_server.py:_gt_chords_for_video) — pasted YouTube links
  // have no model.gt and render nothing here. Labels arrive in raw Harte
  // notation ("C:min7", "N"); parseLabel() is the same parser the reinfer
  // diff view uses, so GT typesets with the exact glyph vocabulary (TOK) the
  // inferred chords already use.
  function gtForSpan(t0,t1){
    if(!S.model || !S.model.gt || !S.model.gt.length) return null;
    const hits=S.model.gt.filter(g=>overlaps(t0,t1,g.t0,g.t1));
    if(!hits.length) return null;
    // dominant overlap first — boundary mismatches are expected (independent
    // beat grids), so just show the GT chord that covers most of this span.
    hits.sort((a,b)=>(Math.min(t1,b.t1)-Math.max(t0,b.t0))-(Math.min(t1,a.t1)-Math.max(t0,a.t0)));
    const main=hits[0];
    // "N" = no chord (silence/intro); "X" = McGill Billboard's own "can't
    // tell" marker — neither is a real root+quality, so both render as N.C.
    // rather than mis-parsing as a bogus C major (parseLabel would otherwise
    // silently default an unrecognised note letter to root 0).
    if(main.label==="N"||main.label==="X"){
      return {parsed:null, text:"N.C.", extra:hits.length>1};
    }
    const parsed=parseLabel(main.label);
    const text=note(parsed.root)+(TOK[parsed.q]!=null?TOK[parsed.q]:parsed.q);
    return {parsed, text, extra:hits.length>1};
  }
  // A GT hit "matches" the inferred chord at the family level (root + maj/
  // min/dom/dim/m7b5 class) — partial credit, not exact-voicing equality;
  // per project convention a maj7 vs maj GT disagreement isn't worth flagging.
  function gtMatches(gt,ch){
    if(!gt || !gt.parsed) return false;
    return gt.parsed.root===ch.root && qClass(gt.parsed.q)===qClass(ch.q);
  }
  function fmt(s){ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

  const api={
    async get(u){ const r=await fetch(u,{headers:{"Accept":"application/json"}}); if(!r.ok) throw new Error(await r.text()); return r.json(); },
    async post(u,b){ const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); },
    async del(u){ const r=await fetch(u,{method:"DELETE"}); if(!r.ok) throw new Error(await r.text()); return r.json(); },
  };

  // ══════════════════════════════════════════════════════════════
  const API={};
  let root, S;

  API.build=function(host){
    root=host;
    root.style.cssText="position:relative;height:100%;background:"+T.bg+";overflow:hidden;font-family:"+UI+";color:"+T.ink+";";
    S={ screen:null, mode:"read", colorMode:"function", model:null, chords:[], sections:[],
        key:0, pending:[], spans:[], mergeMode:false, playing:false, playBar:-1, playRate:1,
        playRep:null, playTime:null, reinfering:false,
        library:[], results:[], searching:false, job:null, audio:null, rafId:null, _cells:[],
        // Raffinement en tâche de fond (2026-08-07) : `refining` = {file,id,what}
        // tant que le serveur calcule sections + gamme derrière le chart brut
        // affiché ; `refineReady` = le fichier dont le raffinement est arrivé
        // mais qu'on n'a PAS rechargé (annotation en cours) — Louis décide.
        refining:null, refineReady:null,
        // Library sort/edit (UX audit 2026-07-20 — there was no way to sort
        // or delete charts). Sort choice persists across relaunches.
        librarySort:(()=>{ try{return localStorage.getItem("harmLibrarySort")||"recent";}catch(e){return "recent";} })(),
        libraryEdit:false,
        // source de recherche (delta2 §9): youtube | ireal | tabs — persistée
        searchMode:(()=>{ try{ const v=localStorage.getItem("harmSearchMode");
          return (v==="ireal"||v==="tabs")?v:"youtube"; }catch(e){ return "youtube"; } })(),
        // paged YouTube search (2026-08-04) — infinite scroll state
        searchPage:0, searchMore:false, searchLoading:false, searchQuery:"",
        // Learn mode + difficulty ladder (new-chord-ux handoff #1). Persists
        // like the other reading prefs; level defaults to L2 (the everyday
        // 7ths), matching the pedagogical prototype's default.
        learn:(()=>{ try{return localStorage.getItem("harmLearn")==="1";}catch(e){return false;} })(),
        level:(()=>{ try{const v=parseInt(localStorage.getItem("harmLearnLevel"),10);return (v>=1&&v<=3)?v:2;}catch(e){return 2;} })(),
        // Accords au piano pendant la lecture (delta2 §6): "never" | "tap" |
        // "follow". "follow" EST l'ancien Voicing coach (harmCoach) — un seul
        // réglage, pas deux commandes qui disent la même chose; migration:
        // harmCoach==="1" devient "follow", sinon "tap" (le défaut).
        piano:(()=>{ try{ const v=localStorage.getItem("harmPiano");
          if(v==="never"||v==="tap"||v==="follow") return v;
          return localStorage.getItem("harmCoach")==="1" ? "follow" : "tap"; }catch(e){ return "tap"; } })(),
        // Louis, 2026-08-09 : « quand je clique sur une barre, le curseur va
        // jouer depuis cette barre (option modifiable dans les paramètres) ».
        // Défaut ON — c'est ce qu'il a demandé ; OFF rend le tap à la feuille
        // d'accord (piano + voicings), qui était l'ancien comportement.
        tapSeek:(()=>{ try{ return localStorage.getItem("harmTapSeek")!=="0"; }
                       catch(e){ return true; } })(),
        // S.coach reste le booléen que tout le câblage existant lit (dock,
        // timeupdate, syncTransport) — dérivé de piano, jamais réglé seul.
        coach:false,
        coachStyle:(()=>{ try{return localStorage.getItem("harmCoachStyle")||"close";}catch(e){return "close";} })(),
        // 2026-07-20 metronome (game-changer #2, scoped down to "just a click
        // on chord changes" per user's explicit choice — no accompaniment
        // synth). Persists across relaunches like librarySort.
        metronome:(()=>{ try{return localStorage.getItem("harmMetronome")==="1";}catch(e){return false;} })(),
        billboard:[], billboardLoading:false, billboardLoaded:false,
        // 2026-07-18: bar-merge SUGGESTIONS overlay (ported from the baked
        // chart_interactive.py template's #suggest-mode-btn — see loadModel()
        // and paintSuggestions() below for the full port notes).
        // suggHighlightFamily: 2026-07-18 later same day, user request — a
        // tapped bar's whole "family" (its connected component in the
        // candidate-pair graph: a pairs with b, b pairs with c => a/b/c are
        // one family) highlights together so all mutually-similar bars are
        // visible at a glance, not just the one pair the badge names.
        suggMode:false, suggCandidates:null, suggDismissed:new Set(), suggConfirmed:new Set(),
        suggHighlightFamily:null,
        // 2026-07-18, later same day: SECTION-level (8-bar) suggestions —
        // see paintSectionSuggestions() below for the full rationale. Kept
        // as separate state from the bar-level suggMode fields above (not
        // reused) since the two tools have different data shapes (block
        // pairs of 8-bar RANGES vs single bar indices) and different
        // confidence semantics that must never be conflated.
        sectSuggMode:false, sectSuggCandidates:null, sectSuggMeta:{},
        sectSuggDismissed:new Set(), sectSuggConfirmed:new Set() };
    S.coach=(S.piano==="follow");
    // 2026-07-18: deep-link support — /chart/<file> (serve_chart) now
    // redirects here as /?open=<file> for any chart that doesn't carry a
    // baked-HTML-only feature (see harmonia_server.py's serve_chart), so a
    // bookmark/link/swipe-nav landing on an old-style chart URL opens
    // straight into this SPA's own chart view instead of stopping on the
    // plain server-rendered library list. Falls back to the library on any
    // failure (openChart's own catch already does this).
    const openFile = new URLSearchParams(location.search).get("open");
    if(openFile){ openChart(openFile); } else { go("library"); }
    loadLibrary();
  };

  // Real browser history (UX audit 2026-07-20: there was no way to navigate
  // back except the small in-app "‹" button — no Safari swipe-back gesture,
  // no hardware/software back button support, because go() never touched
  // `history`). Every screen change now pushes a state; popstate replays the
  // same navigation with push:false so it doesn't re-push on the way back.
  window.addEventListener("popstate",(e)=>{
    const st=e.state;
    if(!st){ go("library",{push:false}); return; }
    if(st.screen==="chart" && st.file){ openChart(st.file,{push:false}); }
    else if(st.screen==="prompter" && st.file){
      if(S.model && S.model.file===st.file) go("prompter",{push:false});
      else openChart(st.file,{push:false});
    }
    else{ go(st.screen||"library",{push:false}); }
  });

  function screenWrap(){ return el("div","position:absolute;inset:0;display:flex;flex-direction:column;animation:ap-fade .28s ease both;"); }
  /* Un re-rendu du chart repartait toujours EN HAUT. Pendant l'annotation,
     chaque geste (lettre choisie, mesure marquée, occurrence retirée)
     redessine — donc l'écran resautait au début du morceau à chaque fois,
     alors qu'on travaille au milieu. Louis, 2026-08-12 : « dès que je
     modifie un truc, ça resnap en haut de l'écran, c'est trop chiant ».
     On mémorise la position de défilement du chart avant de détruire le
     DOM et on la remet après. */
  function chartScroll(){
    const el=root.querySelector(".ap-scroll");
    return el?el.scrollTop:null;
  }
  function restoreChartScroll(top){
    if(top==null) return;
    // On réessaie sur quelques trames : tant que la grille n'est pas mise en
    // page, le conteneur n'a pas encore sa hauteur et le navigateur RABOTE
    // silencieusement scrollTop à 0 (c'est ce qui faisait échouer la
    // première version).
    let n=0;
    const put=()=>{
      const el=root.querySelector(".ap-scroll");
      if(el){
        el.scrollTop=top;
        if(Math.abs(el.scrollTop-top)<2) return;      // posé
      }
      if(++n<8) requestAnimationFrame(put);
    };
    put();
  }
  function go(screen,opts){
    const push = !opts || opts.push!==false;
    // même écran = même travail en cours : on garde la position
    const keepTop = (screen==="chart" && S.screen==="chart") ? chartScroll() : null;
    // chart ↔ prompter are two faces of the SAME playback session — audio
    // keeps running across the switch, and only stops on leaving both.
    const inPlayer=s=>s==="chart"||s==="prompter";
    if(inPlayer(S.screen) && !inPlayer(screen)) stopPlayback();
    S.screen=screen;
    [...root.children].forEach(c=>root.removeChild(c));
    let elS;
    if(screen!=="charts") S.openFolder=null;   // delta2 §8: le dossier ouvert ne survit pas à la sortie
    if(screen==="library") elS=renderLibrary();
    else if(screen==="charts") elS=renderCharts();
    else if(screen==="search") elS=renderSearch();
    else if(screen==="billboard") elS=renderBillboard();
    else if(screen==="analysing") elS=renderLoading();
    else if(screen==="record") elS=renderRecord();
    else if(screen==="jam") elS=renderJam();
    else if(screen==="prompter") elS=renderPrompter();
    else elS=renderChart();
    S._screenEl=elS; root.appendChild(elS);
    if(keepTop!=null) restoreChartScroll(keepTop);   // après l'insertion
    syncTransport(screen);
    if(push){
      const file=(inPlayer(screen) && S.model) ? S.model.file : null;
      history.pushState({screen,file}, "", "#/"+(file?(screen+"/"+encodeURIComponent(file)):screen));
    }
  }
