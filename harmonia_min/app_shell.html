    const tw=el("div","flex:1;min-width:0;");
    const wm=el("div",`font:italic 600 17px ${SERIF};color:${T.ink};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`);
    if(title) wm.textContent=title; else wm.innerHTML='harmon<span style="color:'+T.accent+'">ia</span>';
    tw.appendChild(wm);
    if(sub) tw.appendChild(el("div",`font:500 12px ${UI};color:${T.faint};margin-top:1px;`,sub));
    bar.appendChild(tw);
    return bar;
  }

  // ── 1. LIBRARY / SEARCH ─────────────────────────────────────────────────
  async function loadLibrary(){
    try{ const r=await api.get("/api/library"); S.library=r.charts||[]; if(S.screen==="library") go("library"); }
    catch(e){ S.library=[]; }
  }
  // ── l'accueil à deux univers (delta2 §8 / design 5a) ─────────────────────
  // Louis, 2026-08-08: « l'écran d'accueil devrait être + simpliste — on vire
  // le training mode et section cleanup, et je veux qu'il y ait 2 univers:
  // chercher une nouvelle chanson et consulter mes charts; pour mes charts je
  // peux créer des folders pour les trier; les chansons sont nommées
  // artiste / chanson. » L'accueil ne liste plus rien: deux portes et
  // Reprendre. La liste vit derrière la deuxième porte (renderCharts).
  // renderBillboard reste routable (deep-link) mais n'a plus de porte ici.

  // nommage artiste / chanson: le titre YouTube est sale (« (Official
  // Video) », « HD », « feat. »). Nettoyé à l'affichage SEULEMENT — jamais
  // dans le fichier, qui reste la clé. `artist` vient du serveur quand il l'a
  // (POST /api/chart-meta), sinon séparation sur le premier tiret.
  const _NOISE=/\s*[\(\[](official|lyric|audio|video|hd|4k|remaster\w*|live|mv)[^\)\]]*[\)\]]/ig;
  function chartName(c){
    if(c.artist) return {artist:c.artist, title:c.title||""};
    const t=(c.title||"").replace(_NOISE,"").trim();
    const m=t.match(/^(.{2,40}?)\s+[-–—]\s+(.+)$/);
    return m ? {artist:m[1].trim(), title:m[2].trim()} : {artist:"", title:t};
  }
  // « Artiste / Chanson »: artiste en gris, titre en encre. Une seule ligne,
  // ellipse à droite — jamais deux lignes, la liste doit se scanner.
  function nameEl(c, size){
    const n=chartName(c);
    const w=el("div",
      `font:600 ${size||16}px ${UI};color:${T.ink};`+
      `white-space:nowrap;overflow:hidden;text-overflow:ellipsis;`);
    if(n.artist){
      w.appendChild(el("span",`color:${T.faint};font-weight:500;`, n.artist));
      w.appendChild(el("span",`color:${T.faint};font-weight:500;`, " / "));
    }
    w.appendChild(el("span","", n.title));
    return w;
  }

  // ── dossiers ─────────────────────────────────────────────────────────────
  // Un chart appartient à AU PLUS un dossier (c'est un classeur, pas des
  // tags): « ranger » vide « Hors dossier ». Si des tags deviennent
  // nécessaires un jour, ce sera une autre fonctionnalité. Stockage:
  // localStorage source de vérité, POST /api/folders en write-through (le
  // serveur en garde une copie). Un chart supprimé disparaît des dossiers
  // tout seul parce qu'on filtre toujours sur S.library.
  const FOLDERS_KEY="harmFolders";
  function loadFolders(){
    try{ return JSON.parse(localStorage.getItem(FOLDERS_KEY))||{order:[],of:{}}; }
    catch(e){ return {order:[],of:{}}; }
  }
  function saveFolders(f){
    try{ localStorage.setItem(FOLDERS_KEY, JSON.stringify(f)); }catch(e){}
    api.post("/api/folders", f).catch(()=>{});
  }
  function folderCount(name){
    const f=S.folders||loadFolders();
    return S.library.filter(c=>f.of[c.file]===name).length;
  }

  function renderLibrary(){
    NOTES=FLAT;
    S.folders=loadFolders();
    const w=screenWrap();

    const head=el("div",`flex:0 0 auto;padding:calc(14px + env(safe-area-inset-top)) 20px 22px;`);
    const logo=el("div",`font:italic 600 30px ${SERIF};color:${T.ink};`);
    logo.innerHTML='harmon<span style="color:'+T.accent+'">ia</span>';
    head.appendChild(logo);
    head.appendChild(el("div",`font:italic 14px ${SERIF};color:${T.faint};margin-top:3px;`,
      "l'harmonie de n'importe quelle chanson"));
    w.appendChild(head);

    const body=el("div",
      `flex:1;min-height:0;overflow-y:auto;padding:0 20px;display:flex;flex-direction:column;gap:14px;`);
    body.className="ap-scroll";

    // porte 1 — chercher. Le champ est DANS la carte: on ne fait pas taper
    // l'utilisateur sur un écran pour l'emmener sur un autre où il retape.
    const seek=el("div",
      `background:${T.card};border:1.5px solid ${T.accent};border-radius:20px;padding:18px 18px 20px;cursor:pointer;`);
    seek.appendChild(el("div",
      `font:700 11px ${UI};letter-spacing:.08em;text-transform:uppercase;color:${T.accent};`,"Chercher"));
    seek.appendChild(el("div",`font:600 22px ${UI};margin-top:6px;`,"Une nouvelle chanson"));
    seek.appendChild(el("div",`font:italic 13.5px/1.5 ${SERIF};color:${T.faint};margin-top:5px;`,
      "un titre, un artiste"));
    const sfield=el("div",
      `margin-top:14px;height:52px;border-radius:14px;background:${T.paper};`+
      `border:1px solid ${T.line};display:flex;align-items:center;gap:10px;padding:0 16px;`);
    sfield.appendChild(el("span",`font:400 17px ${UI};color:${T.rule};`,"⌕"));
    sfield.appendChild(el("span",`font:500 15px ${UI};color:${T.rule};`,"Autumn Leaves"));
    seek.appendChild(sfield);
    seek.onclick=()=>go("search");
    body.appendChild(seek);

    // porte 2 — mes charts
    const mine=el("div",
      `background:${T.card};border:1px solid ${T.line};border-radius:20px;padding:18px;`+
      `display:flex;align-items:center;gap:14px;cursor:pointer;`);
    const mt=el("div","flex:1;min-width:0;");
    mt.appendChild(el("div",
      `font:700 11px ${UI};letter-spacing:.08em;text-transform:uppercase;color:${T.faint};`,"Consulter"));
    mt.appendChild(el("div",`font:600 22px ${UI};margin-top:6px;`,"Mes charts"));
    const nf=(S.folders.order||[]).length;
    mt.appendChild(el("div",`font:italic 13.5px/1.5 ${SERIF};color:${T.faint};margin-top:5px;`,
      S.library.length+" chanson"+(S.library.length>1?"s":"")+(nf?(" · "+nf+" dossier"+(nf>1?"s":"")):"")));
    mine.appendChild(mt);
    mine.appendChild(el("span",`flex:0 0 auto;font:400 26px ${UI};color:${T.rule};`,"›"));
    mine.onclick=()=>go("charts");
    body.appendChild(mine);

    // reprendre — statistiquement le premier geste. Le dernier chart OUVERT
    // (harmLastChart, comme l'ancien Continue), pas le premier de la liste.
    const lastFile=(()=>{ try{return localStorage.getItem("harmLastChart");}catch(e){return null;} })();
    const last=(lastFile && S.library.find(c=>c.file===lastFile))
      || [...S.library].sort((a,b)=>b.mtime-a.mtime)[0];
    if(last){
      const cont=el("div",
        `background:${T.card};border:1px solid ${T.line};border-radius:18px;padding:14px 16px;`+
        `display:flex;align-items:center;gap:14px;cursor:pointer;`);
      const ct=el("div","flex:1;min-width:0;");
      ct.appendChild(el("div",
        `font:700 11px ${UI};letter-spacing:.08em;text-transform:uppercase;color:${T.accent};`,"Reprendre"));
      const nm=nameEl(last,16); nm.style.marginTop="3px"; ct.appendChild(nm);
      cont.appendChild(ct);
      cont.appendChild(el("span",`flex:0 0 auto;font:400 24px ${UI};color:${T.rule};`,"›"));
      cont.onclick=()=>openChart(last.file);
      body.appendChild(cont);
    }
    w.appendChild(body);

    const foot=el("div",
      `flex:0 0 auto;padding:16px 20px calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px;`);
    foot.appendChild(kitButton("Enregistrer", ()=>go("record"), {height:52, grow:true}));
    foot.appendChild(kitButton("Jam",         ()=>go("jam"),    {height:52, grow:true}));
    w.appendChild(foot);
    return w;
  }

  // ── MES CHARTS (delta2 §8): filtre, dossiers avec compteur, hors dossier ─
  function renderCharts(){
    NOTES=FLAT;
    S.folders=S.folders||loadFolders();
    const w=screenWrap();
    const open=S.openFolder||null;          // null = racine

    const bar=el("div",
      `flex:0 0 auto;display:flex;align-items:center;gap:12px;`+
      `padding:calc(6px + env(safe-area-inset-top)) 14px 10px;`);
    bar.appendChild(kitIcon("‹", ()=>{ if(open){ S.openFolder=null; go("charts",{push:false}); } else go("library"); }, "Retour"));
    bar.appendChild(el("div",`flex:1;min-width:0;font:italic 600 20px ${SERIF};color:${T.ink};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`,
      open||"Mes charts"));
    bar.appendChild(kitButton(S.libraryEdit?"OK":"Modifier",
      ()=>{ S.libraryEdit=!S.libraryEdit; go("charts",{push:false}); },
      {state:S.libraryEdit?"on":"off"}));
    w.appendChild(bar);

    const filt=el("div",`flex:0 0 auto;padding:0 14px 14px;`);
    const fb=el("div",
      `height:48px;border-radius:14px;background:${T.card};border:1px solid ${T.line};`+
      `display:flex;align-items:center;gap:10px;padding:0 14px;`);
    fb.appendChild(el("span",`font:400 16px ${UI};color:${T.rule};`,"⌕"));
    const fi=el("input",
      `flex:1;min-width:0;border:none;background:none;outline:none;font:500 14px ${UI};color:${T.ink};`);
    fi.placeholder="Filtrer mes charts"; fi.value=S.chartFilter||"";
    fi.oninput=()=>{ S.chartFilter=fi.value; paintChartList(); };
    fb.appendChild(fi); filt.appendChild(fb); w.appendChild(filt);

    const body=el("div",`flex:1;min-height:0;overflow-y:auto;padding:0 14px calc(20px + env(safe-area-inset-bottom));`);
    body.className="ap-scroll"; w.appendChild(body);
    S._chartBody=body;
    paintChartList();
    return w;
  }

  function paintChartList(){
    const body=S._chartBody; if(!body) return;
    clear(body);
    const F=S.folders, open=S.openFolder||null;
    const q=(S.chartFilter||"").trim().toLowerCase();
    const match=c=>{ if(!q) return true;
      const n=chartName(c); return (n.artist+" "+n.title).toLowerCase().indexOf(q)>=0; };

    function sectionHead(label, action, onAction){
      const h=el("div","display:flex;align-items:center;justify-content:space-between;margin:2px 4px 9px;");
      h.appendChild(el("span",
        `font:700 11px ${UI};letter-spacing:.08em;text-transform:uppercase;color:${T.faint};`,label));
      if(action){
        const b=el("button",
          `border:none;background:none;padding:12px 4px;margin:-12px -4px;min-height:${SZ.control}px;min-width:${SZ.control}px;`+
          `font:600 13px ${UI};color:${T.accent};cursor:pointer;`, action);
        b.onclick=onAction; h.appendChild(b);
      }
      return h;
    }

    if(!open){
      body.appendChild(sectionHead("Dossiers","Nouveau",()=>promptNewFolder()));
      const list=el("div","display:flex;flex-direction:column;gap:8px;");
      (F.order||[]).forEach(name=>{
        const row=el("div",
          `height:60px;border-radius:14px;background:${T.card};border:1px solid ${T.line};`+
          `display:flex;align-items:center;gap:13px;padding:0 14px;cursor:pointer;`);
        row.appendChild(folderMark(name===(F.order||[])[0]));
        const tx=el("div","flex:1;min-width:0;");
        tx.appendChild(el("div",`font:600 16px ${UI};color:${T.ink};`,name));
        const n=folderCount(name);
        tx.appendChild(el("div",`font:500 12.5px ${UI};color:${T.faint};margin-top:2px;`,
          n+" chanson"+(n>1?"s":"")));
        row.appendChild(tx);
        row.appendChild(el("span",`flex:0 0 auto;font:400 22px ${UI};color:${T.rule};`,"›"));
        row.onclick=()=>{ S.openFolder=name; go("charts",{push:false}); };
        list.appendChild(row);
      });
      if(!(F.order||[]).length) list.appendChild(el("div",
        `font:italic 13px/1.6 ${SERIF};color:${T.faint};padding:0 4px 4px;`,
        "aucun dossier — « Nouveau » pour ranger tes charts"));
      body.appendChild(list);
      body.appendChild(sectionHead("Hors dossier"));
      body.appendChild(chartRows(S.library.filter(c=>!F.of[c.file] && match(c))));
    } else {
      body.appendChild(chartRows(S.library.filter(c=>F.of[c.file]===open && match(c))));
    }
  }

  // la petite forme de dossier — un rectangle et son onglet, pas une icône
  // importée: deux divs, ça tient dans le système
  function folderMark(accent){
    const col=accent?T.accent:T.rule;
    const d=el("div",
      `flex:0 0 auto;width:34px;height:28px;border:1.5px solid ${col};`+
      `border-radius:4px 6px 6px 6px;position:relative;`+
      `background:${accent?"rgba(138,43,43,.07)":T.paper};`);
    d.appendChild(el("div",
      `position:absolute;top:-4.5px;left:-1.5px;width:15px;height:5px;`+
      `background:${col};border-radius:2px 2px 0 0;`));
    return d;
  }

  function chartRows(items){
    const list=el("div","display:flex;flex-direction:column;gap:8px;");
    items.forEach(c=>{
      const row=el("div",
        `min-height:64px;border-radius:14px;background:${T.card};border:1px solid ${T.line};`+
        `display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;`);
      const tx=el("div","flex:1;min-width:0;");
      tx.appendChild(nameEl(c,16));
      tx.appendChild(el("div",`font:500 12.5px ${UI};color:${T.faint};margin-top:3px;`,
        note(c.key.tonic)+" "+c.key.mode+" · "+c.bars+" bars"+(c.hasAudio?"":" · no audio")));
      row.appendChild(tx);
      if(S.libraryEdit){
        row.appendChild(kitButton("Ranger", e=>{ e.stopPropagation(); openMoveSheet(c); }, {small:true}));
        // la suppression vivait dans l'ancien Edit — elle reste (même undo-
        // snackbar), le delta2 ne la remplaçait par rien
        row.appendChild(kitIcon("×", e=>{ e.stopPropagation(); deleteChart(c); }, "Supprimer "+c.title));
        // en Modifier, la ligne édite artiste/titre (« le titre YouTube ment
        // souvent » — delta2 §8, champ éditable côté client)
        row.onclick=()=>openMetaSheet(c);
      } else {
        row.appendChild(el("span",`flex:0 0 auto;font:400 22px ${UI};color:${T.rule};`,"›"));
        row.onclick=()=>openChart(c.file);
      }
      list.appendChild(row);
    });
    return list;
  }

  // « Ranger »: une feuille avec les dossiers + Nouveau + Retirer. Un seul
  // dossier possible, donc c'est un choix, pas des cases à cocher.
  function openMoveSheet(c){
    const back=overlay(), sheet=sheetBox(); sheet.appendChild(handle());
    sheet.appendChild(el("div",
      `font:600 11px ${UI};letter-spacing:.06em;text-transform:uppercase;color:${T.faint};margin-bottom:6px;`,
      "Ranger dans"));
    sheet.appendChild(nameEl(c,17));
    const list=el("div","display:flex;flex-direction:column;gap:8px;margin-top:16px;");
    (S.folders.order||[]).forEach(name=>{
      const on=S.folders.of[c.file]===name;
      const b=kitButton(name, ()=>{
        S.folders.of[c.file]=name; saveFolders(S.folders);
        closeOverlay(back); paintChartList();
      }, {height:52, state:on?"on":"off"});
      b.style.width="100%";
      list.appendChild(b);
    });
    const nb=kitButton("Nouveau dossier…", ()=>{
      closeOverlay(back); promptNewFolder(c);
    }, {height:52});
    nb.style.width="100%"; list.appendChild(nb);
    if(S.folders.of[c.file]){
      const rb=kitButton("Retirer du dossier", ()=>{
        delete S.folders.of[c.file]; saveFolders(S.folders);
        closeOverlay(back); paintChartList();
      }, {height:52});
      rb.style.width="100%"; list.appendChild(rb);
    }
    sheet.appendChild(list);
    back.appendChild(sheet); root.appendChild(back);
  }

  // Saisie du nom: champ dans une feuille, pas un prompt() — le prompt de
  // l'OS casse l'identité papier/bordeaux (même raison qu'au confirm() de
  // suppression, 2026-07-20).
  function promptNewFolder(alsoMove){
    const back=overlay(), sheet=sheetBox(); sheet.appendChild(handle());
    sheet.appendChild(el("div",`font:600 17px ${UI};color:${T.ink};margin-bottom:12px;`,"Nouveau dossier"));
    const inp=el("input",
      `width:100%;height:52px;border-radius:14px;border:1px solid ${T.line};background:${T.paper};`+
      `padding:0 14px;font:500 16px ${UI};color:${T.ink};outline:none;box-sizing:border-box;`);
    inp.placeholder="Standards";
    sheet.appendChild(inp);
    const row=el("div","display:flex;gap:10px;margin-top:14px;");
    row.appendChild(kitButton("Annuler", ()=>closeOverlay(back), {height:52, grow:true}));
    row.appendChild(kitButton("Créer", ()=>{
      const name=(inp.value||"").trim(); if(!name) return;
      S.folders.order=S.folders.order||[];
      if(S.folders.order.indexOf(name)<0) S.folders.order.push(name);
      if(alsoMove) S.folders.of[alsoMove.file]=name;
      saveFolders(S.folders); closeOverlay(back); paintChartList();
    }, {height:52, grow:true, state:"on"}));
    sheet.appendChild(row);
    back.appendChild(sheet); root.appendChild(back);
    setTimeout(()=>inp.focus(),80);
  }

  // « le titre YouTube ment souvent » (delta2 §8): artiste/titre éditables
  // côté client — POST /api/chart-meta/<file>, ressert par /api/library.
  function openMetaSheet(c){
    const back=overlay(), sheet=sheetBox(); sheet.appendChild(handle());
    sheet.appendChild(el("div",`font:600 17px ${UI};color:${T.ink};margin-bottom:12px;`,"Artiste / Chanson"));
    const n=chartName(c);
    const mk=(ph,val)=>{ const i=el("input",
      `width:100%;height:52px;border-radius:14px;border:1px solid ${T.line};background:${T.paper};`+
      `padding:0 14px;font:500 16px ${UI};color:${T.ink};outline:none;box-sizing:border-box;`);
      i.placeholder=ph; i.value=val||""; return i; };
    const ia=mk("Artiste", c.artist||n.artist);
    const it=mk("Chanson", c.artist?(c.title||""):n.title);
    ia.style.marginBottom="10px";
    sheet.appendChild(ia); sheet.appendChild(it);
    const row=el("div","display:flex;gap:10px;margin-top:14px;");
    row.appendChild(kitButton("Annuler", ()=>closeOverlay(back), {height:52, grow:true}));
    row.appendChild(kitButton("Enregistrer", ()=>{
      const artist=(ia.value||"").trim(), title=(it.value||"").trim();
      c.artist=artist; if(title) c.title=title;
      api.post("/api/chart-meta/"+c.file,{artist,title:c.title}).catch(()=>{});
      closeOverlay(back); paintChartList();
    }, {height:52, grow:true, state:"on"}));
    sheet.appendChild(row);
    back.appendChild(sheet); root.appendChild(back);
  }

  function sectionLabel(t){ return el("div",`font:600 10px ${UI};letter-spacing:.08em;text-transform:uppercase;color:${T.faint};margin:22px 4px 10px;`,t); }
  // Undo-snackbar delete (2026-07-20): a blocking confirm() used the OS's own
  // dialog chrome, breaking the app's paper/maroon identity, and offers no
  // way back if you tap it by mistake. Optimistic remove + a few seconds to
  // undo is the standard, gentler mobile pattern — the actual server DELETE
  // only fires once the window lapses.
  function showUndoSnackbar(msg, onUndo){
    if(S._undoBox) S._undoBox.remove();
    const box=el("div",`position:absolute;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:70;display:flex;align-items:center;justify-content:space-between;gap:14px;background:${T.deep};color:#fff;font:600 13px ${UI};padding:12px 12px 12px 16px;border-radius:14px;box-shadow:0 10px 26px -10px rgba(0,0,0,.5);animation:ap-in .25s both;`);
    box.appendChild(el("div","flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;",msg));
    const undoBtn=el("button",`flex:0 0 auto;border:none;background:transparent;color:${T.amber||"#c58a2e"};font:700 13px ${UI};cursor:pointer;padding:6px 4px;`,"Undo");
    undoBtn.onclick=()=>{ clearTimeout(box._t); box.remove(); S._undoBox=null; onUndo(); };
    box.appendChild(undoBtn);
    root.appendChild(box); S._undoBox=box;
    box._t=setTimeout(()=>{ box.style.opacity="0"; box.style.transition="opacity .3s"; setTimeout(()=>{ box.remove(); if(S._undoBox===box) S._undoBox=null; },300); },5000);
  }
  function deleteChart(r){
    S.library=S.library.filter(x=>x.file!==r.file);
    // depuis Mes charts (delta2 §8) on reste sur place — la ligne disparaît
    // aussi de son dossier toute seule (le filtre roule sur S.library)
    if(S.screen==="charts") paintChartList(); else go("library",{push:false});
    const t=setTimeout(()=>{ api.del("/api/chart/"+r.file).catch(()=>{}); },5000);
    showUndoSnackbar(`Deleted "${r.title}"`, ()=>{
      clearTimeout(t);
      S.library.push(r);
      if(S.screen==="charts") paintChartList(); else go("library",{push:false});
    });
  }

  // ── 1b. TRAINING MODE (Billboard corpus) ───────────────────────────────
  // Lists the ~58-60 songs infer_chords_billboard_v1 was trained on (see
  // scripts/harmonia_server.py:_load_billboard_corpus) — each already has a
  // duration-verified YouTube match, so a tap goes straight into the same
  // /api/analyze flow a pasted link uses. This is the browse surface for the
  // human-correction loop: analyze → Annotate tab → Compass/Wheel → Save.
  async function loadBillboardCorpus(){
    if(S.billboardLoaded || S.billboardLoading) return;
    S.billboardLoading=true;
    try{ const r=await api.get("/api/billboard-corpus"); S.billboard=r.songs||[]; }
    catch(e){ S.billboard=[]; }
    S.billboardLoading=false; S.billboardLoaded=true;
    if(S.screen==="billboard") go("billboard");
  }
  const STATUS_LABEL={corrected:"corrected",analyzed:"analysed",new:"not started"};
  const STATUS_COLOR=k=>({corrected:T.green,analyzed:T.accent,new:T.faint}[k]||T.faint);
  function renderBillboard(){
    const w=screenWrap();
    w.appendChild(appBar("Training mode","Billboard corpus · tap a song to analyse & correct","library"));
    const body=el("div","flex:1;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom));"); body.className="ap-scroll";
    const inner=el("div","max-width:640px;margin:0 auto;");
    if(!S.billboardLoaded){ loadBillboardCorpus(); }
    if(S.billboardLoading || !S.billboardLoaded){

        const card=el("button",`width:100%;display:flex;align-items:center;gap:12px;background:${T.card};border:1px solid ${T.line};border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer;text-align:left;`);

        if(r.file){
          // Play the real audio with the McGill Billboard GT's own chord
          // boundaries tracked live — separate from the read-only GT chip
          // under each inferred chord in the chart, which snaps GT to the
          // model's segmentation and can't show a GT boundary that's early/
          // late relative to the model's own cell edges.
          const gtBtn=el("a",`flex:0 0 auto;font:600 10.5px ${UI};color:${T.accent};border:1px solid ${T.accent};border-radius:20px;padding:4px 9px;white-space:nowrap;text-decoration:none;`,"GT audio");

  async function runSearch(q){
    q=(q||"").trim(); if(!q) return;
    // les collages restent des raccourcis (flux historiques, gardés): un lien
    // YouTube part direct en analyse, un irealb:// s'importe direct
    if(/youtu\.?be/.test(q)){ startAnalysis(q, "your link"); return; }
    if(/^irealb:\/\//i.test(q)){ importIrealChart({irealb_url:q}); return; }
    S.searchQuery=q; S.searching=true; S.searchPage=0; S.searchMore=false; paintResults();
    const src=S.searchMode||"youtube";
    try{
      if(src==="ireal"){
        const r=await api.post("/api/irealb-search",{title:q});
        S.results=(r.results||[]).map(x=>({...x,_src:"ireal"}));
      } else if(src==="tabs"){
        const r=await api.post("/api/tab-search",{q});
        S.results=(r.results||[]).map(x=>({...x,_src:"tabs"}));
      } else {
        const r=await api.post("/api/yt-search",{q,page:0});
        S.results=(r.results||[]).map(x=>({...x,_src:"youtube"}));
        S.searchMore=!!r.hasMore;
      }
    }catch(e){ S.results=[]; }
    S.searching=false; paintResults();
  }

  function searchCard(r){

    tx.appendChild(el("div",`font:500 12.5px ${UI};color:${T.faint};margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;`,
      r._src==="ireal" ? [r.composer,r.style,r.time_sig].filter(Boolean).join(" · ")
      : r._src==="tabs" ? [r.artist,r.rating?(r.rating+"/5"):null,r.kind].filter(Boolean).join(" · ")
      : [r.uploader, r.duration?fmt(r.duration):null].filter(Boolean).join(" · ")));

  function paintResults(){
    const body=S._searchBody; if(!body) return;
    clear(body);

    if(S.searching){
      const wrap=el("div","display:flex;align-items:center;justify-content:center;gap:10px;padding:40px 0;");
      wrap.appendChild(el("div",
        `width:18px;height:18px;border-radius:50%;border:2px solid ${T.line};`+
        `border-top-color:${T.accent};animation:ap-spin .8s linear infinite;`));
      wrap.appendChild(el("div",`font:500 14px ${UI};color:${T.faint};`,"…"));
      body.appendChild(wrap);
      return;
    }
    if(!(S.results||[]).length){
      if(S.searchQuery) body.appendChild(el("div",
        `font:italic 13.5px/1.7 ${SERIF};color:${T.faint};padding:28px 6px;text-align:center;`,
        "rien trouvé — essaie le nom de l'artiste"));
      return;
    }

    body.appendChild(el("div",
      `font:700 11px ${UI};letter-spacing:.08em;text-transform:uppercase;color:${T.faint};margin:6px 4px 10px;`,
      "Résultats"));
    const list=el("div","display:flex;flex-direction:column;gap:8px;");
    S.results.forEach(r=>list.appendChild(searchCard(r)));
    body.appendChild(list);
    // scroll infini YouTube (Louis 2026-08-04) — gardé de l'ancien écran,
    // même sentinelle, mêmes gardes
    if(S.searchMore && (S.searchMode||"youtube")==="youtube"){
      const sent=el("div",`height:36px;display:flex;align-items:center;justify-content:center;font:500 11px ${UI};color:${T.faint};`,"…");
      body.appendChild(sent);
      try{
        const io=new IntersectionObserver(es=>{
          if(es.some(e=>e.isIntersecting)){
            loadMoreResults(list, x=>searchCard({...x,_src:"youtube"})).then(()=>{
              if(!S.searchMore){ io.disconnect(); sent.remove(); } });
          }
        },{rootMargin:"600px"});
        io.observe(sent);
      }catch(e){ sent.remove(); }
    }
  }

  // Import d'une tablature (delta2 §9): POST /api/tab-import {url} →
  // {url:"/chart/<file>"} | {error}. Pas d'écran de chargement — la grille
  // arrive complète, on ouvre le chart (seul YouTube passe par renderLoading).
  async function importTabChart(r){
    try{
      const resp=await api.post("/api/tab-import",{url:r.url});
      if(resp.error){ toast(resp.error); return; }
      openChart(resp.url.replace("/chart/",""));
    }catch(e){ toast("Import de la tablature impossible"); }
  }
  // Infinite scroll (Louis, 2026-08-04: "il devrait y avoir un scroll
  // infini"). Guarded by S.searchLoading so a fast scroll can't fire the same
  // page twice, and it appends in place rather than re-rendering the screen —
  // go("library") would scroll the list back to the top mid-read.
  // `mkRow` reste un paramètre (delta2: c'est paintResults qui passe
  // searchCard) — l'ancienne version référençait une fonction hors de portée
  // et le catch avalait le ReferenceError en un silencieux « plus de
  // résultats » (attrapé 2026-08-04: le fetch partait, les lignes jamais).
  async function loadMoreResults(listEl, mkRow){
    if(S.searchLoading || !S.searchMore || (S.searchMode||"youtube")!=="youtube") return;
    S.searchLoading=true;
    try{
      const r=await api.post("/api/yt-search",{q:S.searchQuery,page:S.searchPage+1});
      const more=r.results||[];
      S.searchPage+=1; S.searchMore=!!r.hasMore;
      if(more.length){
        S.results=S.results.concat(more);
        if(listEl && mkRow) more.forEach(x=>listEl.appendChild(mkRow(x)));
      }
    }catch(e){ S.searchMore=false; toast("Plus de résultats indisponibles"); }
    S.searchLoading=false;
  }
  // Import an iReal community chart (2026-07-20): renders straight from the
  // chord string, no audio/analysis involved — a different, older render
  // path (harmonia.irealb_fetcher, window.P.chords) than the app's own
  // inferred_*.html charts, so it opens as its own page rather than trying
  // to force it through the SPA's ChartModel adapter.
  async function importIrealChart(r){
    // /api/irealb-import (not -render, the older alignment-tool route that
    // writes an incompatible payload shape — see harmonia_server.py's own
    // comment on why) builds a real ChordChart through the same pipeline a
    // YouTube analysis uses, so the result opens straight in the SPA like
    // any other chart, no full page reload needed.
    try{
      const resp=await api.post("/api/irealb-import",{irealb_url:r.irealb_url});
      if(resp.error){ toast("Could not import that chart"); return; }
      openChart(resp.url.replace("/chart/",""));
    }catch(e){ toast("Could not import that chart"); }
  }

  // ── 2. ANALYSING ────────────────────────────────────────────────────────
  // L'ÉCRAN NE MONTRE QUE LE CHEMIN MINIMAL VERS UN CHART JOUABLE (Louis,
  // 2026-08-07 : « tu me changes l'écran de chargement pour juste m'afficher
  // ces étapes-là »). Cinq lignes, exactement les cinq étapes que
  // pipeline.analyze_steps traverse avant de rendre le chart brut.
  //
  // Ce qui a été RETIRÉ, et pourquoi. L'ancienne liste avait six lignes en
  // anglais dont trois mensongères : « Hearing the harmony » attendait la clé,
  // qui n'arrivait qu'à la toute fin ; « Sketching the chords » et « Naming
  // the chords — music-x-lab » décrivaient une passe brouillon suivie d'une
  // passe fine qui n'existent plus dans harmonia_min (il n'y a qu'un
  // re-décodage) ; les champs musx_fold / musx_n_folds ne sont jamais peuplés
  // par ce serveur, donc le cercle des quintes et le « fold k/N » étaient du
  // code mort. Les sections et l'analyse harmonique — 96 à 98 % du temps
  // total, mesuré — ne sont plus une étape d'attente : elles tournent APRÈS
  // l'ouverture du chart.
  // STAGES survit UNIQUEMENT pour nommer l'étape en échec sur l'écran
  // d'erreur (UI refresh 2026-08-08, §5) — l'affichage de progression est
  // maintenant renderLoading/paintLoading, piloté par `phase`, pas par ces
  // lignes. Indexé par job.stage (1 audio · 2 battues · 3 posteriors ·
  // 4 accords · 5 grille).
  const STAGES=[
    {k:"l’audio"},
    {k:"le tempo et les mesures"},
    {k:"l’écoute des accords"},
    {k:"le calage sur les temps"},
    {k:"la grille"},
  ];
  async function startAnalysis(url, title){
    S.job={title:title||"", stage:0, phase:"listening", error:null, file:null};
    go("analysing");
    try{
      // 2026-07-17: boundary-segmentation A/B override, carried on the page
      // URL (?seg=musx or ?seg=nnls) so re-analyzing the same song from an
      // iPhone home-screen bookmark can force either mode without a server
      // restart. No UI toggle yet — URL param only.
      const _seg=new URLSearchParams(location.search).get("seg");
      const _body=(_seg==="musx"||_seg==="nnls") ? {url, seg_source:_seg} : {url};
      const r=await api.post("/api/analyze",_body);
      if(r.error){ S.job.error=r.error; go("analysing"); return; }
      pollJob(r.job_id);
    }catch(e){ S.job.error=String(e); go("analysing"); }
  }
  // ── Mic access diagnostics (2026-07-21) ───────────────────────────────────
  // getUserMedia needs a SECURE context (https:// or http://localhost) — on
  // any other origin (e.g. a Tailscale IP over plain http, which is how this
  // app is normally reached from a phone) most browsers don't even show a
  // permission prompt: navigator.mediaDevices is simply undefined, so the old
  // code's blanket "Microphone access denied" was actively misleading (it
  // wasn't a user denial at all). Surface the REAL cause instead of guessing.
  function requestMic(){
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      const e=new Error("insecure-context");
      e.harmReason="insecure"; throw e;
    }
    return navigator.mediaDevices.getUserMedia({audio:true});
  }
  function micErrorMessage(e){
    if(e && e.harmReason==="insecure")
      return "Mic needs a secure connection (https, or localhost) — plain http over the network isn't allowed by the browser.";
    if(e && e.name==="NotAllowedError") return "Microphone permission was denied — check the site settings.";
    if(e && e.name==="NotFoundError") return "No microphone found on this device.";
    return "Could not access the microphone ("+((e&&e.name)||String(e))+")";
  }
  // ── Mic recording (2026-07-20) ────────────────────────────────────────────
  async function startRecordAnalysis(blob, title){
    S.job={title:title||"", stage:0, phase:"listening", error:null, file:null};
    go("analysing");
    try{
      const fd=new FormData();
      fd.append("audio", blob, "recording.webm");
      if(title) fd.append("title", title);
      const r=await fetch("/api/record-analyze", {method:"POST", body:fd}).then(x=>x.json());
      if(r.error){ S.job.error=r.error; go("analysing"); return; }
      pollJob(r.job_id);
    }catch(e){ S.job.error=String(e); go("analysing"); }
  }
  function renderRecord(){
    const w=screenWrap();
    w.appendChild(appBar(null,"Record",  "library"));
    const body=el("div","flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;");
    const timer=el("div",`font:700 44px ${UI};font-variant-numeric:tabular-nums;color:${T.ink};`,"0:00");
    const hint=el("div",`font:500 13px ${UI};color:${T.faint};text-align:center;max-width:280px;`,"Tap to start recording. Play or sing anything — we'll work out the chords.");
    const btn=el("button",`width:88px;height:88px;border-radius:50%;border:none;background:${T.accent};color:#fff;font:700 15px ${UI};cursor:pointer;box-shadow:0 10px 26px -12px rgba(190,90,40,.55);`,"REC");
    let rec=null, chunks=[], stream=null, t0=null, timerId=null;
    const stop=()=>{
      if(timerId) clearInterval(timerId);
      if(rec && rec.state!=="inactive") rec.stop();
      if(stream) stream.getTracks().forEach(tr=>tr.stop());
    };
    btn.onclick=async()=>{
      if(rec && rec.state==="recording"){ stop(); return; }
      try{
        stream=await requestMic();
      }catch(e){ toast(micErrorMessage(e)); return; }
      chunks=[];
      rec=new MediaRecorder(stream);
      rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
      rec.onstop=()=>{
        const blob=new Blob(chunks, {type: rec.mimeType||"audio/webm"});
        if(blob.size<2000){ toast("Recording too short"); return; }
        startRecordAnalysis(blob);
      };
      rec.start();
      t0=Date.now();
      btn.textContent="STOP"; btn.style.background=T.deep;
      timerId=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); timer.textContent=`${(s/60|0)}:${String(s%60).padStart(2,"0")}`; },500);
    };
    body.appendChild(timer); body.appendChild(btn); body.appendChild(hint);
    w.appendChild(body);
    return w;
  }
  // ── Jam Mode (2026-07-20, experimental): live loop listener ──────────────
  // Near-live, not live-live, by explicit design — accuracy over latency.
  // Records in ~8s chunks, uploads each to the server which redecodes the
  // WHOLE session buffer and returns the current best-fit loop + confidence;
  // this screen just renders whatever state came back from the last chunk.
  function renderJam(){
    const w=screenWrap();
    w.appendChild(appBar(null,"Jam Mode","library"));
    const body=el("div","flex:1;overflow-y:auto;padding:20px;"); body.className="ap-scroll";
    const inner=el("div","max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;");

    const hint=el("div",`font:500 13px ${UI};color:${T.faint};text-align:center;`,"Tap to start. Play the loop a few times — it'll lock on and get cleaner as you repeat it.");
    const status=el("div",`font:600 13px ${UI};color:${T.faint};text-align:center;`,"");
    const loopStrip=el("div","display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;");
    const partsBox=el("div","display:flex;flex-direction:column;gap:8px;");
    const btn=el("button",`align-self:center;width:96px;height:96px;border-radius:50%;border:none;background:${T.accent};color:#fff;font:700 14px ${UI};cursor:pointer;box-shadow:0 10px 26px -12px rgba(190,90,40,.55);`,"START");

    inner.appendChild(hint); inner.appendChild(btn); inner.appendChild(status);
    inner.appendChild(loopStrip); inner.appendChild(partsBox);
    body.appendChild(inner); w.appendChild(body);

    const chip=(c)=>{
      const b=el("div",`padding:10px 14px;border-radius:10px;font:700 15px ${UI};background:${T.card};border:1.5px solid ${c.confidence>0.7?T.accent:T.line};color:${T.ink};opacity:${0.45+0.55*c.confidence};`, c.label==="N"?"N.C.":c.label);
      return b;
    };
    const renderState=(st)=>{
      loopStrip.innerHTML=""; partsBox.innerHTML="";
      status.textContent=`${(st.elapsed_s/60|0)}:${String(Math.round(st.elapsed_s%60)).padStart(2,"0")} recorded`;
      if(st.current){
        st.current.loop.forEach(c=>loopStrip.appendChild(chip(c)));
        const meta=el("div",`font:500 11px ${UI};color:${T.faint};text-align:center;width:100%;margin-top:2px;`,
          `${st.current.period_beats}-beat loop · ×${st.current.n_reps} reps seen · ${Math.round(st.current.tempo_bpm)} BPM`);
        loopStrip.appendChild(meta);
      } else {
        loopStrip.appendChild(el("div",`font:500 13px ${UI};color:${T.faint};`,"listening for a loop…"));
      }
      st.parts.forEach((p,i)=>{
        const row=el("div",`display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;border:1px solid ${T.line};border-radius:10px;`);
        row.appendChild(el("div",`font:700 11px ${UI};color:${T.faint};margin-right:4px;`,`Part ${i+1}:`));
        p.loop.forEach(c=>row.appendChild(chip(c)));
        partsBox.appendChild(row);
      });
    };

    let stream=null, rec=null, sessionId=null, running=false, chunkTimer=null;
    const stopAll=()=>{
      running=false;
      if(chunkTimer) clearInterval(chunkTimer);
      if(rec && rec.state!=="inactive") rec.stop();
      if(stream) stream.getTracks().forEach(tr=>tr.stop());
      if(sessionId) api.post("/api/jam/stop",{session_id:sessionId}).catch(()=>{});
      btn.textContent="START"; btn.style.background=T.accent;
    };
    const uploadChunk=async(blob)=>{
      if(!sessionId || blob.size<500) return;
      try{
        const fd=new FormData();
        fd.append("audio", blob, "chunk.webm");
        fd.append("session_id", sessionId);
        const st=await fetch("/api/jam/chunk",{method:"POST",body:fd}).then(x=>x.json());
        if(st.error){ status.textContent=st.error; return; }
        renderState(st);
      }catch(e){ /* one dropped chunk shouldn't stop the jam */ }
    };
    btn.onclick=async()=>{
      if(running){ stopAll(); return; }
      try{ stream=await requestMic(); }
      catch(e){ toast(micErrorMessage(e)); return; }
      const r=await api.post("/api/jam/start",{});
      sessionId=r.session_id;
      running=true;
      btn.textContent="STOP"; btn.style.background=T.deep;
      // ~8s rolling chunks: MediaRecorder restarted each cycle rather than one
      // continuous timeslice stream — simpler to reason about (each blob is
      // a self-contained webm, no cross-chunk container continuity needed
      // server-side) at the cost of a small gap at each restart boundary.
      const cycle=()=>{
        if(!running) return;
        const chunks=[];
        rec=new MediaRecorder(stream);
        rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
        rec.onstop=()=>{ if(chunks.length) uploadChunk(new Blob(chunks,{type:rec.mimeType||"audio/webm"})); };
        rec.start();
        setTimeout(()=>{ if(rec && rec.state==="recording") rec.stop(); }, 8000);
      };
      cycle();
      chunkTimer=setInterval(cycle, 8200);
    };
    return w;
  }
  // Le sondage alimente l'ÉCRAN DE CHARGEMENT (UI refresh 2026-08-08, §5) :
  // `phase` (listening → decoding → raw → sections → done) pilote
  // paintLoading, et `raw_model` — un vrai ChartModel — est rendu SUR PLACE
  // par le même chemin loadModel/buildIReal que le chart final, ce qui rend
  // le passage brut→final invisible. On n'emmène plus Louis automatiquement
  // vers le chart : le chart brut est lisible dans l'écran de chargement et
  // le bouton « Open the chart » arrive avec `done`. Un chart ouvert DEPUIS
  // LA BIBLIOTHÈQUE pendant qu'un job le raffine garde l'ancien chemin
  // (liseré S.refining + rechargement applyRefinement).
  async function pollJob(id){
    try{
      const j=await api.get("/api/job/"+id);
      if(!S.job && !S.refining) return;
      if(S.job){
        Object.assign(S.job, j);   // phase, raw_model, n_bars, sections_found…
        if(j.title) S.job.title=j.title;
        S.job.id=id;               // paintLoading en a besoin pour la sortie
      }                            // anticipée vers le chart (voir plus bas)
      const file=(j.chart_url||j.url||"").replace("/chart/","");
      if(file && S.job) S.job.file=file;
      if(j.status==="error"){
        if(S.job){ S.job.error=j.error||"L’analyse a échoué"; paintLoading(); }
        S.refining=null; return;
      }
      const onChart = S.screen==="chart" && S.model && S.model.file===file;
      if(j.status==="done"){
        S.refining=null;
        if(onChart) applyRefinement(file, j);          // recharge sous ses yeux
        else if(S.screen!=="analysing" && S.model && S.model.file===file) S.refineReady=file;
        if(S.screen==="analysing") paintLoading();
        paintChartRefining();
        return;
      }
      if(file) S.refining={file, id, what:j.refining||[]};
      if(S.screen==="analysing") paintLoading();
      else paintChartRefining();
      setTimeout(()=>pollJob(id), 1200);
    }catch(e){ setTimeout(()=>pollJob(id), 2000); }
  }
  // Le chart raffiné remplace celui à l'écran SANS toucher à l'audio : le
  // lecteur n'est recréé que si `S.audioUrl` change (voir mountTransport), et
  // l'url est la même — donc si Louis a lancé le son, il continue.
  // Une seule chose peut être perdue : un verrou d'accord en cours d'édition.
  // Donc on ne recharge pas par-dessus une session d'annotation — on pose une
  // pastille et il décide.
  async function applyRefinement(file, j){
    if((S.pending&&S.pending.length) || S.mode!=="read" || S.mergeMode){
      S.refineReady=file; paintChartRefining(); return;
    }
    try{
      const m=await api.get("/api/chart-model/"+file);
      const chrome=S.chartChrome, t=S.playTime;
      loadModel(m);
      S.chartChrome=chrome; S.playTime=t;
      S.refineReady=null;
      go("chart",{push:false});
    }catch(e){ /* le chart brut reste affiché, il est valide */ }
  }
  // ── the two-phase loading screen (UI refresh 2026-08-08, §5 / design 2b) ──
  // musx returns the whole decode at once, so bars do NOT trickle in. There
  // is a genuine wait, then the RAW CHART appears complete (one section, no
  // letters), then the letters fold in server-side over the same grid.
  // The trick that makes the hand-off invisible: phase "raw" hands the shell
  // a real ChartModel, so we call the SAME loadModel() + buildIReal() the
  // final chart uses. renderChordPreview() and drawCircleOfFifths() are
  // retired by this — the preview inferred bars from tempo/4 and never lined
  // up with the chart that opened after it.
  const PHASE_COPY={
    listening:["listening to the track",      "finding the beat"],
    decoding: ["reading the harmony",         "this is the long part — a minute or so on a new song"],
    raw:      ["the chart, bar by bar",       "no letters yet — you can already play along"],
    sections: ["finding the sections",        "grouping the repeats into A, B, C…"],
    done:     ["ready",                       ""]
  };

  function renderLoading(){
    const w=screenWrap();

    const bar=el("div",
      `flex:0 0 auto;display:flex;align-items:center;gap:12px;`+
      `padding:calc(6px + env(safe-area-inset-top)) 14px 12px;background:${T.paper};`);
    bar.appendChild(kitIcon("‹", ()=>{ S.job=null; go("library"); }, "Back"));
    const tw=el("div","flex:1;min-width:0;");
    const title=el("div",
      `font:italic 600 19px ${SERIF};color:${T.ink};`+
      `overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`);
    const sub=el("div",`font:500 13px ${UI};color:${T.faint};margin-top:2px;`);
    tw.appendChild(title); tw.appendChild(sub); bar.appendChild(tw); w.appendChild(bar);

    /* Two segments, not one bar: the wait and the sectioning are different
       kinds of work, and a single bar that jumps from 40% to 100% when the
       chart appears reads as a lie. */
    const prog=el("div",`flex:0 0 auto;padding:0 14px 14px;background:${T.paper};`);
    const segs=el("div","display:flex;gap:5px;");
    const s1=el("div",`flex:1;height:6px;border-radius:3px;background:${T.line};overflow:hidden;`);
    const s1f=el("div",`width:0%;height:100%;background:${T.amber};transition:width .5s ease;`);
    const s2=el("div",`flex:1;height:6px;border-radius:3px;background:${T.line};overflow:hidden;`);
    const s2f=el("div",`width:0%;height:100%;background:${T.accent};transition:width .5s ease;`);
    s1.appendChild(s1f); s2.appendChild(s2f); segs.appendChild(s1); segs.appendChild(s2);
    prog.appendChild(segs);
    const meta=el("div",
      `display:flex;justify-content:space-between;margin-top:8px;font:500 13px ${UI};color:${T.faint};`);
    prog.appendChild(meta); w.appendChild(prog);

    const body=el("div",`flex:1;min-height:0;overflow-y:auto;padding:0 10px;background:${T.paper};`);
    body.className="ap-scroll"; w.appendChild(body);

    const foot=el("div",
      `flex:0 0 auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:${T.paper};`);
    w.appendChild(foot);

    S._load={title, sub, s1f, s2f, meta, body, foot, shown:null};
    paintLoading();
    return w;
  }

  function paintLoading(){
    const L=S._load, j=S.job;
    if(!L || !j || S.screen!=="analysing") return;
    const phase=j.phase||"listening";

    L.title.textContent=j.title||"your song";

    if(j.error){
      L.sub.textContent="something went wrong";
      clear(L.body);
      const card=el("div",
        `margin:18px 4px;background:${T.card};border:1px solid ${T.line};`+
        `border-radius:${SZ.radiusLg}px;padding:20px;`);
      card.appendChild(el("div",`font:600 15px ${UI};color:${T.accent};margin-bottom:6px;`,"That didn't work"));
      // STAGES names the step that broke — the one thing the old five-line
      // screen still had to offer.
      card.appendChild(el("div",`font:italic 13px ${SERIF};color:${T.faint};margin-bottom:8px;`,
        "échec pendant : "+(STAGES[Math.max(0,Math.min(STAGES.length-1,(j.stage||1)-1))].k)));
      card.appendChild(el("div",`font:500 13px/1.5 ${UI};color:${T.faint};`, j.error));
      L.body.appendChild(card);
      clear(L.foot);
      L.foot.appendChild(kitButton("Back to library", ()=>{ S.job=null; go("library"); },
        {height:SZ.primary, grow:true, state:"on"}));
      return;
    }

    const copy=PHASE_COPY[phase]||PHASE_COPY.listening;
    L.sub.textContent=copy[0];

    const done = phase==="done";
    const hasRaw = (phase==="raw" || phase==="sections" || done) && j.raw_model;
    L.s1f.style.width = hasRaw ? "100%" : (phase==="decoding" ? "62%" : "18%");
    if(hasRaw) L.s1f.style.background=T.green;
    L.s2f.style.width = done ? "100%" : (phase==="sections" ? "45%" : "0%");
    if(done) L.s2f.style.background=T.green;

    clear(L.meta);
    if(hasRaw && j.n_bars){
      const a=el("div","");
      a.appendChild(el("span",`color:${done?T.green:T.ink};font-weight:700;`, j.n_bars+" bars"));
      a.appendChild(el("span","", done ? " · "+(j.sections_found||1)+" section"+((j.sections_found||1)>1?"s":"") : " decoded"));
      L.meta.appendChild(a);
    } else {
      L.meta.appendChild(el("span","", copy[1]));
    }
    if(hasRaw && !done) L.meta.appendChild(el("span","","finding the sections…"));

    /* ── the body ──────────────────────────────────────────────────────────
       Before the raw chart: a quiet waiting state, NOT a fake grid. After it:
       the real chart, rendered by the real code path. */
    if(!hasRaw){
      if(L.shown!=="wait"){
        clear(L.body);
        const wrap=el("div",
          `margin:34px 4px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;`);
        wrap.appendChild(el("div",
          `width:34px;height:34px;border-radius:50%;border:2px solid ${T.line};`+
          `border-top-color:${T.accent};animation:ap-spin .8s linear infinite;`));
        wrap.appendChild(el("div",`font:600 15px ${UI};color:${T.ink};`, copy[0]));
        wrap.appendChild(el("div",
          `font:italic 13.5px/1.6 ${SERIF};color:${T.faint};max-width:280px;`, copy[1]));
        L.body.appendChild(wrap);
        L.shown="wait";
      }
      clear(L.foot);
      L.foot.appendChild(el("div",`height:${SZ.primary}px;`));   // hold the space
      return;
    }

    if(L.shown!=="chart" && j.raw_model){
      clear(L.body);
      loadModel(j.raw_model);          // the real path — same cells as the final chart
      const head=el("div","display:flex;align-items:center;gap:8px;margin:0 4px 8px;");
      head.appendChild(el("div",
        `font:600 11px ${UI};letter-spacing:.08em;text-transform:uppercase;color:${T.faint};`,
        "raw chart · no letters yet"));
      head.appendChild(el("div",`flex:1;height:1px;background:${T.line};`));
      L.body.appendChild(head);
      L.body.appendChild(buildIReal());
      L.body.appendChild(kitLegend(T.green, "every bar written out — you can already play along"));
      L.shown="chart";
    }

    clear(L.foot);
    // SORTIE ANTICIPÉE (Louis, 2026-08-09 : « on devrait au moins avoir le raw
    // chart dispo en interactif avec les annotate en attendant que les sections
    // se fassent »). Mesuré le même jour : les sections coûtent 160 s sur un
    // morceau de 4 min, dont 0,07 s d'algorithme — le reste est demucs (92 s)
    // + pyin (69 s), deux modèles qui tournent dans le thread du job. Le chart
    // brut, lui, est DÉJÀ écrit sur disque au premier yield de `analyze_steps`
    // (server._run_job écrit `dest` avant de distinguer raw/final), donc
    // /api/chart-model le sert immédiatement.
    //
    // Toute la machinerie d'aval existait déjà et n'est pas touchée : `S.refining`
    // pose le liseré « Sections et gamme en cours — joue, le chart se mettra à
    // jour tout seul », `applyRefinement` échange le modèle sans recréer le
    // lecteur audio, et il s'abstient si une annotation est en cours (il pose
    // « Recharger » à la place). Il ne manquait QUE la porte : le bouton
    // n'apparaissait qu'à `done`.
    if(done || j.raw_model){
      const early = !done;
      // `grow:true` pose flex:1, qui ne veut rien dire dans un bloc : le
      // bouton principal de cet écran était en fait à la largeur de son texte.
      // On lui donne une ligne flex, et la légende reste en dessous.
      const row=el("div","display:flex;");
      row.appendChild(kitButton(early ? "Play it now" : "Open the chart", ()=>{
        const f=j.file;
        // l'ordre compte : pollJob s'arrête si S.job ET S.refining sont nuls
        if(early && f) S.refining={file:f, id:j.id, what:j.refining||[]};
        S.job=null;
        openChart(f);
      }, {height:SZ.primary, grow:true, state:"on"}));
      L.foot.appendChild(row);
      if(early){
        L.foot.appendChild(el("div",
          `font:italic 12px ${SERIF};color:${T.faint};text-align:center;margin-top:7px;`,
          "les lettres arrivent toutes seules pendant que tu joues"));
      }
    } else {
      const busy=el("div",
        `height:${SZ.primary}px;border-radius:${SZ.radiusLg}px;border:1px solid ${T.line};`+
        `background:${T.card};display:flex;align-items:center;justify-content:center;gap:10px;`+
        `font:600 15px ${UI};color:${T.faint};`);
      busy.appendChild(el("div",
        `width:14px;height:14px;border-radius:50%;border:2px solid ${T.line};`+
        `border-top-color:${T.accent};animation:ap-spin .7s linear infinite;`));
      busy.appendChild(el("span","","Finding the sections"));
      L.foot.appendChild(busy);
    }
  }

  // ── 3. CHART ────────────────────────────────────────────────────────────
  async function openChart(file,opts){
    if(!file) return;
    const push = !opts || opts.push!==false;
    try{
      const m=await api.get("/api/chart-model/"+file);
      loadModel(m);
      go("chart",{push});
      try{ localStorage.setItem("harmLastChart",file); }catch(e){}
    }catch(e){ toast("Could not open that chart"); go("library",{push}); }
  }
  // Flatten the ChartModel's sections→bars→chords into the working list the
  // renderer walks, and give every chord its time span in EACH pass of a
  // folded section (a ×2 section renders once but sounds twice — the playhead
  // and any re-infer still have to address both).
  function loadModel(m, opts){
    opts = opts || {};
    S.model=m; S.key=m.key.tonic; S.keyMode=m.key.mode||"major"; S.mode="read"; S.pending=[];
    S._vlKey=null; S._vlTrack=null; S._vlTotals=null; S._lastCoachIdx=null;
    S._prompterSync=null; loopEngineDispose(false);
    S.playBar=-1; S.playRep=null; S.playTime=null;
    // S.chartChrome (delta2 §6): true = toolbar/rail/dock visibles, false =
    // lecture immersive (barre 3px + poignée + fade). Un chart s'ouvre
    // toujours chrome visible; seule la LECTURE en Read le retire après
    // 2,6s sans interaction (immersiveArm), et l'arrêt le ramène.
    S.chartChrome=true;
    closeVoicingCard(); clearTimeout(S._immTimer);
    setSpelling(m.key.tonic, m.key.mode);   // F♯m7 in E major, B♭7 in F major
    // Louis, 2026-08-08: a chord-less FIRST section is the intro — name it so,
    // hide it from the chart (Read), keep it in the form rail, and shift the
    // letters so the first REAL section reads A. Only a reps=1 leading
    // section qualifies (a ×N section plays real music later); named
    // sections (intro/outro/bridge/…) keep their names, only single letters
    // are re-assigned — same original letter, same new letter everywhere.
    S._hiddenIntroId=null;
    if(m.sections && m.sections.length>1){
      const first=m.sections[0];
      const chordless=(first.reps||1)===1 &&
        !(first.bars||[]).some(bar=>(bar||[]).some(c=>c && !c.nc));
      if(chordless){
        if(!/^intro/i.test(String(first.label||""))){ first.label="intro"; first.tag=""; }
        S._hiddenIntroId=first.id;
        const map={}; let next=0;
        m.sections.slice(1).forEach(s=>{
          const L=String(s.label||"");
          if(/^[A-Z]$/.test(L)){
            if(!(L in map)) map[L]=String.fromCharCode(65+(next++));
            s.label=map[L];
          }
        });
      }
    }
    S.sections=m.sections.map((s,i)=>({ id:s.id, label:s.label, tag:s.tag, reps:s.reps, spans:s.spans, barRanges:s.barRanges, idx:i }));
    const chords=[];
    // Build S.bars in the SAME walk, one entry PER model bar — crucially
    // INCLUDING held (empty) bars. A held bar carries no chord (the previous
    // chord sounds through it), but it must still occupy a grid cell: the
    // model's per-section `bars` array already keeps an empty [] slot for each
    // held bar (chart_model gives every bar 0..n_bars-1 a slot). The old code
    // rebuilt S.bars from the flat chord list via `barFirst`, so every held
    // bar — having no chord — produced no cell and silently vanished. That
    // collapsed a 2-bar held chord into 1 cell and shifted every following bar
    // left by one, desyncing the whole form (2026-07-17 "Yesterday" bug).
    const barsList=[];
    m.sections.forEach((s,si)=>{
      const base=s.spans[0][0];
      // 1st/2nd endings (2026-07-21): a folded reps≥2 section whose passes
      // diverge only in the last `tail` bars carries `endings`. Render the
      // shared prefix ONCE over all passes, then each variant's tail with spans
      // for ONLY the passes that use it — so each pass plays (and highlights)
      // its own real ending instead of replaying the representative's.
      const tail = (s.endings && s.endings.tail) || 0;
      const prefixLen = s.bars.length - tail;
      // Emit one grid bar: build its chords with a per-chord span mapper, and
      // tag the bar with rendering meta (secFirst / ending bracket info).
      // `s.barSpans` (chart_display.bar_spans_for_sections) is the server's
      // per-rendered-bar × per-pass time map, listed in exactly this emit order
      // — prefix bars, then each ending variant's tail. Walk it with the same
      // cursor so bar r gets row r, and never recompute it here (see the tspans
      // block below for what recomputing it cost).
      let rbCursor=0;
      const emitBar=(bar, meta, spanFor)=>{
        const cur={idxs:[], t0:null, t1:null, sec:s.label, secId:s.id,
                   reps:s.reps, held: bar.length===0,
                   barSpans:(s.barSpans && s.barSpans[rbCursor]) || null,
                   secFirst: !!meta.secFirst, ending: meta.ending||null,
                   endingFirst: !!meta.endingFirst, endingPasses: meta.endingPasses||null};
        rbCursor++;
        bar.forEach((c,ci)=>{
          const spans=spanFor(c);
          const idx=chords.length;
          chords.push({ root:c.root, q:c.q, c:c.c, bass:(c.bass==null?-1:c.bass),
            confirmed:!!c.confirmed, nc:!!c.nc,
            bar:c.bar, beat:c.beat, sug:c.sug||null,
            sec:s.label, secId:s.id, secIdx:si, reps:s.reps,
            barFirst: ci===0, secFirst: !!meta.secFirst && ci===0,
            t0:c.t0, t1:c.t1, spans });
          cur.idxs.push(idx);
          if(cur.t0===null) cur.t0=c.t0;
          cur.t1=(cur.t1===null)?c.t1:Math.max(cur.t1, c.t1);
        });
        barsList.push(cur);
      };
      const allPass = c => s.spans.map(sp=>[c.t0 + (sp[0]-base), c.t1 + (sp[0]-base)]);
      // shared prefix (or the whole section when there are no endings)
      const prefixBars = tail ? s.bars.slice(0, prefixLen) : s.bars;
      prefixBars.forEach((bar,bi)=>emitBar(bar, {secFirst: bi===0}, allPass));
      if(tail && s.endings){
        s.endings.variants.forEach((v,vi)=>{
          const baseV = s.spans[v.passes[0]][0];
          const passSpan = c => v.passes.map(p=>[c.t0 + (s.spans[p][0]-baseV), c.t1 + (s.spans[p][0]-baseV)]);
          v.bars.forEach((bar,bi)=>emitBar(bar,
            {secFirst:false, ending:String(vi+1), endingFirst: bi===0, endingPasses: v.passes},
            passSpan));
        });
      }
    });
    S.chords=chords;
    S.bars=barsList;
    // Held bars have no chord and thus no intrinsic time. Give each the span
    // between its neighbours (prev bar's end → next chorded bar's start) so the
    // playhead and swipe-merge (spanTime) stay monotonic across the held gap.
    for(let i=0;i<S.bars.length;i++){
      if(S.bars[i].t0!==null) continue;
      const prevT1=(i>0 && S.bars[i-1].t1!=null)?S.bars[i-1].t1:0;
      let nextT0=null;
      for(let j=i+1;j<S.bars.length;j++){ if(S.bars[j].t0!=null){ nextT0=S.bars[j].t0; break; } }
      S.bars[i].t0=prevT1;
      S.bars[i].t1=(nextT0!=null)?nextT0:prevT1;
    }
    S.mergeMode=false; S.spans=[];
    // L'outil sections appartient au morceau qu'il annote. Sans cette
    // remise à zéro, ouvrir une AUTRE chanson gardait les marques de la
    // précédente, les peignait sur sa grille, et la sauvegarde automatique
    // les écrivait dans le fichier de la nouvelle (audit 2026-08-10).
    // `keepTool` est le rechargement INTERNE de l'outil (passage en vue
    // dépliée et retour) : là, il ne change pas de morceau.
    if(!opts.keepTool){ S.sectTool=null; S._foldedModel=null; }
    // New song → old song's candidates/dismissals/confirmations don't apply.
    S.suggMode=false; S.suggCandidates=null;
    S.suggDismissed=new Set(); S.suggConfirmed=new Set();
    S.sectSuggMode=false; S.sectSuggCandidates=null; S.sectSuggMeta={};
    S.sectSuggDismissed=new Set(); S.sectSuggConfirmed=new Set();
    S.audioUrl=m.audio_url||"";
    // S.timeIndex ([{i, t0, t1, rep}] over every chord × pass, in time order) is
    // built AFTER the bar spans below — chord times are now derived from the
    // bar's, so it has to wait for them.
    // ── per-BAR time spans → the playhead tracks TIME against BARS, not chord
    // index, so held ("%") bars, N.C. bars and the intro row all highlight while
    // they sound (user report 2026-07-19). Within a folded ×k section every pass
    // maps back to the SAME rendered bar, so one rendered bar lights once per pass.
    //
    // THE MAP IS THE SERVER'S (2026-07-30). `sec.barSpans` is built once in
    // chart_display.bar_spans_for_sections, from BAR BOUNDARIES, and is the only
    // thing that answers "which rendered bar is sounding at time t". This block
    // used to build it here out of CHORD SUSTAIN times and got it wrong four
    // ways at once — Louis: "the play head does n'importe quoi ... it skips
    // sections, doesn't play the first bars when 2 consecutive bars share the
    // same chord, and ends up being on the wrong chords and being either early
    // or late":
    //   * a folded pass was the written phrase RIGIDLY TRANSLATED onto that
    //     pass's start (`c.t0 + span_k[0] - span_0[0]`), so a pass longer than
    //     what is written ran out early (This Love's 12-bar verse written as 8:
    //     8.2s with no bar at all, playhead frozen) and a shorter one overran
    //     (its 4-bar verse: 12s of verse bars claiming the bridge's time);
    //   * a held ("%") bar got `[previous chord's t1, next chord's t0]` = a
    //     ZERO-LENGTH span, so it never lit and its predecessor stayed lit for
    //     both bars — all 376 held bars on 25 charts were dead this way.
    // The beat snap that used to live here moved server-side too (it needs an
    // order guard now that a pass can be time-compressed to under a beat per
    // bar; see snap_bar_spans_to_beats).
    //
    // The `else` branch below is the pre-2026-07-30 reconstruction, kept ONLY
    // for a payload with no barSpans (an old baked file). Anything served by
    // /api/chart-model takes the first branch.
    for(let bi=0;bi<S.bars.length;bi++){
      const b=S.bars[bi];
      const srv=(b.barSpans||[]).filter(sp=>sp && sp.length===2);
      if(srv.length){
        b.tspans=srv.map(sp=>[sp[0],sp[1]]);
      } else if(b.idxs.length){
        const nrep=Math.max(1,...b.idxs.map(i=>(S.chords[i].spans||[]).length||1));
        b.tspans=[];
        for(let r=0;r<nrep;r++){
          let t0=Infinity,t1=-Infinity;
          b.idxs.forEach(i=>{ const sp=(S.chords[i].spans&&(S.chords[i].spans[r]||S.chords[i].spans[0]))||[S.chords[i].t0,S.chords[i].t1]; t0=Math.min(t0,sp[0]); t1=Math.max(t1,sp[1]); });
          b.tspans.push([t0,t1]);
        }
      } else {
        b.tspans=[[b.t0,b.t1]];   // held bar: neighbour-filled single span
      }
    }
    // A bar's CHORDS then split that bar's time, in proportion to how long each
    // is written for. Chord spans used to be reconstructed independently of the
    // bar's, so the metronome and the bar highlight could disagree about where a
    // pass even was; now there is one map and the chords hang off it.
    S.bars.forEach(b=>{
      if(!b.idxs.length || !b.tspans.length) return;
      const cs=b.idxs.map(i=>S.chords[i]);
      const w=cs.map(c=>Math.max(1e-6,(c.t1||0)-(c.t0||0)));
      const wsum=w.reduce((a,x)=>a+x,0)||1;
      cs.forEach(c=>{ c.spans=[]; });
      b.tspans.forEach(sp=>{
        const D=sp[1]-sp[0]; let cur=sp[0];
        cs.forEach((c,ci)=>{ const nx=(ci===cs.length-1)?sp[1]:cur+D*w[ci]/wsum; c.spans.push([cur,nx]); cur=nx; });
      });
    });
    S.timeIndex=[];
    S.chords.forEach((ch,i)=>(ch.spans||[]).forEach((sp,rep)=>S.timeIndex.push({i,t0:sp[0],t1:sp[1],rep})));
    S.timeIndex.sort((a,b)=>a.t0-b.t0);
    S.barTimeIndex=[];   // [{bi, t0, t1, rep}] over every bar × pass, time order
    S.bars.forEach((b,bi)=>b.tspans.forEach((sp,rep)=>S.barTimeIndex.push({bi,t0:sp[0],t1:sp[1],rep})));
    S.barTimeIndex.sort((a,b)=>a.t0-b.t0);
    // Metronome (2026-07-20) clicks on CHORD changes, not bar changes — a bar
    // can hold 2+ chords (split-bar feature), and barTimeIndex only tracks the
    // bar's outer envelope. Flatten every chord's own spans (repeats included)
    // into a separate time-ordered index so the click tracks real harmonic
    // rhythm, not just bar boundaries.
    S.chordTimeIndex=[];  // [{idx, t0, t1}] over every chord × repeat, time order
    S.chords.forEach((c,idx)=>{
      const spans=(c.spans&&c.spans.length)?c.spans:[[c.t0,c.t1]];
      spans.forEach(sp=>S.chordTimeIndex.push({idx,t0:sp[0],t1:sp[1]}));
    });
    S.chordTimeIndex.sort((a,b)=>a.t0-b.t0);
  }

  // ── chart chrome (UI refresh 2026-08-08, §2 / design 1a) ─────────────────
  // The four chrome rows (app bar, mode bar, legend, form strip) collapse to
  // ONE toolbar + ONE bottom dock; Analyse adds a one-line lens row. The
  // fullscreen chrome-handle/swipe machinery (2026-07-21) is retired WITH the
  // rows it existed to hide — one slim toolbar has nothing left to fold away.
  // Key + form are the title's subtitle (tap = rotor); Share and the Learn
  // ladder moved into the Aa sheet; Set bar 1 / Check merges moved into the
  // annotate ribbon, as words.

  /* ONE toolbar. Everything here is >= 44 on both axes. */
  function chartToolbar(){
    const m=S.model;
    const bar=el("div",
      `flex:0 0 auto;display:flex;align-items:center;gap:12px;`+
      `padding:calc(6px + env(safe-area-inset-top)) 14px 8px;background:${T.paper};`);
    bar.appendChild(kitIcon("‹", ()=>go("library"), "Back"));

    const tw=el("div","flex:1;min-width:0;");
    tw.appendChild(el("div",
      `font:italic 600 19px ${SERIF};color:${T.ink};`+
      `overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`, m?m.title:""));
    // min-height 44 with negative margins: a full-size tap target (the kit's
    // floor) without adding visual height to the toolbar.
    const meta=el("button",
      `display:inline-flex;align-items:center;gap:6px;border:none;min-height:${SZ.control}px;`+
      `margin:-9px 0 -11px;background:none;padding:0;font:500 13px ${UI};color:${T.faint};cursor:pointer;`);
    meta.appendChild(el("span",`color:${T.ink};font-weight:600;`, note(S.key)+" "+(S.keyMode||"major")));
    if(m && m.form){ meta.appendChild(el("span","","·")); meta.appendChild(el("span","",m.form)); }
    meta.appendChild(el("span",`color:${T.accent};`,"↻"));
    meta.setAttribute("aria-label","Change key");
    meta.onclick=openRotor;
    tw.appendChild(meta);
    bar.appendChild(tw);

    bar.appendChild(kitIcon("Aa", openPrefsSheet, "Preferences", {serif:true}));
    return bar;
  }

  /* The Analyse lens row + its ONE-LINE legend. Replaces the three outlined
     pills and the full-width legendFor() sentence block. */
  function analyseLens(){
    const wrap=el("div",`flex:0 0 auto;padding:0 14px 10px;background:${T.paper};`);
    wrap.appendChild(kitSegmented(
      [["function","Role"],["key","Local keys"],["global","Home key"]],
      ()=>S.colorMode,
      v=>{ S.colorMode=v; go("chart",{push:false}); },
      {height:SZ.control}));
    const L={
      function:[T.green, "colour marks what each chord does — home, setting up, pulling"],
      key:[lensBand(210,false), "colour marks where the tune borrows another key"],
      global:[lensBand(keyHue(collOf(S.key,S.keyMode)), S.keyMode==="minor"), "one wash — the whole song in its home key"]
    }[S.colorMode] || [null,""];
    wrap.appendChild(kitLegend(L[0], L[1]));
    return wrap;
  }

  /* Le clavier qui accompagne (Louis, 2026-08-08, seconde passe): en
     « Follow » il n'apparaît QUE lorsque le chart est en plein écran
     immersif — l'inverse d'avant, où il vivait dans le dock et disparaissait
     justement quand on jouait. Carte fine épinglée en bas, glyphe + noms +
     clavier, rien d'autre: le choix du style de voicing vit dans la feuille
     Aa (openPrefsSheet), pas ici — en immersif on ne pose pas de contrôles. */
  function immersiveCoach(){
    const p=el("div",
      `position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));`+
      `z-index:30;background:${T.card};border:1px solid ${T.line};border-radius:16px;`+
      `padding:10px 12px;box-shadow:0 16px 36px -18px rgba(50,38,20,.5);`);
    const head=el("div","display:flex;align-items:center;gap:10px;margin-bottom:8px;");
    const cGlyph=el("div","flex:0 0 auto;"); head.appendChild(cGlyph);
    const cNames=el("div",`font:500 12px ${UI};color:${T.faint};flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`,"");
    head.appendChild(cNames);
    p.appendChild(head);
    const ckb=el("div",""); p.appendChild(ckb);
    S._coachPanel=p; S._coachGlyph=cGlyph; S._coachNames=cNames; S._coachKb=ckb; S._coachNote=null;
    return p;
  }

  /* The dock: transport + Read/Analyse/Annotate/Practise, pinned in thumb
     reach. Replaces BOTH the old mode bar and the persistent bottom
     transport; syncTransport()/setPlayhead() target the S._dock* elements.
     "Practise" opens the prompter — the screen the old 9px reel toggle led
     to; a fourth segment beats hiding a whole screen behind a sheet. */
  function chartDock(){
    const dock=el("div",
      `flex:0 0 auto;background:${T.card};border-top:1px solid ${T.line};`+
      `padding:12px 14px calc(10px + env(safe-area-inset-bottom));`+
      `box-shadow:0 -12px 30px -22px rgba(50,38,20,.5);`);

    const row=el("div","display:flex;align-items:center;gap:14px;");
    const play=el("button",
      `flex:0 0 auto;width:${SZ.primary}px;height:${SZ.primary}px;border-radius:50%;border:none;`+
      `background:${T.accent};color:#fff;cursor:pointer;`+
      `display:flex;align-items:center;justify-content:center;font:400 22px ${UI};`);
    playGlyph(play, S.playing, 18);
    play.setAttribute("aria-label", S.playing?"Pause":"Play");
    play.onclick=()=>{ if(S._loopEngine) loopEngineToggle(); else togglePlay(); setPlayBtn(); };
    S._playBtn=play;
    row.appendChild(play);

    const mid=el("div","flex:1;min-width:0;");
    // the 6px track sits inside a taller touch band — the seek target is 44
    const band=el("div","padding:19px 0;margin:-19px 0;cursor:pointer;touch-action:none;");
    const track=el("div",`height:6px;border-radius:3px;background:${T.line};overflow:hidden;`);
    const fill=el("div",`width:0%;height:100%;background:${T.accent};border-radius:3px;`);
    track.appendChild(fill); band.appendChild(track);
    const seekAt=(x)=>{ const r=track.getBoundingClientRect(); if(r.width) seekFrac((x-r.left)/r.width); };
    band.addEventListener("pointerdown",e=>{ band._down=true; seekAt(e.clientX); try{ band.setPointerCapture(e.pointerId); }catch(err){} });
    band.addEventListener("pointermove",e=>{ if(band._down) seekAt(e.clientX); });
    band.addEventListener("pointerup",()=>{ band._down=false; });
    band.addEventListener("pointercancel",()=>{ band._down=false; });
    const labels=el("div",
      `display:flex;justify-content:space-between;margin-top:6px;font:500 12px ${UI};color:${T.faint};`);
    const tNow=el("span","","0:00"), tWhere=el("span","",""), tEnd=el("span","","0:00");
    labels.appendChild(tNow); labels.appendChild(tWhere); labels.appendChild(tEnd);
    mid.appendChild(band); mid.appendChild(labels);
    row.appendChild(mid);
    S._dockFill=fill; S._dockNow=tNow; S._dockWhere=tWhere; S._dockEnd=tEnd;

    const loop=el("button",
      `flex:0 0 auto;width:${SZ.primary}px;height:${SZ.primary}px;border-radius:${SZ.radiusLg}px;`+
      `cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;`+
      ctlSkin(S._loopEngine?"on":"off"));
    loop.appendChild(el("div",`font:700 15px ${UI};`,"A–B"));
    loop.appendChild(el("div",`font:500 10px ${UI};opacity:.7;`,"loop"));
    loop.setAttribute("aria-label","Loop the four-bar phrase you are in");
    loop.onclick=()=>{ chartLoopToggle(); go("chart",{push:false}); };
    row.appendChild(loop);
    dock.appendChild(row);

    const modes=kitSegmented(
      [["read","Read"],["analyse","Analyse"],["annotate","Annotate"],["practise","Practise"]],
      ()=>S.mode,
      v=>{ if(v==="practise"){ go("prompter"); return; } S.mode=v; go("chart",{push:false}); },
      {font:13.5});
    modes.style.marginTop="12px";
    dock.appendChild(modes);
    return dock;
  }

  // A–B loop on the chart: cycles the four-bar phrase the playhead is in
  // (the prompter's LOOP snap), through the same self-wrapping engine. The
  // interval here only carries the DISPLAY: once the engine ping-pongs onto
  // its own elements, the chart's timeupdate listener (on the main audio,
  // now paused) goes silent.
  function chartLoopToggle(){
    if(S._loopEngine){
      if(S._chartLoopTimer){ clearInterval(S._chartLoopTimer); S._chartLoopTimer=null; }
      loopEngineDispose(true);
      return;
    }
    const grid=(S.model&&S.model.barGrid)||[];
    if(grid.length<2 || !S.audio) return;
    let bi=0; { let lo=0,hi=grid.length-2; const t=nowTime();
      while(lo<=hi){ const mid=(lo+hi)>>1; if(grid[mid]<=t){ bi=mid; lo=mid+1; } else hi=mid-1; } }
    const g=Math.min(Math.floor(bi/4)*4, Math.max(0,grid.length-2));
    loopEngineStart(grid[g], grid[Math.min(g+4,grid.length-1)]);
    if(S._chartLoopTimer) clearInterval(S._chartLoopTimer);
    S._chartLoopTimer=setInterval(()=>{
      const en=S._loopEngine;
      if(!en || S.screen!=="chart"){ clearInterval(S._chartLoopTimer); S._chartLoopTimer=null; return; }
      const t=nowTime();
      const h=hitAtTime(t+PLAYHEAD_LEAD_S);
      if(h && h.bi!==S.playBar) setPlayhead(h.bi,h.rep,t+PLAYHEAD_LEAD_S);
      paintDockTime(t);
    },120);
  }

  function paintDockTime(t,dur){
    dur=dur||totalDur()||1;
    if(S._dockFill){ const f=Math.min(1,Math.max(0,t/dur)); S._dockFill.style.width=(f*100)+"%"; }
    if(S._dockNow) S._dockNow.textContent=fmt(t);
    if(S._dockEnd) S._dockEnd.textContent=fmt(dur);
    if(S._immFill){ const f=Math.min(1,Math.max(0,t/dur)); S._immFill.style.width=(f*100)+"%"; }
  }

  // ── lecture immersive (delta2 §6 / design 3a): jouer, c'est lire ─────────
  // Pendant la lecture en Read, les deux bandeaux s'effacent après 2,6s sans
  // interaction et la grille prend tout l'écran. En Annotate on ne cache
  // JAMAIS: l'utilisateur y travaille, ses outils restent sous la main.
  // Trois gestes ramènent le chrome: la poignée (visible!), un glissé vers le
  // bas, un tap n'importe où entre deux accords. Un tap sur un ACCORD ne le
  // ramène pas — il ouvre la carte de voicing (S.piano==="tap").
  const IMMERSIVE_IDLE_MS = 2600;
  function immersiveEligible(){
    // Louis, 2026-08-08: une feuille ouverte (Aa, rotor, accord, partage…)
    // ne doit JAMAIS disparaître au bout de 2,6s — le go() du retrait
    // détruisait l'overlay avec le reste de l'écran. Tant qu'un overlay est
    // ouvert, on ne retire rien; closeOverlay() réarme le compte à rebours.
    return S.screen==="chart" && S.playing && S.mode==="read" &&
      !S._voicingCard && !root.querySelector("[data-overlay]");
  }
  function immersiveArm(){
    clearTimeout(S._immTimer);
    if(!immersiveEligible()) return;
    S._immTimer=setTimeout(()=>{
      if(!immersiveEligible() || !S.chartChrome) return;
      S.chartChrome=false;
      go("chart",{push:false});
    }, IMMERSIVE_IDLE_MS);
  }
  function immersiveWake(){
    if(S.screen!=="chart") return;
    if(!S.chartChrome){ S.chartChrome=true; go("chart",{push:false}); }
    immersiveArm();
  }
  // La barre de progression fine qui remplace le dock en immersif: 3px en
  // haut, aucune interaction, juste « où j'en suis ».
  function immersiveProgress(){
    const t=el("div",`flex:0 0 auto;height:3px;background:${T.line};`);
    const f=el("div",`width:0%;height:100%;background:${T.accent};`);
    t.appendChild(f); S._immFill=f;
    return t;
  }
  // La poignée doit être VISIBLE (delta2: elle ne l'était pas, et sans elle
  // le mode est une impasse). Cible 44px réelle, dessin discret — les marges
  // négatives l'empêchent de manger la hauteur gagnée.
  function immersiveHandle(){
    const row=el("div","flex:0 0 auto;display:flex;justify-content:center;padding:10px 0 6px;");
    const b=el("button",
      `width:72px;height:${SZ.control}px;margin:-14px 0 -10px;border:none;background:none;`+
      `cursor:pointer;display:flex;align-items:center;justify-content:center;`);
    b.setAttribute("aria-label","Show the controls");
    b.appendChild(el("span",`width:38px;height:4px;border-radius:2px;background:${T.rule};`));
    b.onclick=immersiveWake;
    row.appendChild(b);
    return row;
  }
  // un dégradé de 64px en bas: les dernières mesures s'estompent au lieu de
  // se couper net — ça dit « ça continue » sans occuper de place
  function immersiveFade(){
    return el("div",
      `position:absolute;left:0;right:0;bottom:0;height:64px;pointer-events:none;`+
      `background:linear-gradient(to top, ${T.paper}f5, ${T.paper}00);`);
  }

  // ── la carte de voicing flottante (delta2 §6) ────────────────────────────
  // Remplace openChordSheet() PENDANT LA LECTURE seulement (à l'arrêt, la
  // grande feuille garde tout son sens: c'est là qu'on édite). Elle flotte
  // au-dessus de la grille, ne coupe pas l'audio, et se referme au prochain
  // tap ailleurs. Mêmes claviers que le prompter (splitHands/renderHand) —
  // une seule implémentation pour les deux écrans.
  function openVoicingCard(idx, anchorEl){
    if(S.piano==="never") return;      // réglage Aa: le piano ne monte jamais
    closeVoicingCard();
    const ch=S.chords[idx]; if(!ch || ch.nc) return;
    const lv=learnLevel(), q=dispQ(ch.q);
    let m;
    if(S.coachStyle==="smooth"){
      const t=vlTrack(), p=t&&t[idx];
      m=p?p.midis:withBass(voClose(ch.root,q),ch.root,(lv>=3)?ch.bass:-1);
    } else {
      const m0=voicingByStyle(ch.root,q,S.coachStyle);
      m=(S.coachStyle==="rootless")?m0:withBass(m0,ch.root,(lv>=3)?ch.bass:-1);
    }
    const card=el("div",
      `position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));`+
      `z-index:40;background:${T.card};border:1px solid ${T.line};border-radius:18px;`+
      `padding:14px 14px 12px;box-shadow:0 20px 44px -18px rgba(50,38,20,.55);`+
      `animation:ap-in .22s ease both;`);
    card.setAttribute("data-voicing-card","1");
    const head=el("div","display:flex;align-items:center;gap:10px;margin-bottom:12px;");
    head.appendChild(glyph(ch.root, q, 30, chordDepth(ch), T.ink, (lv>=3)?ch.bass:-1));
    const names=el("div",`flex:1;min-width:0;font:600 13px ${UI};color:${T.faint};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`);
    head.appendChild(names);
    head.appendChild(kitIcon("×", closeVoicingCard, "Close"));
    card.appendChild(head);
    const body=el("div","display:flex;flex-direction:column;gap:8px;");
    card.appendChild(body);
    const {left,right}=splitHands(m);
    names.innerHTML=`<span style="color:${T.accent}">L `+left.map(x=>note(mod(x,12))).join(" ")+
                    `</span> · <span style="color:#2a6fb0">R `+right.map(x=>note(mod(x,12))).join(" ")+`</span>`;
    [["R",right,"chord"],["L",left,"bass"]].forEach(([tag,mids,role])=>{
      const r=el("div","display:flex;align-items:center;gap:9px;");
      r.appendChild(el("div",
        `flex:0 0 auto;width:22px;font:700 11px ${UI};letter-spacing:.08em;color:${T.faint};`,tag));
      const host=el("div","flex:1;min-width:0;");
      r.appendChild(host); body.appendChild(r);
      renderHand(host, mids, 58, role);
      host.style.flex="1";     // renderHand réécrit cssText — le piège connu
    });
    card.appendChild(el("div",
      `margin-top:10px;font:italic 12.5px ${SERIF};color:${T.faint};`,
      "la musique continue · touche ailleurs pour refermer"));
