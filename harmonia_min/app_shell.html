    // tap sur la carte = entendre le voicing; ne se referme pas
    card.onclick=e=>{ if(e.target.tagName!=="BUTTON"){ e.stopPropagation(); playMidis(m); } };
    S._screenEl.appendChild(card);
    S._voicingCard=card;
    if(anchorEl) anchorEl.setAttribute("data-voicing-open","1");
    S._voicingAnchor=anchorEl||null;
    // un tap n'importe où ailleurs referme — capture, pour passer avant les
    // handlers des cellules
    S._voicingDismiss=e=>{ if(!card.contains(e.target)) closeVoicingCard(); };
    setTimeout(()=>document.addEventListener("pointerdown", S._voicingDismiss, true), 0);
    haptic();
  }
  function closeVoicingCard(){
    if(S._voicingDismiss){
      document.removeEventListener("pointerdown", S._voicingDismiss, true);
      S._voicingDismiss=null;
    }
    if(S._voicingAnchor){ S._voicingAnchor.removeAttribute("data-voicing-open"); S._voicingAnchor=null; }
    const c=S._voicingCard; S._voicingCard=null;
    if(!c) return;
    c.style.animation="ap-in .16s reverse both";
    setTimeout(()=>{ if(c.parentNode) c.parentNode.removeChild(c); }, 150);
    immersiveArm();
  }

  function renderChart(){
    const w=screenWrap();
    if(S.chartChrome){
      S._immFill=null;
      w.appendChild(chartToolbar());
      // FORM RAIL as the second (and last) chrome row above the grid — the
      // whole song on one line, pinned while the grid scrolls under it
      // (Louis, 2026-07-30: the timeline lives in the chart, never folded away).
      const rail=buildFormRail(); if(rail) w.appendChild(rail);
      if(S.mode==="analyse") w.appendChild(analyseLens());
    } else {
      w.appendChild(immersiveProgress());
      w.appendChild(immersiveHandle());
      // le clavier qui accompagne (Follow) ne vit QUE dans cet état — quand
      // tout le reste a disparu (Louis, 2026-08-08, l'inverse d'avant)
      if(S.piano==="follow") w.appendChild(immersiveCoach());
    }

    // Densité iReal (Louis 2026-08-02): le chart occupe l'écran — marges
    // latérales minces, le treillis va presque bord à bord comme iRealB.
    const body=el("div",`flex:1;min-height:0;overflow-y:auto;padding:10px 7px 24px;background:${T.paper};`); body.className="ap-scroll";
    const sheet=el("div","max-width:720px;margin:0 auto;");
    // 2026-07-18: ribbon ABOVE the grid so annotate tools surface without
    // scrolling (verified live back then). Its own FORM chips are gone — the
    // §2 double-FORM fix: the rail above is the one form surface.
    if(S.mode==="annotate") sheet.appendChild(buildRibbon());
    sheet.appendChild(buildRefineBand());
    sheet.appendChild(buildSectionTool());
    sheet.appendChild(buildIReal());
    body.appendChild(sheet);
    w.appendChild(body);

    const ra=renderReinferAction(); if(ra) w.appendChild(ra);
    if(S.chartChrome) w.appendChild(chartDock());
    else w.appendChild(immersiveFade());
    // §6: tout geste rappelle le chrome et relance le compte à rebours — tap
    // hors accord, glissé vers le bas, poignée. Un tap sur un ACCORD ne le
    // rappelle pas (il ouvre la carte de voicing), ni un tap sur la carte.
    let _swY=null;
    w.addEventListener("pointerdown", e=>{
      if(e.target.closest("[data-voicing-card]")) return;
      _swY=e.clientY;
      if(!e.target.closest("[data-chord-cell]")) immersiveWake();
    });
    w.addEventListener("pointermove", e=>{
      if(_swY!=null && e.clientY-_swY>36){ _swY=null; immersiveWake(); }
    });
    w.addEventListener("pointerup", ()=>{ _swY=null; });
    immersiveArm();
    return w;
  }
  // ── le liseré « ça continue en fond » ────────────────────────────────────
  // Le chart affiché est le BRUT : mesures + accords + audio, une seule
  // section « A », une gamme approchée. Les sections et l'analyse harmonique
  // arrivent quelques dizaines de secondes plus tard et réécrivent le même
  // fichier. Ce liseré est la seule chose qui le dit — discret, une ligne,
  // au-dessus de la grille, jamais un écran bloquant.
  // Toujours présent dans le DOM (vide quand il n'y a rien à dire) pour que
  // paintChartRefining puisse le remplir sans reconstruire la page — un
  // re-render complet ferait sauter la position de défilement.
  function buildRefineBand(){
    const b=el("div","margin:0 0 8px;");
    S._refineBand=b; paintChartRefining();
    return b;
  }
  function paintChartRefining(){
    const b=S._refineBand; if(!b) return;
    clear(b); b.style.display="none";
    const file=S.model&&S.model.file; if(!file) return;
    const box=(bg,bd)=>el("div",`display:flex;align-items:center;gap:9px;padding:7px 11px;background:${bg};border:1px solid ${bd};border-radius:11px;`);
    if(S.refineReady===file){
      const w=box(T.card,T.accent);
      w.appendChild(el("div",`flex:1;font:600 12px ${UI};color:${T.ink};`,"Sections et gamme prêtes"));
      const btn=el("button",`border:none;background:${T.accent};color:#fff;border-radius:9px;padding:6px 12px;font:600 12px ${UI};cursor:pointer;`,"Recharger");
      btn.onclick=()=>{ S.pending=[]; S.mode="read"; S.mergeMode=false;
                        applyRefinement(file,{}); };
      w.appendChild(btn); b.appendChild(w); b.style.display="block"; return;
    }
    if(S.refining && S.refining.file===file){
      const w=box(T.card,T.line);
      const dot=el("div",`flex:0 0 auto;width:13px;height:13px;border-radius:50%;border:2px solid transparent;border-top-color:${T.accent};animation:ap-spin .8s linear infinite;`);
      w.appendChild(dot);
      w.appendChild(el("div",`flex:1;font:500 11.5px ${UI};color:${T.faint};`,
        "Sections et gamme en cours — joue, le chart se mettra à jour tout seul."));
      b.appendChild(w); b.style.display="block";
    }
  }
  // ── the form timeline ────────────────────────────────────────────────────
  // One clickable chip per section OCCURRENCE, in play order, consecutive
  // repeats folded to ×N — e.g. `A×2  B  A  B  A  D  B×3`. Built from the
  // sections' own barRanges rather than from the `form` string, so the letters
  // shown here are exactly the letters written in the chart below it: since the
  // >=8-bar grouping and the 1st/2nd-ending collapse run server-side, the
  // detector's finer-grained form (`A×4 B×3 C A×3 …`) names sections that no
  // longer appear on the page, and showing those would be a chart that
  // disagrees with its own legend.
  // b0/b1 are SONG bars (what the chip's tooltip says); t0/t1 are the run's real
  // seconds (what the highlight is keyed on — see paintFormChip); rb0 is where
  // the run starts in the RENDERED grid, which is a different index space again
  // because the grid writes each section once.
  function formRuns(){
    const m=S.model; if(!m||!m.sections) return [];
    const occ=[];
    m.sections.forEach((s,si)=>(s.barRanges||[]).forEach((r,k)=>occ.push({
      si, k, b0:r[0], b1:r[1], label:s.label, secId:s.id,
      t0:(s.spans&&s.spans[k])?s.spans[k][0]:null,
      t1:(s.spans&&s.spans[k])?s.spans[k][1]:null })));
    occ.sort((a,b)=>a.b0-b.b0);
    const runs=[];
    occ.forEach(o=>{
      const L=runs[runs.length-1];
      if(L && L.label===o.label && L.b1+1===o.b0){ L.b1=o.b1; L.n++; if(o.t1!=null) L.t1=o.t1; }
      else runs.push({label:o.label, b0:o.b0, b1:o.b1, n:1, t0:o.t0, t1:o.t1,
                      secId:o.secId, rb0:(S.bars||[]).findIndex(b=>b.secId===o.secId)});
    });
    return runs;
  }
  // ── the form RAIL (UI refresh 2026-08-08, §3 / design 1a) ────────────────
  // Replaces the 26px-chip form strip. Louis, 2026-08-07: "les A B devraient
  // apparaitre en petit afin que toute la chanson puisse fitter
  // horizontalement sous forme de A B C .." — so the rail never scrolls.
  // Every run is a flex column with a 44px floor on BOTH axes (STYLE.md's
  // hard rule; the handoff draft let columns shrink to ~30px past 9 runs and
  // only wrapped past 14 — the 44px floor wins, so the rail wraps exactly
  // when a column would otherwise drop under 44px). The LETTER steps down
  // with run count; the ROW stays 44 — that is what the finger needs.
  function buildFormRail(){
    const runs=formRuns();
    if(runs.length<2) return null;

    const n=runs.length;
    const size = n<=6 ? 16 : n<=9 ? 15 : n<=12 ? 14 : 13;

    const rail=el("div",
      `flex:0 0 auto;display:flex;flex-wrap:wrap;gap:3px;row-gap:6px;`+
      `padding:0 14px 10px;background:${T.paper};`);
    S._formChips=[];

    runs.forEach(r=>{
      const b=el("button",
        // max-width keeps a wrapped last line from ballooning two runs to
        // half the screen each — empty space reads better than fat chips
        `flex:1 0 ${SZ.control}px;min-width:${SZ.control}px;max-width:96px;height:${SZ.control}px;`+
        `border-radius:10px;cursor:pointer;display:flex;align-items:${r.n>1?"baseline":"center"};`+
        `justify-content:center;gap:1px;font:700 ${size}px ${UI};color:${T.ink};`+
        `border:1px solid ${T.line};background:${T.card};`+
        `-webkit-tap-highlight-color:transparent;transition:background .14s,border-color .14s;`+
        (r.n>1?`padding-top:${Math.round(SZ.control/2-size/2)}px;`:""));
      b.appendChild(el("span","",r.label));
      if(r.n>1) b.appendChild(el("span",`font:600 9px ${UI};color:${T.faint};`,"×"+r.n));
      b.setAttribute("aria-label", r.label+(r.n>1?(" ×"+r.n):"")+", bars "+(r.b0+1)+"–"+(r.b1+1));
      b.title="bars "+(r.b0+1)+"–"+(r.b1+1);
      b.onclick=()=>{
        haptic();
        const dur=totalDur()||1;
        if(r.t0!=null && S.audio){ seekFrac(r.t0/dur); }
        else { setPlayhead(r.rb0>=0?r.rb0:0, 0, r.t0); }
        // Scroll to a RENDERED bar: r.b0 is a SONG bar and overshoots the
        // folded grid (This Love: song bars run to 79, the grid has 25 rows).
        const cell=(S._cells||[]).find(c=>c.bar===r.rb0);
        if(cell) cell.el.scrollIntoView({block:"center",behavior:"smooth"});
      };
      S._formChips.push({el:b, t0:r.t0, t1:r.t1});
      rail.appendChild(b);
    });

    paintFormRail(S.playTime);   // unchanged contract — still keyed on TIME
    return rail;
  }

  /* paintFormChip() keeps working as written (it only touches background and
     borderColor); this wrapper makes the active run read at a glance in a
     dense rail — solid tint + heavier letter rather than a hairline change. */
  function paintFormRail(t){
    paintFormChip(t);
    (S._formChips||[]).forEach((c,i)=>{
      const on = i===S._formChipCur;
      c.el.style.background = on ? "rgba(138,43,43,.12)" : T.card;
      c.el.style.fontWeight = on ? "800" : "700";
    });
  }
  // Highlight the chip the playhead is inside, mirroring the bar highlight so
  // both surfaces agree about where you are. Keyed on TIME, not on bar index.
  // The two surfaces count bars in DIFFERENT spaces: the grid writes each
  // section once and replays it (A×4 = 8 rendered bars played on 4 passes), so
  // setPlayhead's index runs 0..24 here, while the chips span SONG bars 0..79.
  // Comparing them lit the first chip almost always — the "form timeline stuck
  // on A" bug (Louis, iPhone, 2026-07-30; measured 9 of 10 scrub positions on
  // This Love landing on chip 0 while the bar highlight was correct throughout).
  // Seconds are the one coordinate both surfaces share.
  //
  // PICK THE CHIP THAT CONTAINS t (2026-07-30, second report: "no highlighting
  // of the timeframe that explains the chord sequences (Ax3 B Ax2 ..) on top").
  // The rule used to be "the last chip whose t0 <= t", which silently assumes
  // the chips are in TIME order. They are not: formRuns() sorts occurrences by
  // SONG BAR, because that is the order the chart reads in — and a section whose
  // span is broken upstream (an iReal import with no times gives [0,0]) can sit
  // last in the strip while claiming t0 = 0. Then "last chip with t0 <= t"
  // matched that dead chip for EVERY t, pinning the highlight there so it never
  // tracked the music. Measured on 7 of 59 charts. Containment does not care
  // about order; chips with no real span are skipped outright, and a t that
  // falls in a gap between runs keeps the most recent one that really started.
  function paintFormChip(t){
    if(!S._formChips) return;
    let cur=-1;
    if(t!=null && isFinite(t)){
      const live=S._formChips.map((c,i)=>({c,i}))
        .filter(x=>x.c.t0!=null && x.c.t1!=null && x.c.t1>x.c.t0);
      const inside=live.find(x=>t>=x.c.t0 && t<x.c.t1);
      if(inside) cur=inside.i;
      else{
        const started=live.filter(x=>x.c.t0<=t).sort((a,b)=>a.c.t0-b.c.t0);
        if(started.length) cur=started[started.length-1].i;
      }
    }
    S._formChipCur=cur;   // read by paintFormRail — comparing style.borderColor
                          // back to a hex fails (the browser returns rgb())
    S._formChips.forEach((c,i)=>{
      const on = i===cur;
      c.el.style.background = on ? "rgba(138,43,43,.12)" : T.paper;
      c.el.style.borderColor = on ? T.accent : T.line;
    });
  }
  // In-flow above the dock since the UI refresh (2026-08-08) — the old
  // absolute positioning was tuned to the retired bottom transport's height.
  function renderReinferAction(){
    if(!(S.mode==="annotate" && S.pending.length)) return null;
    const act=el("div",`flex:0 0 auto;padding:0 14px 10px;background:${T.paper};`);
    const inner=el("div",`max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:${T.deep};border-radius:13px;color:${T.paper};box-shadow:0 14px 34px -18px rgba(0,0,0,.6);`);
    const tx=el("div",""); tx.appendChild(el("div",`font:600 13px ${UI};`,"Re-infer"));
    tx.appendChild(el("div",`font:500 11px ${UI};color:rgba(247,243,233,.7);margin-top:2px;`, "your "+S.pending.length+" locked chord"+(S.pending.length>1?"s":"")+" will re-decode the song"));
    inner.appendChild(tx);
    const go2=el("button",`flex:0 0 auto;border:none;border-radius:11px;padding:12px 16px;min-height:${SZ.control}px;font:600 14px ${UI};cursor:pointer;background:${T.accent};color:#fff;`, "Re-infer · "+S.pending.length);
    go2.onclick=runReinfer; inner.appendChild(go2);
    act.appendChild(inner); return act;
  }

  // buildLadder() and legendFor() are gone (UI refresh 2026-08-08, §2): the
  // level ladder is a row in the Aa sheet, the analyse legend is the one-line
  // kitLegend inside analyseLens(), and the annotate confidence line lives in
  // buildRibbon(). LEVEL_CAPTION stays — the Aa sheet prints it.
  const LEVEL_CAPTION={
    1:"Level 1 — triads only: the skeleton of the harmony, nothing to trip on.",
    2:"Level 2 — the three everyday 7th chords; added tones and inversions drop away.",
    3:"Level 3 — the full picture, exactly as detected."
  };

  function chordColor(ch){
    if(S.mode==="read") return T.ink;
    // "Key" mode (2026-07-21 rework): a chord's colour used to be keyFill(root) —
    // a fixed hue per pitch class, no scale awareness at all (the bug the user
    // caught: two chords sharing a scale could still get different-looking text
    // once the playhead's own highlight sat behind one of them). The text now
    // stays plain ink in every analyse sub-mode except Function; which SCALE is
    // in effect is shown by the halo drawn under runs of bars in buildIReal(),
    // not by the chord glyph's own colour.
    if(S.mode==="analyse") return S.colorMode==="function"?fnColor(ch.root,S.key):T.ink;
    return ch.confirmed?T.ink:confColor(ch.c);
  }
  // Annotate writes every chord EXACTLY as the chart does (Louis, 2026-08-08:
  // « les mêmes accords que dans le chart ») — doubt is carried by confColor's
  // tint alone; the depth ladder no longer strips shaky chords to the family.
  function chordDepth(ch){ return "exact"; }

  function buildIReal(){
    const frame=el("div",`position:relative;background:${T.paper};border:1px solid ${T.line};border-radius:8px;overflow:hidden;`);
    const grid=el("div","display:grid;grid-template-columns:repeat(4,minmax(0,1fr));");
    // A phone is 390px: four bars of "D♭maj7" at desktop size do not fit, and
    // a grid item's default min-width:auto silently widens the column instead
    // of shrinking the type — which pushed bars 3 and 4 of every row off the
    // clipped edge. minmax(0,1fr) + min-width:0 lets the column hold the line;
    // the glyph scales instead.
    const W=root.clientWidth||390, narrow=W<470;
    // SZ2 (two-chords-per-bar) used to be shrunk hard relative to SZ1
    // (ratio .65-.73) — user feedback 2026-07-21 comparing against iRealB:
    // there's room in the cell for these to read bigger. Narrowed the gap to
    // a .85-.87 ratio instead of upsizing outright, since a bar cell is a
    // fixed quarter of the row width regardless of chord count.
    // Densité iReal (Louis 2026-08-02): accords plus GROS dans des rangées
    // moins hautes — le glyphe remplit sa cellule au lieu de flotter dans du
    // vide vertical. BARH est LA hauteur de rangée (cellules réelles ET
    // fillers de closeRow — une seule constante, sinon le treillis casse).
    // Immersif (delta2 §6): « mêmes cellules, plus hautes » — la grille
    // respire en hauteur (ratio du handoff 88/74), les glyphes ne changent
    // PAS (les grossir aussi re-created le chevauchement des barres denses
    // en notation normale — vu au premier passage de vérification).
    const imm = S.screen==="chart" && S.chartChrome===false;
    const SZ1=narrow?26:32, SZ2=narrow?22:28, SZ3=narrow?15:19;
    const BARH=imm?(narrow?67:76):(narrow?56:64);
    S._cells=[];
    const secGapRows=new Set();
    let rowCells=[];
    const bars=S.bars.map(b=>({sec:b.sec, secId:b.secId, secFirst:b.secFirst, reps:b.reps,
                               ending:b.ending, endingFirst:b.endingFirst,
                               chords:b.idxs.map(i=>({ch:S.chords[i], idx:i}))}));
    // Key/scale halo (2026-07-21 rework of the old per-root keyFill text colour).
    // chordKey is aligned 1:1 with S.chords — PER CHORD, not per bar (2026-07-21
    // fix: an earlier version sampled only each bar's FIRST chord, so a bar
    // holding e.g. "Cmaj7 A7" or "Dm7 G7" silently painted BOTH chords with the
    // first one's scale — exactly the case the user caught: A7 (a real V7/D-minor
    // pivot) was hidden under bar5's "A minor" colour instead of showing its own
    // "D minor", same for G7 inside bar6). A leading held/silent chord-less bar
    // has nothing to sample; it falls back to the song's home key.
    let chordKey=null;
    if(S.mode==="analyse" && S.colorMode==="key" && S.chords.length){
      chordKey=keyTrackFor(S.chords, S.key, S.keyMode);
    }
    const globalLens = S.mode==="analyse" && S.colorMode==="global";
    // Running scale label, in RENDER order — crosses bar and row boundaries so a
    // run-start is detected at the exact chord where the collection changes, not
    // per bar. Null means "nothing rendered yet"; the very first real segment
    // always counts as a run-start (see `changed` below) and a leading held/
    // silent bar with nothing to inherit falls back to the song's home key (bar
    // 1 of "The Jackson 5 - ABC" had neither, and went halo-less before this).
    let lastKeyLabel=null;
    // iReal-style layout (user request 2026-07-19): every section change starts
    // a NEW ROW (grid-column-start:1), even if the previous row is left short;
    // col/row are therefore tracked explicitly (bi%4 no longer holds). In Read
    // mode the Intro section collapses to a single label-only row — an intro's
    // bar count is noise on a lead sheet; Annotate/Analyse keep its bars so
    // N.C. cells stay correctable.
    let col=0,row=0,introRow=null,lastCh=null,endingAnchorCol=null;
    bars.forEach((b,bi)=>{
      // Louis, 2026-08-08: the chord-less leading intro does not print AT ALL
      // in Read — the form rail above still carries it. Analyse/Annotate keep
      // its bars (N.C. cells stay inspectable and correctable).
      if(S.mode==="read" && S._hiddenIntroId && b.secId===S._hiddenIntroId) return;
      const isIntro = S.mode==="read" && /^intro/i.test(String(b.sec||""));
      if(isIntro){
        if(!introRow){
          if(col!==0){col=0;row++;}
          introRow=el("div",`position:relative;grid-column:1/-1;display:flex;align-items:center;gap:8px;min-height:${narrow?34:40}px;padding:0 ${narrow?8:12}px;${row>0?`border-top:1px solid ${T.rule};`:""}`);
          introRow.appendChild(el("div",`font:800 ${narrow?9:11}px ${UI};color:${T.accent};border:1.5px solid ${T.accent};border-radius:4px;padding:0 3px;background:${T.paper};`,b.sec));
          introRow.appendChild(el("div",`font:italic 500 ${narrow?11:12.5}px ${SERIF};color:${T.faint};`,"…"));
          introRow.dataset.bar=String(bi);
          if(S.mode!=="annotate") introRow.onclick=()=>{ if(S.tapSeek) seekToBar(bi); };
          grid.appendChild(introRow);
          row++;
        }
        const ph=el("div",`position:absolute;right:0;top:0;bottom:0;width:3px;background:${T.accent};display:none;`); introRow.appendChild(ph);
        const sel=el("div","position:absolute;inset:0;pointer-events:none;display:none;"); introRow.appendChild(sel);
        S._cells.push({el:introRow, bar:bi, idxs:b.chords.map(x=>x.idx), ph, sel});
        return;
      }
      introRow=null;
      // A 1st ending CONTINUES the row its shared prefix left off on — it's
      // still the same A, not a new line (user correction 2026-07-21: my
      // earlier "always start a fresh row" was wrong, "c'est la suite du
      // A"). Only forced to wrap when the row is genuinely full (col===4,
      // same rule as any other bar) or a section changes. A 2nd+ ending
      // still forces its OWN row — it can't share a column with the 1st
      // ending's bars, so it has nowhere else to go but the next line.
      const endingHead = b.ending && b.endingFirst;
      const endingForcesBreak = endingHead && b.ending!=="1";
      // A 2nd+ ending aligns under the 1st ending's column (real iRealB
      // convention — user 2026-07-21: "le 2 devrait être aligné avec le 1"),
      // not back at column 1. endingAnchorCol remembers where "1." landed;
      // grid-column-start explicitly jumps there, leaving the skipped
      // columns blank (no DOM cell = no border, just paper).
      let skipToCol=null;
      // Règle d'or (Louis 2026-08-02): toutes les barres de taille uniforme.
      // Une section qui finit en rangée incomplète: on COMPLÈTE la rangée
      // avec des cellules vides bordées (même treillis), et la dernière
      // rangée de chaque section reçoit sa bordure basse (le gap secGap la
      // détache de la border-top de la rangée suivante).
      const closeRow=()=>{
        while(col!==0 && col<4){
          const f=el("div",`min-height:${BARH}px;border-left:1px solid ${T.rule};${row>0?`border-top:1px solid ${T.rule};`:""}`);
          grid.appendChild(f); rowCells.push(f); col++;
        }
        rowCells.forEach(c=>{ c.style.borderBottom=`1px solid ${T.rule}`; });
      };
      if(b.secFirst && col!==0){closeRow(); col=0;row++;}
      else if(endingForcesBreak && col!==0){row++; col=(endingAnchorCol!=null?endingAnchorCol:0); skipToCol=col;}
      else if(col===4){col=0;row++;}
      if(col===0||skipToCol!=null) rowCells=[];
      const atRowStart=col===0;
      const rowBroke = skipToCol!=null;
      if(endingHead && b.ending==="1") endingAnchorCol=col;
      // Only when an ending genuinely opens its OWN row does it get the
      // section-style left inset + the hanging bracket (digit + tick sitting
      // in a margin-top gap ABOVE the row, so it doesn't read as the
      // previous row's underline — 2026-07-21 fix). Sharing a row with its
      // own prefix needs neither: the accent top border alone, sized to
      // this one cell, already reads as "the alternate tail" without
      // pushing its row out of alignment with its siblings.
      const endingOwnRow = endingHead && (atRowStart || rowBroke);
      const leftPad = endingOwnRow ? (narrow?21:26) : (narrow?3:8);
      const endingGap = narrow?13:16;
      const secGap = narrow?22:26;
      if(b.secFirst) secGapRows.add(row);
      const inSecGapRow = secGapRows.has(row);
      const gridStart = b.secFirst ? 1 : (skipToCol!=null ? skipToCol+1 : (endingOwnRow?1:null));
      const bpbQ=S.model.bpb||4;
      // §7 (delta2 / design 4a): en écriture compacte, dès 2 accords la barre
      // les EMPILE À GAUCHE avec un écart fixe (flex) au lieu de les répartir
      // sur les temps. C'est le changement de layout qui fait tenir 4 accords
      // — le glyphe serré tout seul ne suffit pas. Ce qu'on perd: l'abscisse
      // ne dit plus le temps; on le lit au nombre d'accords dans la barre,
      // comme iReal depuis toujours. L'exception gardée: un accord hors temps
      // régulier (beat non entier) garde la grille proportionnelle, sinon le
      // chart ment. Le mode normal garde la grille de temps — le serrage est
      // le contrat de l'écriture compacte, pas un changement global.
      const tight = PREF.notation==="compact" && b.chords.length>=2 &&
        b.chords.every(({ch})=>ch.beat==null || ch.beat===Math.round(ch.beat));
      const tightPad = endingOwnRow ? leftPad : (b.chords.length>=4?7:9);
      const layoutCss = tight
        ? `display:flex;align-items:center;gap:${tightGap(b.chords.length)}px;padding:0 ${narrow?3:8}px 0 ${tightPad}px;`
        : `display:grid;grid-template-columns:repeat(${bpbQ},minmax(0,1fr));align-items:center;column-gap:2px;padding:0 ${narrow?3:8}px 0 ${leftPad}px;`;
      const cell=el("div",`position:relative;min-width:0;min-height:${BARH}px;${layoutCss}${endingOwnRow?`margin-top:${endingGap}px;`:(inSecGapRow?`margin-top:${secGap}px;`:"")}${gridStart!=null?`grid-column-start:${gridStart};`:""}${col>0?`border-left:1px solid ${T.rule};`:""}${b.ending?`border-top:2px solid ${T.accent};`:(row>0?`border-top:1px solid ${T.rule};`:"")}`);
      // Scale halo: a coloured underline strip per CHORD, not per bar (2026-07-21
      // fix — see chordKey's own comment above for the "A7 hidden inside bar5"
      // bug this replaces). Never on `background` — setPlayhead() stomps that
      // property on the current bar, the same failure mode that caused the
      // original "two different colours for one scale" report. Segments are
      // evenly split across however many chords share this bar, so e.g. "Cmaj7
      // A7" gets two independently-coloured halves, not one shared colour.
      // Key lenses (new-chord-ux handoff #5): FULL-CELL colour bands, not the
      // old 4px underline — "full-cell vertical fill is the approved look;
      // per-chord pill and horizontal-strip variants were rejected". Cells
      // are edge-to-edge, so adjacent same-key cells read as one continuous
      // band. Bands are z-index:0 UNDER the glyphs (items are z-index:1);
      // the playhead's right-edge bar is appended after and stays visible.
      if(chordKey){
        const segs = b.chords.length
          ? b.chords.map(({ch,idx})=>ch.nc?null:chordKey[idx])
          : [lastKeyLabel || {tonic:S.key, mode:S.keyMode}];
        const n=segs.length;
        segs.forEach((k,i)=>{
          if(!k) return;
          const coll=collOf(k.tonic,k.mode), hue=keyHue(coll), minor=k.mode==="minor";
          const changed = !lastKeyLabel || collOf(lastKeyLabel.tonic,lastKeyLabel.mode)!==coll;
          const hb=b.chords.length?Math.max(0,Math.min(bpbQ-1,(b.chords[i].ch.beat!=null?b.chords[i].ch.beat:0))):0;
          const hw=b.chords.length?((i+1<n?Math.max(hb+1,Math.min(bpbQ,(b.chords[i+1].ch.beat!=null?b.chords[i+1].ch.beat:bpbQ))):bpbQ)-hb):bpbQ;
          cell.appendChild(el("div",`position:absolute;left:${hb/bpbQ*100}%;width:${hw/bpbQ*100}%;top:0;bottom:0;background:${lensBand(hue,minor)};z-index:0;pointer-events:none;`));
          if(changed){
            cell.appendChild(el("div",`position:absolute;left:calc(${i/n*100}% + 2px);bottom:3px;font:700 ${narrow?8:9.5}px ${UI};letter-spacing:.01em;color:${lensLabelColor(hue,minor)};z-index:2;pointer-events:none;white-space:nowrap;`,keyLabelName(k.tonic,k.mode)));
          }
          lastKeyLabel=k;
        });
      }
      if(globalLens){
        const coll=collOf(S.key,S.keyMode), hue=keyHue(coll), minor=S.keyMode==="minor";
        cell.appendChild(el("div",`position:absolute;inset:0;background:${lensBand(hue,minor)};z-index:0;pointer-events:none;`));
      }
      if(b.secFirst){
        // Louis 2026-08-02: le badge vit AU-DESSUS de la rangée (dans le
        // gap secGap), plus DANS la barre — les accords ne sont plus
        // décalés. Les ×N n'apparaissent que dans la strip FORM en tête.
        cell.appendChild(el("div",`position:absolute;left:0;top:-${secGap-3}px;font:800 ${narrow?9:11}px ${UI};color:${T.accent};border:1.5px solid ${T.accent};border-radius:4px;padding:0 4px;background:${T.paper};z-index:2;`,b.sec));
        cell.appendChild(el("div",`position:absolute;left:2px;top:0;bottom:0;width:2px;background:${T.ink};`));
      }
      if(endingHead){
        // Own row: label + tick sit IN the margin gap, above the border-top
        // rule, forming a hanging "⌐1." bracket. Sharing a row: no gap
        // exists to hang in, so both sit just inside the cell's top edge
        // instead — still legible, distinguished from a section badge by
        // colour/digit shape alone.
        const labelTop = endingOwnRow ? (-endingGap+1) : (narrow?3:4);
        const tickH = endingOwnRow ? (endingGap+9) : (narrow?13:16);
        cell.appendChild(el("div",`position:absolute;left:4px;top:${labelTop}px;font:800 ${narrow?9:11}px ${UI};color:${T.accent};z-index:2;`,b.ending+"."));
        cell.appendChild(el("div",`position:absolute;left:2px;top:${labelTop}px;height:${tickH}px;width:2px;background:${T.accent};`));
      }
      // Learn reduction can collapse two different chords in one bar to the
      // same label (B♭maj7 · B♭7 both read B♭ at L1). A lead sheet never
      // prints the same chord twice inside one bar, so the duplicate is
      // dropped — only in Learn; L3/Advanced always shows the full picture.
      let prevInBar=null;
      b.chords.forEach(({ch,idx})=>{
        if(S.learn && !ch.nc){
          const key=ch.root+"|"+dispQ(ch.q);
          if(prevInBar===key) return;
          prevInBar=key;
        } else prevInBar=null;
        const q4=Math.max(0,Math.min(bpbQ-1,(ch.beat!=null?ch.beat:0)));
        // Annotate renders chords as <button>; a 44×44 minimum grows the TAP
        // target to the kit floor without moving the glyph (the cell is
        // 56-64 tall so the box fits; in a dense 3-4 chord bar the 44-wide
        // boxes overlap and DOM order arbitrates — each glyph itself always
        // stays inside its own exclusive zone).
        const item=el(S.mode==="annotate"?"button":"div",`position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;background:none;border:none;cursor:${ch.nc&&S.mode!=="annotate"?"default":"pointer"};padding:0 ${tight?0:2}px;${S.mode==="annotate"?"min-height:44px;min-width:44px;":""}${tight?"":`grid-column:${q4+1};grid-row:1;justify-self:start;`}${ch.carry?"opacity:.72;":""}`);
        // 3-4 chords/bar (trusted iReal walking turnarounds) need a third,
        // smaller size tier — SZ1/SZ2 alone only split 1 vs >1 (2026-07-21).
        // En serré (§7) la taille suit le nombre d'accords: 30/25/22/19,
        // plancher dur à 19 — la seule échelle, quel que soit narrow.
        const size=tight?tightSize(b.chords.length):(b.chords.length>=3?SZ3:(b.chords.length>1?SZ2:SZ1));
        // No-chord (N.C.) cell: music-x-lab detected silence/no harmony here.
        // Render a faint "N.C." rather than an invented glyph (the intro/outro
        // of a track, or an a-cappella bridge) — known_issues.md 2026-07-19
        // * CHORDS / NO-CHORD. Still clickable in annotate mode to override.
        if(ch.nc){
          item.appendChild(el("div",`font:italic 600 ${narrow?15:18}px ${SERIF};color:${T.faint};opacity:.55;`,"N.C."));
          if(S.mode==="annotate" && !S.mergeMode && !S.suggMode && !S.sectSuggMode) item.onclick=()=>openEditor(idx);
          cell.appendChild(item);
          return;
        }
        // Learn mode relabels through the ladder (dispQ); slash bass is an
        // L3 concept and hides below it. The tiny amber tag marks cells whose
        // label genuinely simplified, so Learn never silently lies.
        const dq=dispQ(ch.q);
        const bassHidden=S.learn&&S.level<3&&ch.bass!=null&&ch.bass>=0&&mod(ch.bass,12)!==mod(ch.root,12);
        item.appendChild(glyph(ch.root,dq,size,chordDepth(ch),chordColor(ch),bassHidden?-1:ch.bass));
        if(S.learn&&(dq!==ch.q||bassHidden)) item.appendChild(el("span",`font:600 8px ${UI};color:${T.amber};`,"simpler"));
        if(S.mode==="annotate"&&!ch.confirmed){
          // No percentage any more (2026-07-30). The old number was the model's
          // own score: it read 36 pp low and had AUC 0.480 — it did not rank
          // right chords above wrong ones, so printing it was worse than
          // printing nothing. The colour IS the confidence now, and it comes
          // from how often the song repeats this chord (chord_confidence.py).
          // The "?" marks a chord the song never plays again — right 14% of the
          // time, the one flag actually worth acting on.
          if(ch.c<.42) item.appendChild(el("span",`position:absolute;top:-4px;right:-2px;font:700 12px ${UI};color:${confColor(ch.c)};`,"?"));
        }
        if(S.mode==="annotate"&&ch.confirmed){
          item.appendChild(el("span",`font:600 10px ${UI};color:${T.green};`,"locked"));
        }
        const gt=gtForSpan(ch.t0,ch.t1);
        if(gt){
          const ok=gtMatches(gt,ch);
          item.appendChild(el("span",
            `font:italic 600 ${narrow?9:10.5}px ${SERIF};color:${ok?T.faint:T.accent};opacity:${ok?.75:1};margin-top:1px;white-space:nowrap;`,
            "GT "+gt.text+(gt.extra?"…":"")));
        }
        if(S.mode==="annotate" && !S.mergeMode && !S.suggMode && !S.sectSuggMode) item.onclick=()=>openEditor(idx);
        // Read/Analyse à l'arrêt: tap → la grande feuille (piano + voicings —
        // c'est là qu'on édite). En LECTURE Read (§6 delta2): "tap" fait
        // monter la carte de voicing par-dessus la grille sans couper
        // l'audio; "follow" garde la feuille (le clavier du bas suit déjà);
        // "never" ne monte rien — la grille reste seule.
        else if(S.mode!=="annotate"){
          item.setAttribute("data-chord-cell","1");
          item.onclick=()=>{
            if(S.tapSeek){ seekToBar(bi); return; }
            if(S.playing && S.mode==="read"){
              if(S.piano==="tap") openVoicingCard(idx, cell);
              else if(S.piano==="follow") openChordSheet(idx);
            } else openChordSheet(idx);
          };
        }
        cell.appendChild(item);
        lastCh=ch;
      });
      // Held bar: no chord of its own — the previous chord sounds through it.
      // A faint "%" (simile) reads fine when the bar it repeats is right
      // there on the same row — but never at the START of a row (user rule
      // 2026-07-20): the previous bar is above, out of view, so "%" means
      // nothing on its own. Re-spell the actual chord there instead.
      if(!b.chords.length){
        if(atRowStart && lastCh){
          const item=el("div","position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;grid-column:1/-1;justify-self:center;");
          item.appendChild(glyph(lastCh.root,dispQ(lastCh.q),SZ1,chordDepth(lastCh),chordColor(lastCh),(S.learn&&S.level<3)?-1:lastCh.bass));
          cell.appendChild(item);
        } else {
          cell.appendChild(el("div",`position:relative;z-index:1;font:700 ${narrow?22:28}px ${SERIF};color:${T.faint};opacity:.5;grid-column:1/-1;justify-self:center;`,"%"));
        }
      }
      const ph=el("div",`position:absolute;right:0;top:0;bottom:0;width:3px;background:${T.accent};display:none;`); cell.appendChild(ph);
      const sel=el("div","position:absolute;inset:0;pointer-events:none;display:none;");
      cell.appendChild(sel);
      cell.dataset.bar=String(bi);
      // Sur la CELLULE, pas seulement sur le glyphe : une mesure tenue (« % »)
      // ou vide n'a aucun accord à taper, et c'est justement une mesure où on
      // veut pouvoir reprendre. Le tap sur un accord passe par le même appel,
      // donc les deux ne peuvent pas se contredire.
      // Le réglage est lu AU CLIC, pas à la construction : le basculer dans la
      // feuille Aa agit tout de suite, sans re-rendre la grille sous une
      // feuille ouverte.
      if(S.mode!=="annotate" && !sectToolOn()) cell.onclick=()=>{ if(S.tapSeek) seekToBar(bi); };
      S._cells.push({el:cell, bar:bi, idxs:b.chords.map(x=>x.idx), ph, sel});
      grid.appendChild(cell);
      rowCells.push(cell);
      col++;
    });
    // fermer la toute dernière rangée du chart (mêmes règles). BARH, la même
    // constante que partout — les 64/74 en dur dataient d'avant la densité
    // 2026-08-02 et laissaient la dernière rangée plus haute que les autres.
    while(col!==0 && col<4){
      const f=el("div",`min-height:${BARH}px;border-left:1px solid ${T.rule};${row>0?`border-top:1px solid ${T.rule};`:""}`);
      grid.appendChild(f); rowCells.push(f); col++;
    }
    rowCells.forEach(c=>{ c.style.borderBottom=`1px solid ${T.rule}`; });
    frame.appendChild(grid);
    if(S.mergeMode) attachSpanDrag(grid);
    if(sectToolOn()) attachSectionDrag(grid);
    paintSpans();
    paintSectionTool();
    if(S.mode==="annotate" && S.suggMode) paintSuggestions();
    if(S.mode==="annotate" && S.sectSuggMode) paintSectionSuggestions();
    setPlayhead(S.playBar, S.playRep, S.playTime);
    return frame;
  }

  // ── swipe a range of bars to define a span to pool ──────────────────────
  // Section chips only ever offered whole segmenter sections, which on a jazz
  // solo are 72/88/128 bars long and never equal — i.e. never poolable. Swiping
  // your own two ranges is the way to actually USE pooling on those songs: mark
  // the same 16 bars in two different choruses and they pool.
  const SPAN_TINT=["rgba(31,138,91,.16)","rgba(42,111,176,.16)"];
  const SPAN_EDGE=[T.green,T.blue];
  function attachSpanDrag(grid){
    let anchor=null;
    const barUnder=(x,y)=>{ const e=document.elementFromPoint(x,y); const c=e&&e.closest?e.closest("[data-bar]"):null; return c?+c.dataset.bar:null; };
    grid.style.touchAction="none";
    grid.addEventListener("pointerdown",e=>{
      if(S.spans.length>=2) return;
      const b=barUnder(e.clientX,e.clientY); if(b==null) return;
      anchor=b; S._drag={b0:b,b1:b}; paintSpans(); haptic(5);
      grid.setPointerCapture(e.pointerId);
    });
    grid.addEventListener("pointermove",e=>{
      if(anchor==null) return;
      const b=barUnder(e.clientX,e.clientY); if(b==null) return;
      const nb={b0:Math.min(anchor,b), b1:Math.max(anchor,b)};
      if(!S._drag || nb.b0!==S._drag.b0 || nb.b1!==S._drag.b1){ S._drag=nb; paintSpans(); haptic(3); }
    });
    const end=()=>{
      if(anchor==null) return;
      anchor=null;
      const d=S._drag; S._drag=null;
      if(d){ S.spans.push(d); }
      go("chart");
      if(S.spans.length===2) openMerge();
    };
    grid.addEventListener("pointerup",end);
    grid.addEventListener("pointercancel",end);
  }
  // ── L'OUTIL SECTIONS (Louis, 2026-08-09) ─────────────────────────────────
  // « Une option toute simple sur le chart raw quand il apparaît. Un petit
  // outil sections, où on clique sur une section, ensuite on peut
  // sélectionner A B C intro verse bridge, et passer le doigt le long des
  // barres correspondant à la section pour les sélectionner, puis on valide.
  // Dès qu'on valide, l'outil repère automatiquement les autres repeats. »
  //
  // Le geste : choisir une lettre → glisser le long des mesures → Valider.
  // Le serveur cherche les reprises (harmonia_min/section_tool.py, ancré sur
  // LA sélection) et elles s'allument dans la couleur de la lettre. Une
  // reprise proposée est en pointillés tant qu'on ne l'a pas gardée : la
  // toucher l'enlève. Mesuré sur les 18 morceaux annotés à la main : 86 %
  // des occurrences arrivent seules, ~12 mesures de trop par lettre restent
  // à retirer du doigt.
  //
  // Les LETTRES sont exactement celles de sa page /reports/annotate.html —
  // pas « verse/chorus » : ses 18 annotations, la seule vérité terrain des
  // sections, sont écrites dans ce vocabulaire, et l'outil écrit dans le
  // MÊME fichier (state/sections/<stem>.json) via /api/section-marks. Deux
  // vocabulaires auraient fait deux vérités.
  const SECT_LABELS=[["intro","#8a8371"],["A","#b3261e"],["B","#1f8a5b"],
                     ["C","#2a6fb0"],["D","#c58a2e"],["E","#7c3aed"],
                     ["bridge","#0f766e"],["solo","#0284c7"],
                     ["queue","#a0522d"],["outro","#6b7280"]];
  const sectColor=lb=>{ const f=SECT_LABELS.find(x=>x[0]===lb); return f?f[1]:T.faint; };
  function sectToolOn(){ return !!S.sectTool; }
  /* Mesure RENDUE → mesures de la CHANSON. Sur le chart brut les deux
     coïncident, mais un chart replié écrit un bloc UNE fois pour N passages :
     `data-bar` est alors un indice d'affichage, pas un indice de morceau, et
     l'envoyer tel quel au serveur désigne les mauvaises mesures (constaté au
     rendu sur Bein Green : 20 mesures affichées pour 52 jouées). On passe donc
     par le TEMPS, qui est la seule chose que les deux espaces partagent. */
  function songBarsOfCell(bi){
    const b=(S.bars||[])[bi], grid=(S.model&&S.model.barGrid)||[];
    if(!b || grid.length<2) return [bi];
    const spans=(b.tspans&&b.tspans.length)?b.tspans:[[b.t0,b.t1]];
    const out=[];
    spans.forEach(sp=>{
      if(sp[0]==null) return;
      let lo=0;
      for(let k=0;k<grid.length-1;k++) if(grid[k]<=sp[0]+1e-4) lo=k;
      if(out.indexOf(lo)<0) out.push(lo);
    });
    return out.length?out:[bi];
  }
  function songBarOfCell(bi){ return songBarsOfCell(bi)[0]; }
  /* Les mesures déjà réclamées — celles des autres lettres ET celles que la
     lettre courante possède déjà. Mesuré sur les 18 annotations : passer ce
     que l'utilisateur a VALIDÉ fait 86 % de rappel contre 82 %, et 411
     mesures hors-lettre contre 711. */
  function sectClaimed(label){
    // SEULEMENT les AUTRES lettres. Passer aussi les occurrences de la lettre
    // en cours verrouillait tout : sur une chanson déjà annotée, l'outil ouvre
    // avec TOUTES ses sections, donc toutes les mesures étaient « prises » et
    // la recherche ne rendait plus jamais rien (mesuré : 3 reprises trouvées à
    // vide contre 0 avec l'annotation chargée). C'est-à-dire précisément le
    // cas que cet outil doit servir — modifier une annotation existante.
    const out=[];
    (S.sectTool?S.sectTool.marks:[]).forEach(m=>{
      if(m.label===label) return;
      m.occurrences.forEach(o=>{ for(let b=o.b0;b<=o.b1;b++) out.push(b); });
    });
    return out;
  }
  /* L'outil OUVRE SUR L'EXISTANT (Louis, 2026-08-09 : « même quand les
     sections sont écrites, on devrait pouvoir les modifier dans le même
     outil »). Le serveur dit d'où vient ce qu'il rend : son annotation à la
     main, son brouillon en cours, ou — à défaut — ce que le détecteur a
     trouvé. La page blanche voulait dire « pour modifier, refais tout ». */
  /* LE CHART SE DÉPLIE PENDANT QU'ON ANNOTE (Louis, 2026-08-10 : « quand on
     annote une section, il faut pas que la visu du chart soit déjà découpée
     en sections […] la vue devrait être le raw chart TOUJOURS »).

     Un chart replié écrit un bloc UNE fois pour N passages : on ne peut pas
     désigner au doigt une mesure qui n'est pas à l'écran, et la vue impose
     déjà un découpage qu'on est justement en train de remettre en cause. On
     reconstruit donc un modèle à UNE seule section couvrant toutes les
     mesures, dans l'ordre du morceau — les accords d'un passage non écrit
     sont ceux de son bloc, c'est précisément ce que « replier » veut dire.
     Les sections connues restent visibles, en couleur, par-dessus.

     Effet de bord voulu : dans cette vue, mesure AFFICHÉE = mesure de la
     CHANSON. Toute la famille de bugs d'indices (le ✕ qui efface le mauvais
     passage, le glissé qui avale des mesures invisibles) disparaît par
     construction. */
  function unfoldedModel(m){
    const grid=(m.barGrid||[]).slice();
    const n=Math.max(0, grid.length-1);
    if(n<1 || !(m.sections||[]).length) return m;
    const barOfTime=(t)=>{
      if(t==null) return null;
      let lo=null;
      for(let k=0;k<n;k++) if(grid[k]<=t+1e-4) lo=k;
      return lo;
    };
    // On repart du modèle SERVEUR, pas de l'état déjà aplati de l'écran :
    // celui-ci a perdu les accords tenus (ils y deviennent des mesures
    // vides « % »), et les recopier rendait un chart entièrement vide.
    // `barSpans[r][p]` donne l'instant de la mesure écrite r au passage p —
    // c'est la seule table qui relie les deux espaces sans supposer que les
    // passages ont la même longueur.
    const bars=new Array(n).fill(null);
    (m.sections||[]).forEach(sec=>{
      const written=sec.bars||[];
      const ranges=sec.barRanges||[];
      written.forEach((barChords,r)=>{
        const spans=(sec.barSpans||[])[r];
        if(spans && spans.length){
          spans.forEach(sp=>{
            const b=barOfTime(sp && sp[0]);
            if(b!=null && b<n && bars[b]==null) bars[b]=barChords;
          });
        } else {
          ranges.forEach(rg=>{
            const b=(rg&&rg.length===2)?rg[0]+r:null;
            if(b!=null && b<n && bars[b]==null) bars[b]=barChords;
          });
        }
      });
    });
    // une mesure qu'aucun passage ne réclame tient l'accord précédent
    for(let b=0;b<n;b++) if(bars[b]==null) bars[b]=(b?bars[b-1]:[])||[];
    const barSpans=[];
    for(let b=0;b<n;b++) barSpans.push([[grid[b], grid[b+1]]]);
    return {...m, sections:[{id:"RAW", label:"", tag:"", reps:1,
                             spans:[[grid[0], grid[n]]],
                             barRanges:[[0, n-1]], bars, barSpans}]};
  }

  async function openSectionTool(){
    const folded=S.model;
    S.sectTool={label:"A", marks:[], sel:null, busy:true, note:"chargement…",
                thr:0.78};
    // on garde le modèle replié pour le remettre en sortant
    const un=unfoldedModel(folded);
    if(un!==folded){
      S._foldedModel=folded;
      loadModel(un, {keepTool:true});
      S.model.file=folded.file;              // même chart côté serveur
    }
    go("chart");
    const st=S.sectTool, m=S.model;
    try{
      const r=await api.get("/api/section-marks/"+m.file);
      // Quand la source est le chart lui-même, ce sont les lettres du SERVEUR
      // (celles du modèle brut). L'écran, lui, a pu renommer la première
      // section en « intro » et décaler les autres : l'outil posait alors un
      // « A » sur les mesures de l'intro. On reprend donc les lettres telles
      // qu'elles sont AFFICHÉES.
      let secs=r.sections||[];
      if(r.source==="chart" && (m.sections||[]).length){
        secs=[];
        (m.sections||[]).forEach(sec=>(sec.barRanges||[]).forEach(rg=>{
          if(rg && rg.length===2)
            secs.push({label:sec.label||"?", b0:rg[0], b1:rg[1]});
        }));
        secs.sort((a,b)=>a.b0-b.b0);
      }
      const by={};
      secs.forEach(x=>{
        const lb=x.label||"?";
        if(lb==="?") return;                 // un trou n'est pas une lettre
        (by[lb]=by[lb]||[]).push({b0:x.b0, b1:x.b1, rot:0, source:"loaded"});
      });
      st.marks=Object.keys(by).map(lb=>({label:lb, occurrences:by[lb]}));
      st.note = st.marks.length
        ? ({truth:"chargé depuis ton annotation à la main",
            draft:"chargé depuis ton brouillon en cours",
            chart:"chargé depuis les sections trouvées par la machine — à corriger"}[r.source]
           || "")
        : "";
      const first=secs.map(x=>x.label).find(x=>x&&x!=="?"&&x!=="intro");
      if(first) st.label=first;
    }catch(e){
      // Un catch muet ouvrait l'outil EXACTEMENT comme un morceau jamais
      // annoté : on croyait partir de zéro, on remarquait tout, et
      // « Enregistrer comme vérité » remplaçait les sections faites à la
      // main. L'outil se déclare donc en panne et s'interdit d'écrire.
      st.loadFailed=true;
      st.note="impossible de lire les sections existantes ("+String(e).slice(0,60)+
              ") — rien ne sera enregistré tant que ce n'est pas relu";
    }
    st.busy=false; go("chart");
  }
  function closeSectionTool(){
    const folded=S._foldedModel;
    S.sectTool=null; S._foldedModel=null;
    if(folded) loadModel(folded);            // on rend la vue repliée
    go("chart");
  }

  /* La bande de l'outil : une ligne quand il dort, le poste de travail
     quand il est ouvert. N'apparaît que sur le chart BRUT — une seule
     section couvrant tout le morceau, c'est la définition structurelle du
     brut côté client (le modèle ne porte pas de drapeau). */
  function buildSectionTool(){
    const wrap=el("div","margin:0 0 8px;");
    const m=S.model;
    // « Sur le chart raw quand il apparaît » — mais quel test ? `meta.raw`
    // n'est PAS dans le modèle servi (vérifié : meta ne porte que bpm,
    // engine, musx_latency_ms, n_segments), et « une seule section » est
    // faux aussi : le brut sort déjà coupé en Intro + A quand la règle de
    // la voix trouve une intro. Le vrai signe qu'un morceau n'a pas encore
    // de FORME, c'est qu'aucune lettre ne se répète — toutes ses sections
    // sont uniques. Un chart raffiné a des reprises (A…A…B…A).
    // Le bouton est là sur TOUS les charts (Louis : « il devrait aussi être
    // présent pour les chansons déjà annotées »). Il ne dit pas la même
    // chose selon qu'il y a une forme ou non : sur un chart sans reprise
    // c'est « marquer », sur un chart qui en a c'est « modifier ».
    const secs=(m&&m.sections)||[];
    const letters=secs.map(x=>String(x.label||"").toLowerCase())
                      .filter(x=>x&&x!=="intro"&&x!=="outro");
    const repeated=letters.some((x,i)=>letters.indexOf(x)!==i)
                   || secs.some(x=>(x.reps||1)>1);
    if(!m || !m.file) return wrap;
    if(!sectToolOn()){
      // Note COURTE : `kitButton` est en `white-space:nowrap`, une note longue
      // sort de l'écran au lieu de passer à la ligne (constaté à 390 px, le
      // texte était coupé au bord droit).
      wrap.appendChild(kitButton(
        repeated?"Modifier les sections":"Marquer les sections",
        openSectionTool, {note:repeated?"au doigt":"au doigt"}));
      return wrap;
    }
    const st=S.sectTool;
    // COMPACT PAR CONSTRUCTION. La première version empilait titre, dix
    // lettres sur trois rangées, deux lignes d'explication, les boutons, le
    // bandeau et le bouton d'enregistrement : sur un écran de 390 px il ne
    // restait plus qu'UNE mesure visible sous le panneau, donc plus rien à
    // sélectionner sans faire défiler (constaté au balayage). Les lettres
    // tiennent maintenant sur une seule rangée qui défile horizontalement,
    // et le bandeau des sections est replié derrière un résumé.
    // COLLANT en haut de la zone qui défile : les lettres doivent rester à
    // portée de pouce quand on annote la mesure 60. Sans ça, changer de
    // lettre voulait dire remonter tout le morceau, puis redescendre — la
    // moitié de « c'est trop chiant » (Louis, 2026-08-12).
    // Le COLLANT va sur `wrap`, pas sur la carte : un élément collant ne
    // dépasse jamais la boîte de son parent, et `wrap` fait exactement la
    // hauteur de la carte — il se décollait donc immédiatement (constaté :
    // la pastille B partait à -617 px après un défilement).
    wrap.style.cssText += ";position:sticky;top:0;z-index:6;";
    const card=el("div",`border:1px solid ${T.line};background:${T.card};`+
                 `border-radius:${SZ.radiusLg}px;padding:8px 10px 10px;`+
                 `box-shadow:0 2px 10px rgba(0,0,0,.10);`);
    const head=el("div","display:flex;align-items:center;gap:8px;margin-bottom:6px;");
    head.appendChild(el("div",`font:700 13.5px ${UI};color:${T.ink};`,"Sections"));
    head.appendChild(el("div",`flex:1;font:italic 11.5px ${SERIF};color:${T.faint};`,
      st.sel ? `mesures ${st.sel.b0+1}–${st.sel.b1+1}`
             : (st.pendingStart!=null
                ? `début mesure ${st.pendingStart+1} — touche la fin`
                : (st.label ? `touche le début de ${st.label}`
                            : "aucune lettre : le tap déplace la lecture"))));
    const close=el("button",`flex:0 0 auto;border:none;background:transparent;`+
      `color:${T.faint};font:600 12.5px ${UI};cursor:pointer;padding:6px;`,"Fermer");
    close.onclick=closeSectionTool;
    head.appendChild(close);
    card.appendChild(head);
    // les lettres : UNE rangée, qui défile horizontalement
    const chips=el("div","display:flex;gap:5px;overflow-x:auto;margin-bottom:7px;"+
                   "padding-bottom:2px;");
    chips.className="ap-nobar";
    SECT_LABELS.forEach(([lb,col])=>{
      const on=st.label===lb;
      const c=el("button",`flex:0 0 auto;height:38px;padding:0 12px;`+
                `border-radius:${SZ.radius}px;cursor:pointer;font:700 14px ${UI};`+
                (on?`border:1.5px solid ${col};background:${col}22;color:${T.ink};`
                   :`border:1px solid ${T.line};background:${T.card};color:${T.faint};`), lb);
      // Re-toucher la lettre armée la DÉSARME : c'est le geste par lequel on
      // rend le tap à la lecture (Louis, 2026-08-10).
      c.onclick=()=>{ haptic();
        st.label=on?null:lb; st.pendingStart=null;
        if(on){ st.sel=null; st.note="aucune lettre : le tap déplace la lecture"; }
        else st.note="";
        go("chart"); };
      chips.appendChild(c);
    });
    card.appendChild(chips);
    const row=el("div","display:flex;gap:6px;flex-wrap:wrap;align-items:center;");
    if(st.sel && st.label) row.appendChild(kitButton(st.busy?"Recherche…":"Valider "+st.label,
      ()=>{ if(!st.busy) validateSectionSelection(); },
      {state:st.busy?"off":"on", height:40}));
    if(st.sel) row.appendChild(kitButton("Effacer",
      ()=>{ st.sel=null; go("chart"); }, {height:40}));
    // LA SÉVÉRITÉ EST À L'UTILISATEUR. Mesuré sur les 18 annotations : à
    // 0,78 on retrouve 66 reprises sur 100 en en proposant 60 fausses ; à
    // 0,90, 60 sur 100 pour 44 fausses ; à 0,95, 57 pour 37. Aucun seuil ne
    // domine — c'est un échange entre « ça trouve tout » et « j'ai peu à
    // enlever », et c'est un choix, pas un réglage à deviner.
    const sev=el("div","display:flex;gap:5px;align-items:center;margin-left:auto;");
    sev.appendChild(el("span",`font:600 10.5px ${UI};color:${T.faint};`,"tri"));
    [["large",0.78],["moyen",0.88],["strict",0.95]].forEach(([lb,v])=>{
      const on=Math.abs((st.thr||0.78)-v)<0.001;
      const c=el("button",`flex:0 0 auto;height:28px;padding:0 9px;border-radius:8px;`+
        `cursor:pointer;font:600 11.5px ${UI};`+
        (on?`border:1.5px solid ${T.accent};background:rgba(138,43,43,.09);color:${T.ink};`
           :`border:1px solid ${T.line};background:${T.card};color:${T.faint};`), lb);
      c.onclick=()=>{ haptic(); st.thr=v;
        st.note="tri « "+lb+" » — s'applique à la prochaine validation";
        go("chart"); };
      sev.appendChild(c);
    });
    row.appendChild(sev);
    if(st.marks.length && !st.sel){
      row.appendChild(kitButton("Enregistrer comme vérité", confirmSectionTruth,
                                {height:40}));
      row.appendChild(kitButton("Recommencer", resetSectionMarks, {height:40}));
    }
    card.appendChild(row);
    if(st.note) card.appendChild(el("div",
      `font:italic 11.5px ${SERIF};color:${T.faint};margin-top:6px;`, st.note));
    if(st.marks.length){
      // Le morceau par sections, replié derrière son résumé : la liste
      // complète poussait la grille hors de l'écran.
      const runs=[]; let run=null;
      sectionRuns().forEach(r=>{
        if(run && run.label===r.label && r.b0===run.b1+1){ run.b1=r.b1; run.n++; }
        else { run={label:r.label, b0:r.b0, b1:r.b1, n:1}; runs.push(run); }
      });
      const holes=runs.filter(r=>r.label==="?").length;
      const det=el("details","margin-top:7px;");
      const sum=el("summary",`font:600 11.5px ${UI};color:${T.faint};cursor:pointer;`,
        `${runs.filter(r=>r.label!=="?").length} section(s)` +
        (holes?` · ${holes} trou(s) à nommer`:" · tout le morceau est couvert"));
      det.appendChild(sum);
      const strip=el("div","display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;");
      runs.forEach(r=>{
        const col=r.label==="?"?T.line:sectColor(r.label);
        const chip=el("div",
          `display:inline-flex;align-items:center;gap:4px;font:700 11px ${UI};`+
          `color:${r.label==="?"?T.faint:"#fff"};background:${r.label==="?"?T.line:col};`+
          `border-radius:5px;padding:2px 7px;`, r.label+" "+(r.b0+1)+"–"+(r.b1+1));
        if(r.n>1) chip.appendChild(el("span",`font:600 10px ${UI};opacity:.8;`,"×"+r.n));
        strip.appendChild(chip);
      });
      det.appendChild(strip);
      card.appendChild(det);
    }
    wrap.appendChild(card);
    return wrap;
  }

  /* Le morceau écrit par sections, côté client : les mesures que personne
     n'a réclamées restent des trous EXPLICITES (« ? »), jamais rattachées
     d'office à la voisine — c'est la règle du serveur, répétée ici pour que
     l'écran dise la même chose que le fichier. */
  function sectionRuns(){
    const n=Math.max(0,(S.model.barGrid||[]).length-1);   // -1 ferait planter Array(n)
    const owner=new Array(n).fill(null), starts=new Set();
    (S.sectTool?S.sectTool.marks:[]).forEach(m=>m.occurrences.forEach(o=>{
      starts.add(o.b0);
      for(let b=Math.max(0,o.b0);b<=Math.min(n-1,o.b1);b++) owner[b]=m.label;
    }));
    const out=[]; let b=0;
    while(b<n){
      const lab=owner[b]; let e=b;
      while(e+1<n && owner[e+1]===lab && !starts.has(e+1)) e++;
      out.push({label:lab||"?", b0:b, b1:e});
      b=e+1;
    }
    return out;
  }

  /* Deux touches : la première pose le début, la seconde la fin. Entre les
     deux, la mesure de départ est marquée à l'écran — sinon on ne saurait
     pas que le premier tap a été pris en compte. */
  function sectTapMark(b){
    const st=S.sectTool; if(!st) return;
    if(st.pendingStart==null){
      st.pendingStart=b; st.sel=null;
      st.note="début en mesure "+(b+1)+" — touche la dernière mesure de "+st.label;
    } else {
      st.sel={b0:Math.min(st.pendingStart,b), b1:Math.max(st.pendingStart,b)};
      st.pendingStart=null; st.note="";
    }
    haptic(5); go("chart");
  }

  async function validateSectionSelection(){
    const st=S.sectTool, m=S.model;
    if(!st || !st.sel) return;
    st.busy=true; st.note=""; go("chart");
    try{
      const r=await api.post("/api/section-repeats/"+m.file,
        {b0:st.sel.b0, b1:st.sel.b1, claimed:sectClaimed(st.label),
         thr:st.thr||0.78});
      if(r.error){ st.busy=false; st.note=r.error; go("chart"); return; }
      const occ=(r.occurrences||[]).map(o=>({b0:o.b0, b1:o.b1,
                                             source:o.source, rot:o.rot||0}));
      // VALIDER AJOUTE, ça ne remplace pas. Sur une chanson déjà annotée, la
      // lettre porte déjà ses passages ; les écraser par une recherche
      // fraîche jetterait le travail à la main que l'outil est censé
      // MODIFIER. On garde donc l'existant et on n'ajoute que ce qui ne le
      // recouvre pas (le serveur a déjà écarté les mesures des AUTRES
      // lettres, via `claimed`).
      let mk=st.marks.find(x=>x.label===st.label);
      if(!mk){ mk={label:st.label, occurrences:[]}; st.marks.push(mk); }
      const hits=(a,b)=>!(a.b1<b.b0||b.b1<a.b0);
      // Ce que la nouvelle recherche trouve REMPLACE ce qu'il recouvre dans la
      // même lettre. Jeter la nouveauté en cas de chevauchement rendait toute
      // correction de frontière impossible : « A commence en fait mesure 5 »
      // était silencieusement ignoré parce que 5–12 chevauche 1–8.
      occ.forEach(o=>{
        mk.occurrences=mk.occurrences.filter(q=>!hits(q,o));
        mk.occurrences.push(o);
      });
      mk.occurrences.sort((a,b)=>a.b0-b.b0);
      mk.cell=r.cell_bars;
      const found=occ.filter(o=>o.source!=="selection"&&o.source!=="inner").length;
      const modul=occ.filter(o=>o.rot).length;
      st.note=`cellule de ${r.cell_bars} mesures · ${found} reprise(s) trouvée(s)`+
              (modul?` (dont ${modul} transposée(s))`:"")+
              " — touche une reprise pour l'enlever";
      st.sel=null; st.busy=false;
      go("chart");
      saveSectionMarks();
    }catch(e){ st.busy=false; st.note=String(e); go("chart"); }
  }

  /* `target` est l'occurrence elle-même quand on vient du badge, sinon un
     numéro de mesure. Le badge passait `sb[0]` — la PREMIÈRE mesure de
     chanson que porte la cellule ; sur un chart replié une cellule en porte
     plusieurs (mesures 1, 9, 21, 29…), donc le ✕ effaçait l'occurrence du
     premier passage au lieu de celle qu'il affiche, puis ne faisait plus
     rien du tout. */
  function dropSectionOccurrence(target){
    const st=S.sectTool; if(!st) return false;
    for(const mk of st.marks){
      const i=(typeof target==="object")
        ? mk.occurrences.indexOf(target)
        : mk.occurrences.findIndex(o=>target>=o.b0&&target<=o.b1);
      if(i<0) continue;
      // toute occurrence peut partir, y compris celle qu'on vient de tracer
      // et celle qui vient de l'annotation : l'outil sert à MODIFIER, et un
      // passage qu'on ne peut pas retirer est un passage qu'il faut aller
      // corriger ailleurs.
      mk.occurrences.splice(i,1);
      if(!mk.occurrences.length) st.marks=st.marks.filter(x=>x!==mk);
      haptic(5); go("chart"); saveSectionMarks();
      return true;
    }
    return false;
  }

  function resetSectionMarks(){
    const st=S.sectTool; if(!st) return;
    st.marks=[]; st.sel=null; st.note=""; go("chart"); saveSectionMarks();
  }

  /* Le SEUL chemin qui touche `state/sections/<stem>.json`, le fichier des
     annotations faites à la main. Tout le reste (chaque geste) va dans
     `sections_draft/`. Sans cette séparation le premier essai remplaçait
     les 7 sections de Bein Green par 23 cellules de 2 mesures — la vérité
     terrain du projet effacée par un brouillon. Le serveur garde en plus
     un .bak de ce qui était là. */
  async function confirmSectionTruth(){
    const st=S.sectTool, m=S.model; if(!st||!m) return;
    if(st.loadFailed){ st.note="lecture impossible : rien n'est enregistré, "+
        "rouvre l'outil"; go("chart"); return; }
    try{
      const r=await api.post("/api/section-marks/"+m.file,
                             {marks:st.marks, validated:true});
      st.note = r && r.ok ? `enregistré comme vérité : ${r.written} section(s)`
                          : "l'enregistrement a échoué";
    }catch(e){ st.note=String(e); }
    go("chart");
  }

  async function saveSectionMarks(){
    const st=S.sectTool, m=S.model; if(!st||!m) return;
    if(st.loadFailed) return;                 // on n'écrit pas sur un état faux
    try{
      const r=await api.post("/api/section-marks/"+m.file,
                             {marks:st.marks, validated:false});
      if(r && r.error) throw new Error(r.error);
      st.saveError=null;
    }catch(e){
      // Silencieuse, cette erreur laissait croire le travail sauvegardé.
      st.saveError=String(e).slice(0,80);
      st.note="⚠ sauvegarde impossible : "+st.saveError;
      go("chart");
    }
  }

  /* Le doigt le long des mesures. Même idiome que `attachSpanDrag` (capture
     du pointeur, hit-test par [data-bar], haptique à chaque changement) —
     mais un seul intervalle, et un TAP sur une reprise proposée l'enlève au
     lieu d'ouvrir une sélection d'une mesure. */
  /* TROIS GESTES QUI NE SE MARCHENT PAS DESSUS (corrigé 2026-08-10 après
     retour de Louis sur « la tête de lecture »). La première version prenait
     le doigt en entier : `touch-action:none` sur la grille tuait le
     DÉFILEMENT du chart, et tout tap était mangé par l'outil, donc la
     lecture ne se déplaçait plus. Or marquer des sections se fait EN
     ÉCOUTANT — c'est la leçon que sa propre page d'annotation avait déjà
     payée (« il faut que je puisse rapidement balayer dans la chanson… là
     quand je clique ça me modifie les sections »), qui y a séparé la piste
     de lecture de la piste d'édition.

       tap            → la lecture saute là (comportement normal de l'app) ;
       appui long     → arme la sélection, puis on glisse le long des mesures ;
       tap sur le badge de lettre → enlève CETTE occurrence.

     `touch-action:pan-y` laisse le navigateur défiler tant que l'appui long
     n'a pas armé ; un mouvement franc avant l'armement annule (c'est un
     défilement, pas une sélection). */
  const SECT_HOLD_MS=280, SECT_SLOP_PX=12;
  /* Combien de mesures de chanson les cellules AFFICHÉES couvrent-elles
     entre lo et hi ? Sur un chart déplié c'est hi-lo+1 ; sur un chart replié
     c'est moins, et l'écart est exactement ce que le doigt n'a pas vu. */
  function sectSpanBars(lo, hi){
    const seen=new Set();
    (S._cells||[]).forEach(c=>songBarsOfCell(c.bar).forEach(x=>{
      if(x>=lo && x<=hi) seen.add(x);
    }));
    return seen.size;
  }
  function st_note_gap(){
    const st=S.sectTool; if(!st || st._gapNoted) return;
    st._gapNoted=true;
    st.note="ce chart est replié : la sélection s'arrête au passage écrit "+
            "(les reprises non écrites ne sont pas sur l'écran)";
  }
  function attachSectionDrag(grid){
    let anchor=null, anchorCell=null, armed=false, timer=null;
    let x0=0, y0=0, t0=0, maxDist=0, capId=null;
    // Les DEUX indices, jamais confondus : `cell` est la mesure AFFICHÉE (ce
    // que seekToBar et setPlayhead attendent), `song` la mesure de la CHANSON
    // (ce que le serveur attend). En vue dépliée ils coïncident, mais la vue
    // repliée existe encore ailleurs dans l'app.
    const barUnder=(x,y)=>{
      const e=document.elementFromPoint(x,y);
      const c=e&&e.closest?e.closest("[data-bar]"):null;
      if(!c) return null;
      const bi=+c.dataset.bar;
      return {cell:bi, song:songBarOfCell(bi)};
    };
    grid.style.touchAction="pan-y";
    const disarm=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
    grid.addEventListener("pointerdown",e=>{
      if(e.target.closest("[data-sect-badge]")) return;   // le badge gère
      const b=barUnder(e.clientX,e.clientY); if(b==null) return;
      anchor=b.song; anchorCell=b.cell; armed=false; maxDist=0;
      x0=e.clientX; y0=e.clientY; t0=Date.now(); capId=e.pointerId;
      disarm();
      timer=setTimeout(()=>{
        timer=null;
        // La grille peut avoir été reconstruite (validation, raffinement,
        // changement de lettre) ou l'outil fermé pendant l'attente : poser
        // une sélection depuis un élément détaché donnait une sélection
        // fantôme, et sur un outil fermé un TypeError non capturé.
        if(!S.sectTool || !grid.isConnected){ anchor=null; return; }
        armed=true;
        grid.style.touchAction="none";
        S.sectTool.sel={b0:anchor,b1:anchor};
        paintSectionTool(); haptic(8);
        try{ grid.setPointerCapture(capId); }catch(err){}
      }, SECT_HOLD_MS);
    });
    grid.addEventListener("pointermove",e=>{
      if(anchor==null) return;
      maxDist=Math.max(maxDist, Math.abs(e.clientX-x0), Math.abs(e.clientY-y0));
      if(!armed){
        // Un doigt qui bouge un peu N'ANNULE PLUS le geste, il empêche
        // seulement l'appui long de s'armer. La version précédente mettait
        // `anchor=null` ici : un tap au doigt (toujours quelques pixels de
        // tremblement) ne marquait rien ET ne déplaçait pas la lecture —
        // le geste se perdait en silence. C'est au RELÂCHEMENT qu'on tranche.
        if(maxDist>SECT_SLOP_PX) disarm();
        return;
      }
      const b=barUnder(e.clientX,e.clientY); if(b==null) return;
      // Deux cellules VOISINES à l'écran ne sont pas voisines dans la
      // chanson quand le chart est replié : on refuse d'étendre au-delà
      // d'une coupure (en vue dépliée, jamais déclenché).
      const lo=Math.min(anchor,b.song), hi=Math.max(anchor,b.song);
      if(hi-lo+1 > sectSpanBars(lo,hi)){ st_note_gap(); return; }
      const cur=S.sectTool.sel;
      if(!cur||lo!==cur.b0||hi!==cur.b1){
        S.sectTool.sel={b0:lo, b1:hi}; paintSectionTool(); haptic(3);
      }
    });
    const end=()=>{
      disarm();
      if(anchor==null) return;
      const cell=anchorCell, song=anchor, wasArmed=armed;
      const dist=maxDist, held=Date.now()-t0;
      anchor=null; anchorCell=null; armed=false;
      grid.style.touchAction="pan-y";
      if(wasArmed){ go("chart"); return; }
      // Ni armé ni traîné : c'est un TAP. Un vrai défilement (doigt parti
      // loin, ou maintenu longtemps) ne déclenche rien.
      if(dist>SECT_SLOP_PX || held>700) return;
      // Louis, 2026-08-10 : « en mode annotation, le clic/toucher sert à
      // marquer le début d'une section ; quand je désélectionne […] là je
      // peux déplacer le playhead. » La LETTRE ARMÉE décide.
      const st=S.sectTool;
      if(st && st.label && song!=null){ sectTapMark(song); return; }
      // Lettre désarmée : le tap déplace le curseur — sans condition, et
      // sans regarder le réglage global « Tap sur une mesure » : ici c'est
      // la seule chose qu'un tap puisse vouloir dire (Louis, 2026-08-10 :
      // « quand les lettres sont désarmées, je veux que le tap déplace le
      // curseur »).
      if(cell!=null) seekToBar(cell);
    };
    grid.addEventListener("pointerup",end);
    grid.addEventListener("pointercancel",()=>{ disarm(); anchor=null;
      armed=false; grid.style.touchAction="pan-y"; });
  }

  /* Teinte : chaque mesure prend la couleur de sa lettre. Une reprise que
     l'outil a proposée est en POINTILLÉS tant qu'elle n'a pas été gardée —
     l'écran distingue toujours ce que l'utilisateur a dit de ce que la
     machine a deviné. La sélection en cours passe par-dessus tout. */
  function paintSectionTool(){
    if(!S._cells || !sectToolOn()) return;
    const st=S.sectTool;
    S._cells.forEach(c=>{
      let tint=null, edge=null, dashed=false, tag=null, tagOcc=null;
      const sb=songBarsOfCell(c.bar);
      const inRange=(o)=>sb.some(x=>x>=o.b0&&x<=o.b1);
      st.marks.forEach(mk=>mk.occurrences.forEach(o=>{
        if(inRange(o)){
          edge=sectColor(mk.label); tint=edge+"1f";
          dashed=(o.source!=="selection");
          if(sb.indexOf(o.b0)>=0){ tag=mk.label+(o.rot?" ↗":""); tagOcc=o; }
        }
      }));
      if(st.pendingStart!=null && sb.indexOf(st.pendingStart)>=0){
        edge=sectColor(st.label||"A"); tint=edge+"22"; dashed=true;
        tag=(st.label||"")+" ▸";  tagOcc=null;
      }
      if(st.sel && inRange(st.sel)){
        edge=sectColor(st.label); tint=edge+"33"; dashed=false;
        tag=(sb.indexOf(st.sel.b0)>=0)?st.label:null;
      }
      clear(c.sel);
      c.sel.style.display = tint?"block":"none";
      if(!tint) return;
      c.sel.style.background=tint;
      c.sel.style.boxShadow="none";
      c.sel.style.border=`${dashed?"1.5px dashed":"2px solid"} ${edge}`;
      c.sel.style.borderRadius="4px";
      if(tag && !tagOcc){
        c.sel.appendChild(el("span",
          `position:absolute;top:2px;right:3px;font:800 9px ${UI};color:#fff;`+
          `background:${edge};border-radius:3px;padding:1px 4px;`, tag));
      } else if(tag && tagOcc){
        // Le badge est le SEUL endroit qui enlève une occurrence : le tap sur
        // la mesure est rendu à la lecture. Il est cliquable, donc la couche
        // de teinte (pointer-events:none par construction) doit le laisser
        // passer — d'où le pointer-events:auto explicite.
        const bdg=el("span",
          `position:absolute;top:2px;right:3px;font:800 9px ${UI};color:#fff;`+
          `background:${edge};border-radius:3px;padding:3px 6px;cursor:pointer;`+
          `pointer-events:auto;`, tag+" ✕");
        bdg.setAttribute("data-sect-badge","1");
        const own=tagOcc;
        bdg.onclick=ev=>{ ev.stopPropagation(); dropSectionOccurrence(own); };
        bdg.addEventListener("pointerdown",ev=>ev.stopPropagation());
        c.sel.appendChild(bdg);
      }
    });
  }

  function spanBars(sp){ return sp.b1-sp.b0+1; }
  function spanTime(sp){ return [S.bars[sp.b0].t0, S.bars[sp.b1].t1]; }
  function paintSpans(){
    if(!S._cells) return;
    S._cells.forEach(c=>{
      let tint=null, edge=null, tag=null;
      S.spans.forEach((sp,k)=>{ if(c.bar>=sp.b0 && c.bar<=sp.b1){ tint=SPAN_TINT[k]; edge=SPAN_EDGE[k]; tag=(k?"B":"A"); } });
      if(S._drag && c.bar>=S._drag.b0 && c.bar<=S._drag.b1){ tint="rgba(138,43,43,.14)"; edge=T.accent; tag=null; }
      clear(c.sel);
      c.sel.style.display = tint?"block":"none";
      if(!tint) return;
      c.sel.style.background=tint;
      c.sel.style.boxShadow=`inset 0 0 0 1.5px ${edge}`;
      if(tag && c.bar===S.spans[tag==="A"?0:1].b0){
        c.sel.appendChild(el("span",`position:absolute;top:2px;right:3px;font:800 9px ${UI};color:#fff;background:${edge};border-radius:3px;padding:1px 4px;`,tag));
      }
    });
  }
  // setPlayhead now takes a BAR index (S.bars / S._cells are index-aligned) so
  // held/% bars, N.C. bars and the intro row highlight as the audio passes
  // through them. Two passes (clear-all then set-one) because the intro row's
  // bars share one DOM element — a single-pass on/off would let a later
  // non-current intro bar clear the row the current one just lit.
  // `t` (seconds, optional) is the caller's own clock — the form strip is keyed
  // on time, not on this bar index (see paintFormChip). Callers that came from
  // hitAtTime already hold it; anyone else gets it reconstructed from the bar's
  // span for this pass, and it is remembered so a re-render repaints the same
  // chip.
  function setPlayhead(bi, rep, t){
    S.playBar=bi; S.playRep=rep;
    if(t==null){ const b=(S.bars||[])[bi], sp=b&&b.tspans&&(b.tspans[rep||0]||b.tspans[0]); t=sp?sp[0]:null; }
    S.playTime = bi>=0 ? t : null;
    if(S._cells){
      S._cells.forEach(c=>{ c.el.style.background=""; c.ph.style.display="none"; });
      if(bi>=0) S._cells.forEach(c=>{ if(c.bar===bi){ c.el.style.background="rgba(138,43,43,.09)"; c.ph.style.display="block"; } });
    }
    if(S._dockWhere) S._dockWhere.textContent = bi>=0 ? ("bar "+(bi+1)+((rep!=null&&rep>0)?" · ×"+(rep+1):"")) : "";
    paintFormRail(S.playTime);
    // The coach follows ANY playhead move, not just playback — scrubbing or
    // tapping a form chip while paused should show that spot's voicing.
    if(S.coach && S.playTime!=null){
      const cc=hitChordAtTime(S.playTime);
      if(cc && cc.idx!==S._lastCoachIdx){ S._lastCoachIdx=cc.idx; paintCoachChord(cc.idx); }
    }
    if(bi>=0 && S.follow && S._cells){
      const cell=S._cells.find(c=>c.bar===bi);
      if(cell) cell.el.scrollIntoView({block:"center",behavior:"smooth"});
    }
  }

  // (barsOf/sectionSpan died with the ribbon's section chips — pooling is
  // always the swipe now, and the equal-length rule is enforced by openMerge.)
  // UI refresh 2026-08-08 (§2): the ribbon's own FORM chips are gone — they
  // rendered the form twice (buildFormRail above the grid already carries
  // it; verified live before the refresh). The "tap a section chip to pool
  // it" shortcut went with them: pooling is now always the swipe (or a
  // suggestion). Tools are kitButtons — words, no symbol prefixes; Set bar 1
  // and Check merges moved here from the deleted mode bar.
  // Louis, 2026-08-08 (second pass): the tool row is down to what THIS server
  // actually serves. Removed as STALE, verified against server.py's routes:
  //   * "Pool two passes" — POST /api/reinfer is aliased onto the lock
  //     rescorer, which answers a merge with a correct NO-OP ("a merge has no
  //     lock-lattice equivalent yet") — a button that does nothing;
  //   * "Bar suggestions" / "Section suggestions" — neither candidates
  //     endpoint exists here; both always answered "no suggestions yet".
  // Their overlay machinery (mergeMode/suggMode/sectSuggMode below) stays
  // dormant for the day the endpoints land. "Set bar 1" is the in-app offset
  // tool now (openBar1Sheet), not a link to a page this server never had.
  function buildRibbon(){
    const wrap=el("div","margin:4px 3px 16px;");
    wrap.appendChild(kitLegend("linear-gradient(90deg,#a8281f,#bd6a22,#9a6a1e,"+T.ink+")",
      "shaky chords tint red — tap one you know to lock it in"));
    const m=S.model;
    if(m && m.file){
      const tools=el("div","display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-top:10px;");
      const box=(caption,btn)=>{
        const g=el("div","display:flex;flex-direction:column;gap:5px;");
        g.appendChild(el("div",`font:600 9.5px ${UI};letter-spacing:.07em;text-transform:uppercase;color:${T.faint};`,caption));
        g.appendChild(btn); return g;
      };
      tools.appendChild(box("the grid",
        kitButton("Set bar 1", openBar1Sheet, {note:"the song's true start"})));
      tools.appendChild(box("les sections",
        kitButton(sectToolOn()?"Fermer l'outil":"Marquer les sections",
          ()=>{ sectToolOn()?closeSectionTool():openSectionTool(); },
          {note:"au doigt", state:sectToolOn()?"on":undefined})));
      tools.appendChild(box("the sections",
        kitButton("Check merges",
          ()=>{ window.open("/debug/section-merge-game?song="+encodeURIComponent(m.file), "_blank"); },
          {note:"by ear"})));
      wrap.appendChild(tools);
    }
    return wrap;
  }

  // ── Set bar 1, in-app (Louis, 2026-08-08) ────────────────────────────────
  // A practise-style reel synced to the music: drag the tape (or let it play)
  // until a real downbeat sits under the marker, then lock it in. The server
  // re-lays the grid with that beat as the bar phase — nothing before the
  // mark is cut, it becomes the leading bars (which the intro rule then
  // hides) — and the rebuild comes back through the two-phase loading screen.
  function openBar1Sheet(){
    const m=S.model; if(!m||!m.file||!S.audio) return;
    const chords=prompterData().slice().sort((a,b)=>a.t0-b.t0);
    const grid=(m.barGrid||[]).slice();
    const beats=(m.beatTimes||[]).slice();
    if(grid.length<2) { toast("No beat grid on this chart"); return; }
    let live=true, raf=null, pxs=0, W=0;
    const back=overlay(); const sheet=sheetCol(); sheet.appendChild(handle());
    const close=()=>{ live=false; if(raf) cancelAnimationFrame(raf); closeOverlay(back); };
    back.onclick=e=>{ if(e.target===back) close(); };
    sheet.appendChild(el("div",`text-align:center;font:700 15px ${UI};color:${T.ink};margin-bottom:2px;`,"Set bar 1"));
    sheet.appendChild(el("div",`text-align:center;font:italic 12.5px ${SERIF};color:${T.faint};line-height:1.5;margin-bottom:12px;`,
      "drag the tape — when a real downbeat sits on the marker, lock it in"));

    const reel=el("div",`position:relative;height:110px;background:${T.paper};border:1px solid ${T.line};border-radius:14px;overflow:hidden;touch-action:pan-y;cursor:grab;flex:0 0 auto;`);
    const strip=el("div","position:absolute;top:0;bottom:0;left:0;width:0;will-change:transform;");
    reel.appendChild(strip);
    reel.appendChild(el("div",`position:absolute;top:0;bottom:0;left:50%;width:2px;background:${T.accent};z-index:5;box-shadow:0 0 8px ${T.accent}55;`));
