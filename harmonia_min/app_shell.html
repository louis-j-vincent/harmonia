    reel.appendChild(el("div",`position:absolute;top:3px;left:50%;transform:translateX(-50%);color:${T.accent};font:700 9px ${UI};letter-spacing:.06em;z-index:5;background:${T.paper};padding:0 4px;border-radius:4px;`,"BAR 1"));
    sheet.appendChild(reel);
    const info=el("div",`text-align:center;font:600 12px ${UI};color:${T.faint};margin-top:9px;min-height:15px;flex:0 0 auto;`,"");
    sheet.appendChild(info);

    const ctr=el("div","display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;flex:0 0 auto;");
    const play=el("button",`width:${SZ.primary}px;height:${SZ.primary}px;border-radius:50%;border:none;background:${T.accent};color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;`);
    playGlyph(play,S.playing,16);
    play.setAttribute("aria-label","Play / pause");
    play.onclick=()=>{ if(S._loopEngine) loopEngineDispose(false); togglePlay(); playGlyph(play,S.playing,16); };
    ctr.appendChild(play);
    sheet.appendChild(ctr);

    const apply=kitButton("Bar 1 starts here", async()=>{
      const t=nowTime()+PLAYHEAD_LEAD_S;
      stopPlayback();
      close();
      S.job={title:m.title, stage:0, phase:"listening", error:null, file:null};
      go("analysing");
      try{
        const r=await api.post("/api/bar1/"+m.file, {t});
        if(r.error){ S.job.error=r.error; paintLoading(); return; }
        pollJob(r.job_id);
      }catch(e){ S.job.error=String(e); paintLoading(); }
    }, {height:SZ.primary, state:"on"});
    apply.style.cssText+="width:100%;margin-top:14px;flex:0 0 auto;";
    sheet.appendChild(apply);
    const cancel=el("button",`flex:0 0 auto;width:100%;margin-top:6px;background:transparent;border:none;color:${T.faint};font:600 13px ${UI};padding:8px;min-height:${SZ.control}px;cursor:pointer;`,"Cancel");
    cancel.onclick=close;
    sheet.appendChild(cancel);
    back.appendChild(sheet); root.appendChild(back);

    // window scale: ~3 bars across the reel
    const dbar=[]; for(let i=1;i<grid.length;i++) dbar.push(grid[i]-grid[i-1]);
    dbar.sort((a,b)=>a-b);
    const medBar=dbar.length?dbar[dbar.length>>1]:2.4;
    function layout(){
      W=reel.clientWidth; if(!W) return;
      pxs=W/(3*medBar);
      clear(strip);
      beats.forEach(t=>strip.appendChild(el("div",
        `position:absolute;top:64%;bottom:0;left:${(t*pxs).toFixed(1)}px;width:1px;background:${T.line};`)));
      grid.forEach(t=>strip.appendChild(el("div",
        `position:absolute;top:0;bottom:0;left:${(t*pxs).toFixed(1)}px;width:2px;background:${T.rule};`)));
      chords.forEach(c=>{
        if(c.nc) return;
        const x0=c.t0*pxs, wpx=Math.max(3,(c.t1-c.t0)*pxs-2);
        const b=el("div",`position:absolute;top:8px;height:52px;left:${x0.toFixed(1)}px;width:${wpx.toFixed(1)}px;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:${reelFill(c.root)};opacity:.8;`);
        b.appendChild(glyph(c.root,c.q,15,"exact",T.ink,c.bass));
        strip.appendChild(b);
      });
    }
    let lastTx="";
    function frame(){
      if(!live) return;
      if(!pxs) layout();
      const t=nowTime()+PLAYHEAD_LEAD_S;
      const tx=`translateX(${(W/2 - t*pxs).toFixed(1)}px)`;
      if(tx!==lastTx){ strip.style.transform=tx; lastTx=tx; }
      if(beats.length){
        let lo=0,hi=beats.length-1,k=0,bd=1e9;
        while(lo<=hi){ const mid=(lo+hi)>>1; if(beats[mid]<=t){ k=mid; lo=mid+1; } else hi=mid-1; }
        if(k+1<beats.length && Math.abs(beats[k+1]-t)<Math.abs(beats[k]-t)) k=k+1;
        bd=Math.abs(beats[k]-t);
        info.textContent=fmt(t)+" — snaps to the beat "+Math.round(bd*1000)+" ms away";
      }
      playGlyph(play,S.playing,16);
      raf=requestAnimationFrame(frame);
    }
    // drag = scrub, same gesture as the prompter's tape
    let dragX=null, dragT0=0, lastSeekTs=0;
    reel.addEventListener("pointerdown",e=>{ dragX=e.clientX; dragT0=nowTime();
      try{ reel.setPointerCapture(e.pointerId); }catch(err){} });
    reel.addEventListener("pointermove",e=>{
      if(dragX==null||!pxs) return;
      const now=performance.now();
      if(now-lastSeekTs>60){ lastSeekTs=now;
        const d=totalDur(); if(d>0) seekFrac(Math.max(0,Math.min(1,(dragT0-(e.clientX-dragX)/pxs)/d))); }
    });
    const endDrag=()=>{ dragX=null; };
    reel.addEventListener("pointerup",endDrag);
    reel.addEventListener("pointercancel",endDrag);
    try{ new ResizeObserver(layout).observe(reel); }catch(e){ setTimeout(layout,0); }
    raf=requestAnimationFrame(frame);
  }

  // ═══════════════════════════════════════════════════════════════════════
  //  BAR-MERGE SUGGESTIONS (2026-07-18) — ported from the baked
  //  chart_interactive.py `_TEMPLATE`'s #suggest-mode-btn overlay (see
  //  docs/known_issues.md "REFRAME: on-chart bar-merge SUGGESTIONS overlay")
  //  into this SPA's own JS-driven renderer, ADDITIVE to the existing
  //  "⋈ Pool two passes" swipe-select tool above (S.mergeMode/S.spans —
  //  untouched, still free manual span selection). Suggestions are the
  //  algorithmic ones from scratchpad/bar_merge_candidates.py, surfaced as
  //  coloured family outlines directly on the chart grid; tapping one opens a bottom
  //  sheet (this app's own overlay()/sheetBox() pattern, not the baked
  //  template's custom popover — kept visually consistent with every other
  //  modal in this SPA) with Confirm/Dismiss. Confirm reuses the SAME
  //  /api/reinfer/<file> preview-only re-decode path as "⋈ Pool two passes"
  //  (via runFlow — see the `ok` return value added there for this purpose),
  //  so results surface exactly like a manual pool: toast + before/after
  //  diff banner, nothing persisted to the served chart (matches the baked
  //  overlay's and "Re-infer with my fixes"'s documented behaviour).
  //  Mutually exclusive with mergeMode (both alter the grid overlay and use
  //  bottom sheets) — toggling one off the other, per the tog.onclick above
  //  and toggleSuggestions() below.
  // ═══════════════════════════════════════════════════════════════════════
  // UI refresh 2026-08-08: kitButton, word label (the gold pill + bulb emoji
  // are out of the design system). The on-chart family outlines below keep
  // their own colours — that is data, not chrome.
  function suggestToggleBtn(){
    return kitButton("Bar suggestions", toggleSuggestions, {state:S.suggMode?"on":"off"});
  }
  function suggKeyOf(c){ return c.bars[0]+"-"+c.bars[1]; }
  async function toggleSuggestions(){
    S.suggMode=!S.suggMode;
    if(S.suggMode){ S.mergeMode=false; S.spans=[]; S._drag=null; S.sectSuggMode=false; }
    go("chart");
    if(!S.suggMode || !S.model || !S.model.file) return;
    if(S.suggCandidates===null){
      try{
        const data=await api.get("/api/bar-merge-candidates/"+S.model.file);
        S.suggCandidates=(data && data.candidates) || [];
      }catch(e){ S.suggCandidates=[]; }
      // Only repaint if the user is still in suggest mode on the same song —
      // a slow fetch shouldn't clobber a screen the user has since left.
      if(S.suggMode && S.screen==="chart") go("chart");
    }
  }
  // 2026-07-18, later same day — REDESIGNED per user feedback: no gold
  // circular badge/emoji. A tapped bar's whole "family" (its connected
  // component in the candidate-pair graph — a pairs with b, b pairs with c
  // => a/b/c are one family) should be identifiable and highlightable
  // together by COLOR, directly on the chord cells, not via a small
  // separate icon. suggFamilies() computes bar -> family-index from the
  // (non-dismissed) candidate pairs via union-find; every bar in a family
  // gets an outline in that family's color (always visible, so families are
  // identifiable at a glance without tapping); tapping ANY cell in a family
  // fills that whole family with a stronger tint (S.suggHighlightFamily)
  // and opens the confirm sheet for the specific pair that bar belongs to
  // (its first non-dismissed candidate).
  const SUGG_FAMILY_COLORS=["#2a78d6","#008300","#e34948","#4a3aa7","#eb6834","#1baf7a","#e87ba4","#c98500"];
  function suggFamilies(){
    const parent={};
    function find(x){ if(!(x in parent)) parent[x]=x; while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }
    function union(a,b){ const ra=find(a), rb=find(b); if(ra!==rb) parent[Math.max(ra,rb)]=Math.min(ra,rb); }
    (S.suggCandidates||[]).forEach(c=>{ if(!S.suggDismissed.has(suggKeyOf(c))) union(c.bars[0], c.bars[1]); });
    const famIdx={}, order=[];
    Object.keys(parent).forEach(k=>{ const r=find(+k); if(!(r in famIdx)){ famIdx[r]=order.length; order.push(r); } });
    const byBar={}, membersByFam=[];
    Object.keys(parent).forEach(k=>{
      const bar=+k, f=famIdx[find(bar)];
      byBar[bar]=f;
      (membersByFam[f]=membersByFam[f]||[]).push(bar);
    });
    return {byBar, membersByFam};
  }
  function firstCandForBar(bar){
    return (S.suggCandidates||[]).find(c=>!S.suggDismissed.has(suggKeyOf(c)) && c.bars.includes(bar));
  }
  // Renders directly onto S._cells (built fresh by buildIReal() on every
  // render — this runs at the end of that function, mirroring paintSpans()).
  function paintSuggestions(){
    if(!S._cells || !S.suggCandidates || !S.suggCandidates.length) return;
    const byBar={}; S._cells.forEach(c=>{ byBar[c.bar]=c; });
    const {byBar:famOfBar, membersByFam}=suggFamilies();
    Object.keys(famOfBar).forEach(k=>{
      const bar=+k, cell=byBar[bar]; if(!cell) return;
      const cand=firstCandForBar(bar);
      const confirmed=!!cand && S.suggConfirmed.has(suggKeyOf(cand));
      const color=confirmed?"#1d8a1d":SUGG_FAMILY_COLORS[famOfBar[bar]%SUGG_FAMILY_COLORS.length];
      const highlighted=S.suggHighlightFamily===famOfBar[bar];
      cell.el.style.outline=`2px solid ${color}`;
      cell.el.style.outlineOffset="-1px";
      cell.el.style.borderRadius="6px";
      cell.el.style.background=highlighted?color+"26":confirmed?color+"14":"";
      cell.el.style.transition="background .15s ease";
      if(!confirmed && cand){
        cell.el.style.cursor="pointer";
        cell.el.onclick=(e)=>{
          e.stopPropagation(); e.preventDefault();
          S.suggHighlightFamily=famOfBar[bar];
          go("chart");
          openSuggestionSheet(cand);
        };
      }
      cell.el.title=confirmed?"Merged":
        "Family of "+( (membersByFam[famOfBar[bar]]||[]).length )+
        " similar bar(s) — tap to review";
    });
  }
  function openSuggestionSheet(cand){
    const back=overlay(); const sheet=sheetBox(); sheet.appendChild(handle());
    sheet.appendChild(el("div",`text-align:center;font:700 15px ${UI};color:${T.ink};margin-bottom:4px;`,
      "Bar "+(cand.bars[0]+1)+" ↔ Bar "+(cand.bars[1]+1)));
    sheet.appendChild(el("div",`text-align:center;font:italic 12.5px ${SERIF};color:${T.faint};line-height:1.5;margin-bottom:16px;`,
      Math.round(cand.confidence*100)+"% chroma similarity — the algorithm thinks these bars are the same chord. Pool them for a sharper reading?"));
    // Close the sheet FIRST, then kick off the async flow — mirrors
    // openMerge()'s go2.onclick pattern below. runFlow() shows its own
    // spinner overlay with a progress clock, and (being appended straight to
    // `root`) go("chart") inside applyResp() would otherwise yank this sheet
    // out from under an in-progress close animation, since go() clears every
    // root child except the persistent transport bar.
    const yes=el("button",`width:100%;border:none;background:${T.accent};color:#fff;border-radius:12px;padding:14px;font:600 14px ${UI};cursor:pointer;`,"Merge & re-infer");
    yes.onclick=()=>{ closeOverlay(back); confirmSuggestion(cand); };
    sheet.appendChild(yes);
    const no=el("button",`width:100%;margin-top:10px;border:none;background:transparent;color:${T.accent};font:600 13px ${UI};padding:12px;min-height:44px;cursor:pointer;`,"Different — dismiss");
    no.onclick=()=>{ S.suggDismissed.add(suggKeyOf(cand)); closeOverlay(back); go("chart"); };
    sheet.appendChild(no);
    const cancel=el("button",`width:100%;margin-top:4px;background:transparent;border:none;color:${T.faint};font:600 13px ${UI};padding:8px;min-height:44px;cursor:pointer;`,"Cancel");
    cancel.onclick=()=>closeOverlay(back);
    sheet.appendChild(cancel);
    back.appendChild(sheet); root.appendChild(back);
  }
  // Reuses runFlow (the SAME preview-only /api/reinfer round-trip "⋈ Pool
  // two passes" already uses) rather than a parallel fetch — one code path
  // for "pool these two spans and show me the diff", whether the spans came
  // from a manual swipe or an algorithmic suggestion. runFlow already
  // handles the spinner, the ~20s-decode clock, error/rejection toasts, and
  // (via applyResp) the before/after propagation banner + go("chart").
  async function confirmSuggestion(cand){
    const ok=await runFlow({confirms:[], merges:[{spans:cand.spans}]},
      "Pooling suggested bars…",
      "bar "+(cand.bars[0]+1)+" ↔ bar "+(cand.bars[1]+1)+" — about 20 seconds", true);
    if(ok){ S.suggConfirmed.add(suggKeyOf(cand)); go("chart"); }
    return ok;
  }

  // ═══════════════════════════════════════════════════════════════════════
  //  SECTION-LEVEL (8-bar) SUGGESTIONS (2026-07-18, later same day) —
  //  section-scale analog of the BAR-MERGE SUGGESTIONS block just above,
  //  consuming scratchpad/section_merge_candidates_<slug>_grain8.json via
  //  /api/section-merge-candidates/<file> (see docs/known_issues.md
  //  "SECTION-level (8-bar) repeat-detection suggestion tool"). Deliberately
  //  a SEPARATE mode/data path, not a parametrised reuse of the bar tool
  //  above, for two reasons that matter to the user reading this code:
  //   1. Data shape differs: candidates carry 8-bar RANGES per side
  //      (`bars:[[b0,b1),[b0,b1)]`), not single bar indices, so the whole
  //      family/union-find highlighting scheme above doesn't apply as-is.
  //   2. Confidence differs A LOT and must not read as equally trustworthy:
  //      corpus-validated precision here is ~45-55% at usable recall
  //      (ROC-AUC 0.674 best case) vs the bar tool's ~84-92% (AUC 0.99) —
  //      see known_issues.md for the full numbers. Every UI surface below
  //      (toggle button, status line, sheet copy) says so explicitly rather
  //      than just inheriting the bar tool's "algorithm thinks" framing.
  //
  //  Rendering choice (an 8-bar span is 2 full rows of the 4-col grid, so
  //  tinting all 16 bars of every one of up to 60 candidates at once would
  //  be unreadable): each candidate gets ONE color (cycled from
  //  SECTION_SUGG_COLORS, not the bar tool's family palette, so the two
  //  tools never look confusable on screen); only the top SECT_SUGG_MAX_SHOWN
  //  (rank-ordered, i.e. highest real-audio confidence first — the file is
  //  pre-sorted) are painted, each as a FAINT outlined tint over its
  //  own two 8-bar spans (so the matched extent is visible at a glance) plus
  //  a small tappable "review" corner badge on just the FIRST bar of each side
  //  (a full badge-per-bar would be as cluttered as a full tint). If two
  //  different candidates happen to start on the same bar, the higher-
  //  ranked one wins the badge/tint for that cell (first-write-wins below);
  //  the lower one is still reachable by scrolling the ranked list, not
  //  lost — just not simultaneously paintable on that cell.
  // ═══════════════════════════════════════════════════════════════════════
  const SECTION_SUGG_COLORS=["#0e7c86","#7c3aed","#c2410c","#0f766e","#a21caf","#65a30d","#be123c","#0369a1"];
  const SECT_SUGG_MAX_SHOWN=15;
  // Same kitButton treatment; the much-weaker precision of this tool is said
  // in words (status line + sheet copy) rather than by a violet pill.
  function sectionSuggestToggleBtn(){
    return kitButton("Section suggestions", toggleSectionSuggestions, {state:S.sectSuggMode?"on":"off"});
  }
  function sectKeyOf(c){ return c.blocks[0]+"-"+c.blocks[1]; }
  async function toggleSectionSuggestions(){
    S.sectSuggMode=!S.sectSuggMode;
    if(S.sectSuggMode){ S.mergeMode=false; S.suggMode=false; S.spans=[]; S._drag=null; }
    go("chart");
    if(!S.sectSuggMode || !S.model || !S.model.file) return;
    if(S.sectSuggCandidates===null){
      try{
        const data=await api.get("/api/section-merge-candidates/"+S.model.file);
        S.sectSuggCandidates=(data && data.candidates) || [];
        S.sectSuggMeta=(data && data.meta) || {};
      }catch(e){ S.sectSuggCandidates=[]; S.sectSuggMeta={}; }
      // Same slow-fetch guard as toggleSuggestions() above — don't clobber a
      // screen the user has since navigated away from.
      if(S.sectSuggMode && S.screen==="chart") go("chart");
    }
  }
  // Renders onto S._cells, same convention as paintSuggestions() — runs at
  // the end of buildIReal(), after paintSpans()/paintSuggestions().
  function paintSectionSuggestions(){
    if(!S._cells || !S.sectSuggCandidates || !S.sectSuggCandidates.length) return;
    const byBar={}; S._cells.forEach(c=>{ byBar[c.bar]=c; });
    const cands=S.sectSuggCandidates.filter(c=>!S.sectSuggDismissed.has(sectKeyOf(c))).slice(0,SECT_SUGG_MAX_SHOWN);
    const startBarOwner={};
    cands.forEach((c,ci)=>{
      const key=sectKeyOf(c);
      const confirmed=S.sectSuggConfirmed.has(key);
      const color=confirmed?"#1d8a1d":SECTION_SUGG_COLORS[ci%SECTION_SUGG_COLORS.length];
      c.bars.forEach(span=>{
        for(let b=span[0]; b<span[1]; b++){
          const cell=byBar[b]; if(!cell || cell.el.dataset.sectTinted) continue;
          cell.el.style.background=color+"12";
          // solid hairline, not dashed — dashed reads as "unfinished" (STYLE)
          cell.el.style.outline=`1px solid ${color}`;
          cell.el.style.outlineOffset="-1px";
          cell.el.dataset.sectTinted="1";
        }
        const startBar=span[0];
        if(!(startBar in startBarOwner)) startBarOwner[startBar]={cand:c, color, confirmed};
      });
    });
    Object.keys(startBarOwner).forEach(k=>{
      const bar=+k, info=startBarOwner[k], cell=byBar[bar]; if(!cell) return;
      const badge=el("div",`position:absolute;right:2px;top:3px;font:700 10px ${UI};background:${info.color};color:#fff;border-radius:5px;padding:1px 4px;z-index:3;line-height:1.3;cursor:${info.confirmed?"default":"pointer"};`,
        info.confirmed?"merged":"review");
      cell.el.appendChild(badge);
      cell.el.title=info.confirmed?"Section merge confirmed":
        "Suggested 8-bar section repeat (~45-55% precision) — tap to review";
      if(!info.confirmed){
        badge.onclick=(e)=>{ e.stopPropagation(); e.preventDefault(); openSectionSuggestionSheet(info.cand); };
      }
    });
  }
  function openSectionSuggestionSheet(cand){
    const back=overlay(); const sheet=sheetBox(); sheet.appendChild(handle());
    const b0=cand.bars[0], b1=cand.bars[1];
    sheet.appendChild(el("div",`text-align:center;font:700 15px ${UI};color:${T.ink};margin-bottom:4px;`,
      "Bars "+(b0[0]+1)+"–"+b0[1]+" ↔ Bars "+(b1[0]+1)+"–"+b1[1]));
    // Deliberately softer framing than the bar tool's "the algorithm thinks
    // these bars are the same chord" — that phrasing would overstate this
    // tool's corpus-validated precision (~45-55% vs the bar tool's ~85-92%).
    sheet.appendChild(el("div",`text-align:center;font:italic 12.5px ${SERIF};color:${T.faint};line-height:1.5;margin-bottom:10px;`,
      Math.round(cand.confidence*100)+"% audio similarity over this 8-bar span. This is a much weaker "
      +"signal than the bar-level tool — worth a listen, not a strong bet. Are these really the same section?"));
    sheet.appendChild(el("div",`text-align:center;font:600 10.5px ${UI};color:${T.faint};margin-bottom:16px;`,
      "rank order, not a probability — use your ear before confirming"));
    const yes=el("button",`width:100%;border:none;background:${T.accent};color:#fff;border-radius:12px;padding:14px;font:600 14px ${UI};cursor:pointer;`,"Sounds the same — pool & re-infer");
    yes.onclick=()=>{ closeOverlay(back); confirmSectionSuggestion(cand); };
    sheet.appendChild(yes);
    const no=el("button",`width:100%;margin-top:10px;border:none;background:transparent;color:${T.accent};font:600 13px ${UI};padding:12px;min-height:44px;cursor:pointer;`,"Different — dismiss");
    no.onclick=()=>{ S.sectSuggDismissed.add(sectKeyOf(cand)); closeOverlay(back); go("chart"); };
    sheet.appendChild(no);
    const cancel=el("button",`width:100%;margin-top:4px;background:transparent;border:none;color:${T.faint};font:600 13px ${UI};padding:8px;min-height:44px;cursor:pointer;`,"Cancel");
    cancel.onclick=()=>closeOverlay(back);
    sheet.appendChild(cancel);
    back.appendChild(sheet); root.appendChild(back);
  }
  async function confirmSectionSuggestion(cand){
    const b0=cand.bars[0], b1=cand.bars[1];
    const ok=await runFlow({confirms:[], merges:[{spans:cand.spans}]},
      "Pooling suggested section…",
      "bars "+(b0[0]+1)+"–"+b0[1]+" ↔ bars "+(b1[0]+1)+"–"+b1[1]+" — about 20 seconds", true);
    if(ok){ S.sectSuggConfirmed.add(sectKeyOf(cand)); go("chart"); }
    return ok;
  }

  // ── persistent transport — LOCAL audio, survives screen re-renders ───────
  // ── PROMPTER (2026-08-05, Louis): the /compare karaoke reel (commit
  // b7fb411), moved into the app and re-skinned with the app's theme+glyphs.
  // Big current chord in the middle; at the bottom a roll of the NEXT TWO
  // BARS scrolling right→left past a fixed "now" marker. Data is
  // model.prompter.chords — the beat-grid re-decode captured BEFORE section
  // detection and folding touch anything (pipeline.prompter_chords); the
  // chart's own folded chords are only a fallback for old baked files.
  // Colours: root pitch class → circle-of-fifths hue (rootHue, the app's
  // convention everywhere), theme-aware tints; "Key colours" pref OFF falls
  // back to neutral card/ink like lensBand does.
  function reelFill(pc){
    if(!PREF.cof) return T.card;
    return PREF.theme==="dark" ? `hsl(${rootHue(pc)} 30% 28%)` : `hsl(${rootHue(pc)} 52% 84%)`;
  }
  function bigChordColor(pc){
    if(!PREF.cof) return T.ink;
    return PREF.theme==="dark" ? `hsl(${rootHue(pc)} 45% 74%)` : `hsl(${rootHue(pc)} 55% 34%)`;
  }
  function prompterData(){
    const m=S.model||{};
    if(m.prompter && m.prompter.chords && m.prompter.chords.length) return m.prompter.chords;
    // old baked chart without the key: flatten the chart's chords over every
    // pass — folded, but at least the reel works until the chart is re-baked
    return (S.chordTimeIndex||[]).map(h=>{ const c=S.chords[h.idx]||{};
      return {t0:h.t0, t1:h.t1, root:c.root||0, q:c.q||"", bass:(c.bass==null?-1:c.bass), nc:!!c.nc, c:(c.c==null?1:c.c)}; });
  }
  let _promptKeysBound=false;
  function renderPrompter(){
    const w=screenWrap();
    const m=S.model;
    if(!m){ setTimeout(()=>go("library",{push:false}),0); return w; }
    w.appendChild(appBar(m.title, "Prompter — now + the next four bars", "chart"));
    const chords=prompterData().slice().sort((a,b)=>a.t0-b.t0);
    const grid=(m.barGrid||[]).slice();
    ensureLoopEls();   // warm the loop pair so the first LOOP tap costs nothing
    // UI refresh 2026-08-08 (§4 / design 2a): current chord 78px, its ROLE on
    // one line under it, the next two chords greyed under that. The bar
    // counter moved to the reel's label; the "tap the piano…" micro-caption
    // is gone — the card is the affordance. The hands card + transport are
    // appended further down, after the voicing tracks they depend on.
    // Scrollable, not overflowing (Louis, 2026-08-08: the seam buttons were
    // visible but untappable — on a shorter viewport the centred stage
    // overflowed UNDER the reel block, whose transparent box then ate the
    // taps). auto-margins on first/last child: centred when there is room,
    // scrolls from the top when there is not.
    const stage=el("div","flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:0;padding:0 18px;overflow-y:auto;");
    stage.className="ap-nobar";
    const big=el("div","min-height:86px;display:flex;align-items:center;justify-content:center;margin-top:auto;");
    const sub=el("div",`font:italic 13px ${SERIF};color:${T.faint};margin-top:8px;min-height:17px;text-align:center;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`,"");
    const nextRow=el("div","display:flex;align-items:baseline;gap:16px;margin-top:6px;min-height:24px;opacity:.5;");
    stage.appendChild(big); stage.appendChild(sub); stage.appendChild(nextRow);
    // A loop engaged on the CHART (A–B) is the same engine — adopt it, so the
    // loop button reads on and the seam adjuster is there (Louis's report:
    // "l'outil de calage n'est plus présent" after arming from the chart).
    let curMids=null, curOne=null,
        loop=S._loopEngine?{a:S._loopEngine.a, b:S._loopEngine.b}:null;
    w.appendChild(stage);
    // no transport bar on this screen — the reel goes to the bottom edge
    const reelWrap=el("div",`flex:0 0 auto;padding:0 18px calc(20px + env(safe-area-inset-bottom));`);
    const reelInner=el("div","max-width:720px;margin:0 auto;");
    // speed presets (§4): the slider became three kitSegmented stops — slow
    // the audio, pitch preserved, to play along
    const spdRow=el("div","display:flex;align-items:center;gap:10px;margin-bottom:10px;");
    spdRow.appendChild(el("span",`font:600 10px ${UI};letter-spacing:.06em;text-transform:uppercase;color:${T.faint};flex:0 0 auto;`,"speed"));
    const RATES=[[0.5,"0.5×"],[0.75,"0.75×"],[1,"1×"]];
    const spdHost=el("div","flex:0 0 auto;");
    const paintSpd=()=>{
      clear(spdHost);
      spdHost.appendChild(kitSegmented(RATES,
        ()=>{ const r=S.playRate||1; let best=1,bd=9;
              RATES.forEach(([v])=>{ const d=Math.abs(v-r); if(d<bd){bd=d;best=v;} }); return best; },
        v=>{ S.playRate=v; applyPlayRate(); paintSpd(); },
        {inline:true, height:SZ.control, font:13}));
    };
    paintSpd();
    spdRow.appendChild(spdHost);
    reelInner.appendChild(spdRow);
    const reelLbl=el("div",`font:600 10px ${UI};letter-spacing:.06em;text-transform:uppercase;color:${T.faint};margin-bottom:6px;`,"next four bars");
    reelInner.appendChild(reelLbl);
    const reel=el("div",`position:relative;height:96px;background:${T.card};border:1px solid ${T.line};border-radius:14px;overflow:hidden;`);
    const strip=el("div","position:absolute;top:0;bottom:0;left:0;width:0;will-change:transform;");
    reel.appendChild(strip);
    const marker=el("div",`position:absolute;top:0;bottom:0;width:2px;background:${T.accent};z-index:5;box-shadow:0 0 8px ${T.accent}55;`);
    const markerCap=el("div",`position:absolute;top:2px;transform:translateX(-50%);color:${T.accent};font:700 10px ${UI};z-index:5;`,"▼");
    const markerLbl=el("div",`position:absolute;bottom:3px;color:${T.accent};font:600 8.5px ${UI};letter-spacing:.05em;opacity:.75;z-index:5;`,"now");
    reel.appendChild(marker); reel.appendChild(markerCap); reel.appendChild(markerLbl);
    reelInner.appendChild(reel);
    // full-song strip: every chord as a thin colour block, playhead line,
    // tap/drag anywhere = jump there (the /compare demo's #tl, app colours)
    const tl=el("div",`position:relative;height:26px;margin-top:8px;background:${T.card};border:1px solid ${T.line};border-radius:8px;overflow:hidden;cursor:pointer;touch-action:none;`);
    const tlBlocks=el("div","position:absolute;inset:0;");
    const tlLoopBand=el("div",`position:absolute;top:0;bottom:0;display:none;background:${T.accent}2e;border-left:1px solid ${T.accent};border-right:1px solid ${T.accent};z-index:2;`);
    const tlPh=el("div",`position:absolute;top:0;bottom:0;width:2px;background:${T.accent};z-index:3;`);
    tl.appendChild(tlBlocks); tl.appendChild(tlLoopBand); tl.appendChild(tlPh);
    reelInner.appendChild(tl);
    reelWrap.appendChild(reelInner); w.appendChild(reelWrap);

    const MARKER_FRAC=0.18;
    // window ahead of the marker = exactly FOUR bars of this song
    const dbar=[]; for(let i=1;i<grid.length;i++) dbar.push(grid[i]-grid[i-1]);
    dbar.sort((a,b)=>a-b);
    const medBar=dbar.length?dbar[dbar.length>>1]:2.4;
    const aheadS=Math.max(3, 4*medBar);
    let W=0, markerX=0, pxs=0, blocks=[];
    const songDur=Math.max(grid.length?grid[grid.length-1]:0, chords.length?chords[chords.length-1].t1:1);
    const bigSize=78;   // design 2a: the current chord is 78px
    function barAt(t){
      let lo=0, hi=grid.length-2, bi=0;
      while(lo<=hi){ const mid=(lo+hi)>>1; if(grid[mid]<=t){ bi=mid; lo=mid+1; } else hi=mid-1; }
      return bi;
    }
    // every prompter seek goes through here: inside an armed loop it moves
    // the ENGINE's element; a seek clearly outside the band disarms the loop
    // (you asked to leave), then seeks normally.
    function seekTo(t){
      if(loop){
        if(t>=loop.a-0.5 && t<=loop.b+0.5){ loopEngineSeek(t); sync(true); return; }
        loop=null; loopEngineDispose(true); paintLoop();
      }
      const d=totalDur(); if(d>0) seekFrac(t/d);
      sync(true);
    }
    function jumpBars(n){
      const target=Math.min(Math.max(barAt(nowTime()+PLAYHEAD_LEAD_S)+n,0),grid.length-2);
      seekTo(grid[target]);
    }
    function paintLoop(){
      const on=!!loop;
      loopBtn.style.background=on?T.accent:T.card; loopBtn.style.color=on?"#fff":T.ink;
      loopBtn.style.borderColor=on?T.accent:T.line;
      if(on) loopBars.textContent="bars "+(barAt(loop.a+0.01)+1)+"–"+(barAt(loop.b-0.01)+1);
      seam.style.display=on?"flex":"none";
      if(on) paintSeam();
      tlLoopBand.style.display=on?"block":"none";
      if(on){ tlLoopBand.style.left=(loop.a/songDur*100)+"%";
              tlLoopBand.style.width=((loop.b-loop.a)/songDur*100)+"%"; }
    }
    // Two-hand voicings (Louis, 2026-08-05): left hand = the sounding bass
    // (F2–E3 window), right hand = the §9 minimal-movement cascade run over
    // the PROMPTER's chord stream with freeBass candidates — inversions and
    // rootless shapes allowed, since the left hand owns the bass.
    const lhMidi=c=>{ const pc=mod((c.bass!=null&&c.bass>=0)?c.bass:c.root,12);
      let b=36+pc; while(b<41) b+=12; return b; };
    const rhTrack=(()=>{
      const lv=learnLevel(), t=new Array(chords.length).fill(null);
      // "change as few NOTES as possible" (Louis, 2026-08-05): the primary
      // cost is the COUNT of keys that change (exact-midi common tones are
      // held); semitone movement only breaks ties. ×50 dominates any
      // in-window movement (≤ ~35 semitones).
      const changedKeys=(a,b)=>{
        const cnt={}; a.forEach(x=>cnt[x]=(cnt[x]||0)+1);
        let common=0; b.forEach(x=>{ if(cnt[x]>0){ common++; cnt[x]--; } });
        return Math.max(a.length,b.length)-common;
      };
      let prev=null;
      chords.forEach((c,i)=>{
        if(c.nc) return;
        const cands=vlCandidates(c.root,dispQ(c.q),lv,-1,true);
        let best=null,bc=Infinity;
        cands.forEach(cd=>{
          const cost=prev?changedKeys(prev.midis,cd.midis)*50+assignCost(prev.midis,cd.midis,false)
                         :Math.abs(meanOf(cd.midis)-66)+(cd.style==="close"?0:2);
          if(cost<bc){ bc=cost; best=cd; }
        });
        t[i]=best; prev=best;
      });
      // inspectable totals for the shipped track (read window.__prompterVL)
      try{
        let ch=0,mv=0,sp=0,pp=null;
        t.forEach(r=>{ if(!r) return;
          sp=Math.max(sp,Math.max.apply(null,r.midis)-Math.min.apply(null,r.midis));
          if(pp){ ch+=changedKeys(pp.midis,r.midis); mv+=assignCost(pp.midis,r.midis,true); } pp=r; });
        window.__prompterVL={changedKeys:ch, movedSemitones:Math.round(mv), maxSpanSemitones:sp};
      }catch(e){}
      return t;
    })();
    // ONE-hand voicings (Louis, 2026-08-08): the same minimal-movement
    // cascade, but bass-in-hand (freeBass off) — what a single hand really
    // plays. The two-hand track above keeps the left-hand-owns-the-bass
    // freedom.
    const ohTrack=(()=>{
      const lv=learnLevel(), t=new Array(chords.length).fill(null);
      let prev=null;
      chords.forEach((c,i)=>{
        if(c.nc) return;
        const cands=vlCandidates(c.root,dispQ(c.q),lv,(lv>=3)?c.bass:-1,false);
        let best=null,bc=Infinity;
        cands.forEach(cd=>{
          const cost=prev?assignCost(prev.midis,cd.midis,false)
                         :Math.abs(meanOf(cd.midis)-64)+(cd.style==="close"?0:4);
          if(cost<bc){ bc=cost; best=cd; }
        });
        t[i]=best; prev=best;
      });
      return t;
    })();
    // Fixed keyboard windows for the WHOLE song (Louis, 2026-08-05): the view
    // must never re-frame between chords, so each hand's range is the union
    // of everything it will play, computed once here — through the SAME
    // splitHands() the card uses per chord, so the windows always cover what
    // each keyboard is asked to show.
    const midsFor=(c,i)=>{
      const rh=rhTrack[i], lh=lhMidi(c);
      const rhM=rh?rh.midis:withBass(voClose(c.root,dispQ(c.q)),c.root,c.bass);
      return [lh].concat(rhM.filter(x=>x!==lh));
    };
    const oneFor=(c,i)=>{
      const oh=ohTrack[i];
      return oh?oh.midis:withBass(voClose(c.root,dispQ(c.q)),c.root,(learnLevel()>=3)?c.bass:-1);
    };
    const handRanges=(()=>{
      const span=a=>{ if(!a.length) return {lo:60,oct:2};
        const lo=12*Math.floor(Math.min.apply(null,a)/12);
        return {lo, oct:Math.max(1,Math.ceil((Math.max.apply(null,a)-lo+1)/12))}; };
      const L=[], R=[], A=[], O=[];
      chords.forEach((c,i)=>{ if(c.nc) return;
        const mids=midsFor(c,i), h=splitHands(mids);
        h.left.forEach(x=>L.push(x)); h.right.forEach(x=>R.push(x));

        const g=Math.min(Math.floor(barAt(nowTime()+PLAYHEAD_LEAD_S)/4)*4, Math.max(0,grid.length-2));

    ctrl.appendChild(back4); ctrl.appendChild(bigPlay); ctrl.appendChild(fwd4); ctrl.appendChild(loopBtn);
    // Loop-seam adjuster (Louis, 2026-08-08: "encore un poil trop tard, fais

    const seam=el("div","display:none;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;");

    function layout(){

          const nx=(chords[i+1]&&!chords[i+1].nc)?{root:chords[i+1].root,q:chords[i+1].q}:null;
          sub.textContent=roleOf(S.key,c.root,dispQ(c.q),nx).text;

              ? el("span",`font:italic 600 14px ${SERIF};color:${T.faint};`,"N.C.")
              : glyph(n.root,n.q,24,"exact",T.ink,n.bass)); });

      // shown on the reel's label since the role line took its old spot
      let lo=0, hi=grid.length-1, bi=-1;
      while(lo<=hi){ const mid=(lo+hi)>>1; if(grid[mid]<=t){ bi=mid; lo=mid+1; } else hi=mid-1; }
      const bar1=Math.min(Math.max(bi+1,1), m.nBars||grid.length-1);
      if(bar1!==curBar){ curBar=bar1;
        reelLbl.textContent="bar "+bar1+" of "+(m.nBars||grid.length-1)+" · next four bars";
        if(!loop){
          const g=Math.min(Math.floor(Math.max(0,bi)/4)*4, Math.max(0,grid.length-2));
          loopBars.textContent="bars "+(g+1)+"–"+Math.min(g+4,Math.max(1,grid.length-1));
        }
      }
      // full-song playhead (2-decimal dedupe: skip the style write when still)
      const ph=(Math.min(1,Math.max(0,t/songDur))*100).toFixed(2)+"%";
      if(ph!==lastPh){ lastPh=ph; tlPh.style.left=ph; }
      // (the loop engine drives its own wrap now — v2, 2026-08-08)
      // big play button + keep the screen awake while playing
      if(S.playing!==lastPlaying){ lastPlaying=S.playing; playGlyph(bigPlay,S.playing,26); wakeLock(S.playing); }
    }
    let lastPh="", lastPlaying=null;
    async function wakeLock(on){
      try{
        if(on && !S._wakeLock && navigator.wakeLock) S._wakeLock=await navigator.wakeLock.request("screen");
        if(!on && S._wakeLock){ S._wakeLock.release(); S._wakeLock=null; }
      }catch(e){}
    }

    // and skipped when the string is unchanged (paused). This is far lighter
    // than the 60/s full-DOM loop that starved iOS's audio engine (see the

    if(S._prompterRaf) cancelAnimationFrame(S._prompterRaf);

      if(c.nc) return;
      tlBlocks.appendChild(el("div",`position:absolute;top:0;bottom:0;left:${(c.t0/songDur*100).toFixed(2)}%;width:${Math.max(0.15,(c.t1-c.t0)/songDur*100).toFixed(2)}%;background:${reelFill(c.root)};`));
    });

    // to the tapped instant. touch-action pan-y leaves vertical scrolling to
    // the browser and horizontal gestures to us.
    reel.style.touchAction="pan-y";
    let dragX=null, dragT0=0, dragMoved=0, lastSeekTs=0;
    reel.addEventListener("pointerdown",e=>{
      dragX=e.clientX; dragT0=nowTime(); dragMoved=0;

    });
    reel.addEventListener("pointermove",e=>{
      if(dragX==null || !pxs) return;

    });

    let tlDown=false;
    const tlSeek=e=>{ const r=tl.getBoundingClientRect(); const d=totalDur();

    tl.addEventListener("pointercancel",()=>{ tlDown=false; });

    // and the speed slider) = back to the chart — the bottom bar is gone, so
    // the screen needs a first-class way out
    let swY=null, swX=null;
    w.addEventListener("pointerdown",e=>{
      if(reel.contains(e.target)||tl.contains(e.target)||((e.target.tagName||"")==="INPUT")) return;

      // it must not yank the user back to the chart

    w.addEventListener("pointerup",e=>{

      document.addEventListener("keydown",e=>{
        if(S.screen!=="prompter") return;
        const tag=(e.target&&e.target.tagName)||"";
        if(tag==="INPUT"||tag==="TEXTAREA") return;
        if(e.code==="Space"){ e.preventDefault(); if(S._loopEngine) loopEngineToggle(); else togglePlay(); }
        else if(e.key==="ArrowLeft"){ e.preventDefault(); if(S._prompterJump) S._prompterJump(-4); }
        else if(e.key==="ArrowRight"){ e.preventDefault(); if(S._prompterJump) S._prompterJump(4); }

    }

  }

  // Playback speed (prompter's slider). preservesPitch is the default in
  // modern engines but iOS wants the webkit-prefixed property set explicitly.
  function applyPlayRate(){
    [S.audio].concat(S._loopEls||[]).forEach(a=>{
      if(!a) return;
      try{ a.preservesPitch=true; a.webkitPreservesPitch=true; }catch(e){}
      try{ a.playbackRate=S.playRate||1; }catch(e){}
    });
    // a rate change moves the bar line's wall-clock arrival — re-aim the wrap
    if(S._loopEngine) loopSchedule(S._loopEngine);
  }

  // ── gapless practice loop v2 (Louis, 2026-08-08: « il faut que ce soit
  // nickel ») ──────────────────────────────────────────────────────────────
  // v1 had two audible latencies: ENGAGING swapped playback onto a cold
  // <audio> element (a full play() start-up), and every WRAP paid the
  // standby's play() start-up at the bar line. v2:
  //   * engaging keeps the MAIN element rolling — leg 1 rides S.audio, zero
  //     start-up; the ping-pong pair only enters at the first wrap;
  //   * ~150 ms before the bar line the standby starts MUTED, its clock
  //     aligned to cross `a` exactly when the active crosses `b`; the wrap
  //     itself is volume 1↔0 — no play(), no seek, on the boundary;
  //   * the standby's real start-up delay is measured at each crossover and
  //     fed back into the next arm (adaptive, clamped to 80 ms).
  // Boundary detection: a coarse setTimeout into a rAF spin — the engine
  // drives itself; callers no longer poll for the wrap.
  // The crossover moment is tunable BY EAR — Louis, same night: "encore un
  // poil trop tard". loopEpsS is how EARLY we cross (rAF detection alone can
  // be a frame late); the prompter shows an earlier/later adjuster while a
  // loop runs, persisted as harmLoopEpsMs. Default 12 ms early.
  const LOOP_PRE_S=0.15;
  let loopEpsS=(()=>{ const v=parseFloat(localStorage.getItem("harmLoopEpsMs")); return isFinite(v)?v/1000:0.012; })();
  function loopEpsSet(ms){
    loopEpsS=Math.max(-0.04, Math.min(0.08, ms/1000));
    try{ localStorage.setItem("harmLoopEpsMs", String(Math.round(loopEpsS*1000))); }catch(e){}
  }
  function ensureLoopEls(){
    const src=S._audioBlobUrl||S.audioUrl; if(!src) return null;
    if(!S._loopEls){
      const mk=()=>{ const el=new Audio(); el.preload="auto"; el.playsInline=true;
        try{ el.setAttribute("playsinline",""); el.setAttribute("webkit-playsinline",""); }catch(e){}
        return el; };
      S._loopEls=[mk(),mk()];
    }
    S._loopEls.forEach(el=>{ if(el._src!==src){ el.src=src; el._src=src; el.load(); } el.volume=1; });
    return S._loopEls;
  }
  function loopStandby(e){ return e.active===e.els[0] ? e.els[1] : e.els[0]; }
  function loopEngineStart(a,b){
    if(!S.audio || !ensureLoopEls()) return null;
    loopEngineDispose(false);
    applyPlayRate();
    const eng={a, b, els:S._loopEls, active:S.audio, playing:true,
               _timer:null, _raf:null, _lat:0.02};
    const pos=S.audio.currentTime;
    // leg 1 rides the MAIN element — only seek if we are outside the loop
    if(pos<a-0.05 || pos>b-0.05){ try{ S.audio.currentTime=a; }catch(e){} }
    S.playing=true;
    if(S.audio.paused) S.audio.play().catch(()=>{});
    S._loopEngine=eng;
    loopSchedule(eng);
    setPlayBtn();
    return eng;
  }
  function loopSchedule(eng){
    if(eng._timer){ clearTimeout(eng._timer); eng._timer=null; }
    if(eng._raf){ cancelAnimationFrame(eng._raf); eng._raf=null; }
    if(!eng.playing || S._loopEngine!==eng) return;
    const rate=S.playRate||1;
    const ms=Math.max(0, ((eng.b-eng.active.currentTime)/rate - LOOP_PRE_S)*1000);
    eng._timer=setTimeout(()=>loopArm(eng), ms);
  }
  function loopArm(eng){
    if(S._loopEngine!==eng || !eng.playing) return;
    const st=loopStandby(eng), rate=S.playRate||1;
    // align the standby's clock so it crosses `a` when the active crosses
    // `b`; _lat is the measured play() start-up of the previous wrap
    const rem=Math.max(0,(eng.b-eng.active.currentTime)/rate);
    try{ st.currentTime=Math.max(0, eng.a - rem*rate + eng._lat); }catch(e){}
    st.volume=0;
    st.play().catch(()=>{});
    const spin=()=>{
      if(S._loopEngine!==eng || !eng.playing){ try{ st.pause(); st.volume=1; }catch(e){} return; }
      if(eng.active.currentTime>=eng.b-loopEpsS){
        // measure how far the standby lagged its mark, feed the next arm
        const err=eng.a - st.currentTime;
        eng._lat=Math.max(0, Math.min(0.08, eng._lat + err*0.7));
        st.volume=1;
        const old=eng.active;
        try{ old.pause(); }catch(e){}
        if(old!==S.audio) old.volume=1;
        eng.active=st;
        loopSchedule(eng);
        return;
      }
      eng._raf=requestAnimationFrame(spin);
    };
    eng._raf=requestAnimationFrame(spin);
  }
  function loopEngineToggle(){
    const e=S._loopEngine; if(!e) return;
    e.playing=!e.playing; S.playing=e.playing;
    if(e.playing){ e.active.play().catch(()=>{}); loopSchedule(e); }
    else{
      e.active.pause();
      if(e._timer){ clearTimeout(e._timer); e._timer=null; }
      if(e._raf){ cancelAnimationFrame(e._raf); e._raf=null; }
      const st=loopStandby(e); try{ st.pause(); st.volume=1; }catch(err){}
    }
  }
  function loopEngineSeek(t){
    const e=S._loopEngine; if(!e) return;
    try{ e.active.currentTime=Math.max(e.a,Math.min(t,e.b-0.05)); }catch(err){}
    loopSchedule(e);
  }
  function loopEngineDispose(resume){
    const e=S._loopEngine; if(!e) return;
    S._loopEngine=null;
    if(e._timer) clearTimeout(e._timer);
    if(e._raf) cancelAnimationFrame(e._raf);
    const pos=e.active.currentTime, playing=e.playing;
    e.els.forEach(x=>{ try{ x.pause(); x.volume=1; }catch(err){} });
    if(e.active!==S.audio && S.audio){
      try{ S.audio.currentTime=pos; }catch(err){}
      if(resume!==false && playing && S.playing) S.audio.play().catch(()=>{});
    }
  }

  // ensureTransport() and its 9px toggle strip are gone (UI refresh
  // 2026-08-08, §2): the dock built by chartDock() IS the transport now, and
  // Follow / Click / Coach live in the Aa sheet. The audio-element lifecycle
  // — every hard-won iOS lesson — stays below in syncTransport(), unchanged.
  function syncCoach(){
    if(S._coachPanel) S._coachPanel.style.display=(S.coach&&S.screen==="chart")?"block":"none";
  }
  function paintCoachChord(idx){
    if(!S._coachKb) return;
    const ch=S.chords[idx]; if(!ch) return;
    const nt=S._coachNote;
    if(ch.nc){ clear(S._coachGlyph); S._coachNames.textContent="N.C. — lay out"; clear(S._coachKb); if(nt) nt.style.display="none"; return; }
    const lv=learnLevel(), q=dispQ(ch.q);
    let m, picked=null;
    if(S.coachStyle==="smooth"){
      const t=vlTrack();
      picked=t[idx];
      m=picked?picked.midis:withBass(voClose(ch.root,q),ch.root,(lv>=3)?ch.bass:-1);
    } else {
      const m0=voicingByStyle(ch.root,q,S.coachStyle);
      m=(S.coachStyle==="rootless")?m0:withBass(m0,ch.root,(lv>=3)?ch.bass:-1);
    }
    clear(S._coachGlyph);
    // ink on card since the coach moved into the dock (was cream on deep)
    S._coachGlyph.appendChild(glyph(ch.root,q,20,"exact",T.ink,(lv>=3)?ch.bass:-1));
    S._coachNames.textContent=m.map(x=>note(mod(x,12))).join(" · ")+(picked?"  ·  "+picked.style:"");
    renderVoicing(S._coachKb,m,64,true);
    if(nt){
      if(S.coachStyle==="smooth"){
        const tot=vlTotals();
        nt.textContent="Voiced to keep the hand still: "+tot.smooth+" semitones of movement across the chart, vs "+tot.naive+" playing every chord in root position.";
        nt.style.display="block";
      } else nt.style.display="none";
    }
  }
  function syncTransport(screen){

  const SEVENTHS_BY_FAMILY={
    maj:[{q:"",label:"Triad"},{q:"6",label:"6"},{q:"^7",label:"Maj7"},{q:"7",label:"Dom7"}],
    min:[{q:"-",label:"Triad"},{q:"-7",label:"Min7"},{q:"-^7",label:"MinMaj7"}],
    dim:[{q:"o",label:"Triad"},{q:"h7",label:"m7♭5"},{q:"o7",label:"Dim7"}],
    aug:[{q:"+",label:"Triad"},{q:"+7",label:"Aug7"},{q:"+^7",label:"AugMaj7"}],
    sus:[{q:"sus4",label:"Sus4"},{q:"sus2",label:"Sus2"},{q:"7sus",label:"7Sus4"}],
  };
  const EXTENSIONS_BY_SEVENTH={
    "":[{q:"",label:"—"}], "6":[{q:"6",label:"—"}],
    "^7":[{q:"^7",label:"7"},{q:"^9",label:"9"},{q:"^9#11",label:"9♯11"},{q:"^13",label:"13"}],
    "7":[{q:"7",label:"7"},{q:"9",label:"9"},{q:"7b9",label:"♭9"},{q:"7#9",label:"♯9"},{q:"13",label:"13"}],
    "-":[{q:"-",label:"—"}],
    "-7":[{q:"-7",label:"7"},{q:"-9",label:"9"},{q:"-11",label:"11"},{q:"-13",label:"13"}],
    "-^7":[{q:"-^7",label:"—"}], "o":[{q:"o",label:"—"}], "h7":[{q:"h7",label:"—"}], "o7":[{q:"o7",label:"—"}],
    "+":[{q:"+",label:"—"}], "+7":[{q:"+7",label:"—"}], "+^7":[{q:"+^7",label:"—"}],
    "sus4":[{q:"sus4",label:"Triad"},{q:"9sus",label:"9"}], "sus2":[{q:"sus2",label:"—"}],
    "7sus":[{q:"7sus",label:"7"},{q:"9sus",label:"9"}],
  };
  function extensionsFor(q){ return EXTENSIONS_BY_SEVENTH[q]||[{q,label:"—"}]; }
  // reverse index: any exact token → which family/seventh produced it (so the
  // cylinder opens already parked on the chord you tapped)
  const QUAL_TO_FS={};
  Object.keys(SEVENTHS_BY_FAMILY).forEach(fam=>{
    SEVENTHS_BY_FAMILY[fam].forEach(sev=>{
      extensionsFor(sev.q).forEach(ext=>{ QUAL_TO_FS[ext.q]={family:fam, seventh:sev.q}; });
    });
  });

  // iOS-style rolling columns (Root · Family · 7th · Ext), one per depth of the
  // chord tree — native scroll-snap, no drag math. Ported from the shipped
  // chart's picker, which replaced a nested-ring design that was too fiddly to
  // hit on a touchscreen.
  const CYL_H=36;
  function buildCylinder(ch,onChange){
    let selRoot=ch.root;
    const fs=QUAL_TO_FS[ch.q]||{family:"maj",seventh:""};
    let selFam=fs.family, selSev=fs.seventh, selQ=ch.q;

    const box=el("div","");
    const labels=el("div","display:flex;width:100%;padding:0 1px 6px;");
    ["Root","Family","7th","Ext"].forEach(l=>labels.appendChild(el("span",`flex:1;text-align:center;font:700 10px ${UI};text-transform:uppercase;letter-spacing:.04em;color:${T.faint};`,l)));
    box.appendChild(labels);

    const picker=el("div",`position:relative;display:flex;width:100%;height:${CYL_H*5}px;background:#efe9d9;border-radius:10px;border:1px solid #e2dac4;overflow:hidden;`);
    picker.appendChild(el("div",`position:absolute;left:0;right:0;top:50%;height:${CYL_H}px;margin-top:-${CYL_H/2}px;border-top:1px solid #cfc7ae;border-bottom:1px solid #cfc7ae;background:#8a2b2b14;pointer-events:none;z-index:2;`));
    const cols=[];
    for(let i=0;i<4;i++){
      const c=el("div",`flex:1 1 0;min-width:0;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:${CYL_H*2}px 0;border-right:${i<3?"1px solid #e2dac4":"none"};`);
      c.className="ap-nobar"; cols.push(c); picker.appendChild(c);
    }
    box.appendChild(picker);

    // A column that isn't laid out yet silently ignores scrollTop — so the
    // picker opened parked on the first item (C) instead of the chord you
    // tapped, and the resulting scroll event then "selected" C for real.
    // Park it after layout (rAF), and ignore scroll events until then.
    let ready=false;
    function fill(col, items, sel){
      col._items=items; col._sel=sel; clear(col);
      items.forEach((it,i)=>{
        const d=el("div",`height:${CYL_H}px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;white-space:nowrap;padding:0 2px;font:${i===sel?"700 15px":"600 13.5px"} ${UI};color:${i===sel?T.ink:"#4a463699"};`,it.label);
        col.appendChild(d);
      });
      col.scrollTop=sel*CYL_H;
      requestAnimationFrame(()=>{ col.scrollTop=col._sel*CYL_H; });
    }
    function mark(col,idx){ [...col.children].forEach((d,i)=>{ d.style.color=i===idx?T.ink:"#4a463699"; d.style.font=(i===idx?"700 15px ":"600 13.5px ")+UI; }); }
    function snapped(col){ const n=(col._items||[]).length; return n?Math.max(0,Math.min(n-1,Math.round(col.scrollTop/CYL_H))):0; }
    const timers=new WeakMap();
    function onScroll(col,cb){
      col.addEventListener("scroll",()=>{
        if(!ready) return;     // the initial parking scroll is not a user choice
        clearTimeout(timers.get(col));
        timers.set(col,setTimeout(()=>{ const i=snapped(col); mark(col,i); col._sel=i; haptic(4); cb(col._items[i]); },90));
      },{passive:true});
    }
    const emit=()=>onChange({root:selRoot,q:selQ});
    function renderRoot(){ fill(cols[0], ROOTS.map(pc=>({pc,label:note(pc)})), selRoot); }
    function renderFam(){ fill(cols[1], FAMILIES.map(f=>({id:f.id,label:f.label})), Math.max(0,FAMILIES.findIndex(f=>f.id===selFam))); }
    function renderSev(){ const o=SEVENTHS_BY_FAMILY[selFam]||[]; fill(cols[2], o.map(x=>({q:x.q,label:x.label})), Math.max(0,o.findIndex(x=>x.q===selSev))); }
    function renderExt(){ const o=extensionsFor(selSev); fill(cols[3], o.map(x=>({q:x.q,label:x.label})), Math.max(0,o.findIndex(x=>x.q===selQ))); }
    renderRoot(); renderFam(); renderSev(); renderExt();
    onScroll(cols[0], it=>{ selRoot=it.pc; emit(); });
    onScroll(cols[1], it=>{ selFam=it.id; selSev=(SEVENTHS_BY_FAMILY[selFam]||[{q:""}])[0].q; renderSev(); selQ=extensionsFor(selSev)[0].q; renderExt(); emit(); });
    onScroll(cols[2], it=>{ selSev=it.q; selQ=extensionsFor(selSev)[0].q; renderExt(); emit(); });
    onScroll(cols[3], it=>{ selQ=it.q; emit(); });
    // two frames: one for the columns to get a height, one for the parking
    // scroll to land — only then does a scroll event mean the user rolled it
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ ready=true; }));
    box.appendChild(el("div",`text-align:center;font:italic 11.5px ${SERIF};color:${T.faint};margin-top:10px;`,"roll the columns — hear it, then lock below"));
    return box;
  }

  function buildHand(idx,onPick,rerender){
    const ch=S.chords[idx];
    const box=el("div","");
    const sub=el("div",`display:inline-flex;background:${T.line};border-radius:9px;padding:3px;gap:2px;margin-bottom:12px;`);
    [["cylinder","Cylinder"],["grid","Grid"]].forEach(([k,lbl])=>{
      const on=handTab===k;
      const b=el("button",`border:none;border-radius:7px;padding:6px 12px;font:600 11.5px ${UI};cursor:pointer;background:${on?T.card:"transparent"};color:${on?T.ink:T.faint};box-shadow:${on?"0 1px 2px rgba(0,0,0,.12)":"none"};`,lbl);
      b.onclick=()=>{ handTab=k; rerender&&rerender(); };
      sub.appendChild(b);
    });
    box.appendChild(sub);
    if(handTab==="cylinder"){
      const preview=el("div","display:flex;justify-content:center;margin-bottom:10px;");
      const paint=c=>{ clear(preview); preview.appendChild(glyph(c.root,c.q,28,"exact",T.ink)); };
      paint(ch);
      box.appendChild(preview);
      box.appendChild(buildCylinder(ch, c=>{ paint(c); onPick&&onPick(c); }));
      return box;
    }
    box.appendChild(buildChipGrid(idx,onPick));
    return box;
  }
  function buildChipGrid(idx,onPick){
    const ch=S.chords[idx]; let selRoot=ch.root, selQ=ch.q;
    const box=el("div","");
    const preview=el("div","display:flex;justify-content:center;margin-bottom:12px;");
    const refresh=()=>{ clear(preview); preview.appendChild(glyph(selRoot,selQ,30,"exact",T.ink)); };
    box.appendChild(preview);
    box.appendChild(el("div",`font:600 9.5px ${UI};letter-spacing:.06em;text-transform:uppercase;color:${T.faint};margin:2px 0 6px;`,"Root"));
    const rg=el("div","display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px;");
    ROOTS.forEach(r=>{ const b=el("button",`padding:10px 0;border-radius:8px;border:1.5px solid ${T.line};background:${T.card};font:italic 600 15px ${SERIF};cursor:pointer;`,note(r));
      b.onclick=()=>{ selRoot=r; [...rg.children].forEach((c,j)=>{ const on=ROOTS[j]===selRoot; c.style.borderColor=on?T.accent:T.line; c.style.background=on?T.accent:T.card; c.style.color=on?"#fff":T.ink;}); refresh(); onPick&&onPick({root:selRoot,q:selQ}); };
      rg.appendChild(b); });
    [...rg.children].forEach((c,j)=>{ const on=ROOTS[j]===selRoot; c.style.borderColor=on?T.accent:T.line; c.style.background=on?T.accent:T.card; c.style.color=on?"#fff":T.ink; });
    box.appendChild(rg);
    box.appendChild(el("div",`font:600 9.5px ${UI};letter-spacing:.06em;text-transform:uppercase;color:${T.faint};margin:2px 0 6px;`,"Quality"));
    const qg=el("div","display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;");
    QS.forEach(([q,lbl])=>{ const b=el("button",`padding:10px 0;border-radius:8px;border:1.5px solid ${T.line};background:${T.card};font:600 12px ${UI};cursor:pointer;`,lbl);
      b.onclick=()=>{ selQ=q; [...qg.children].forEach((c,j)=>{ const on=QS[j][0]===selQ; c.style.borderColor=on?T.accent:T.line; c.style.background=on?T.accent:T.card; c.style.color=on?"#fff":T.ink;}); refresh(); onPick&&onPick({root:selRoot,q:selQ}); };
      qg.appendChild(b); });
    [...qg.children].forEach((c,j)=>{ const on=QS[j][0]===selQ; c.style.borderColor=on?T.accent:T.line; c.style.background=on?T.accent:T.card; c.style.color=on?"#fff":T.ink; });
    box.appendChild(qg);
    box.appendChild(el("div",`text-align:center;font:italic 11.5px ${SERIF};color:${T.faint};`,"pick a root & quality — hear it, then lock below"));
    refresh(); return box;
  }
  function confirmChord(idx,root,q){
    const ch=S.chords[idx]; ch.root=root; ch.q=q; ch.confirmed=true; ch.c=1;
    S._vlBump=(S._vlBump||0)+1;   // the cascade depends on this chord's quality
    if(S.pending.indexOf(idx)<0) S.pending.push(idx);
    if(S._closeEditor) S._closeEditor();
    saveAnnotations();
    go("chart");
    toast("Locked — re-infer to propagate");
  }
  // Split one bar into two chords (2026-07-20 — see openEditor's splitBtn).
  // The ORIGINAL chord keeps its array index/beat and just shrinks to the
  // first half; the new second-half chord is APPENDED to S.chords (never
  // inserted in the middle) so no other chord's index shifts — S.pending,
  // any in-flight save, everything referencing an idx by position stays
  // valid. S.bars[bi].idxs gets the new index pushed on, which also keeps
  // render order correct: the kept original is always temporally first.
  function splitBar(idx, cand){
    const ch=S.chords[idx];
    const bi=S.bars.findIndex(b=>b.idxs.length===1 && b.idxs[0]===idx);
    if(bi<0){ toast("Can't split this bar"); return; }
    const bpb=(S.model && S.model.bpb) || 4;
    const mid=(ch.t0+ch.t1)/2;
    const newCh={
      root:cand.root, q:cand.q, c:1, confirmed:true,
      bar:ch.bar, beat:(ch.beat||0)+bpb/2,
      sec:ch.sec, secId:ch.secId, secIdx:ch.secIdx, reps:ch.reps,
      barFirst:false, secFirst:false,
      t0:mid, t1:ch.t1,
      spans:(ch.spans||[]).map(([s0,s1])=>[s0+(mid-ch.t0), s1]),
    };
    ch.spans=(ch.spans||[]).map(([s0,s1])=>[s0, s0+(mid-ch.t0)]);
    ch.t1=mid; ch.confirmed=true; ch.c=1;
    S._vlBump=(S._vlBump||0)+1;
    S.chords.push(newCh);
    const newIdx=S.chords.length-1;
    S.bars[bi].idxs.push(newIdx);
    if(S.pending.indexOf(idx)<0) S.pending.push(idx);
    S.pending.push(newIdx);
    if(S._closeEditor) S._closeEditor();
    saveAnnotations();
    go("chart");
    toast("Bar split — re-infer to propagate");
  }

  // ── section merge ───────────────────────────────────────────────────────
  function openMerge(){
    const [a,b]=S.spans;
    const na=spanBars(a), nb=spanBars(b);
    const equal = na===nb;
    const back=overlay(); const sheet=sheetBox(); sheet.appendChild(handle());
    const pair=el("div","display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;");
    [[a,0,na],[b,1,nb]].forEach(([sp,k,n],i)=>{
      if(i===1) pair.appendChild(el("span",`font:600 22px ${UI};color:${equal?T.accent:T.rule};`, equal?"⋈":"≠"));
      const box=el("div",`display:flex;flex-direction:column;align-items:center;border:2px solid ${SPAN_EDGE[k]};border-radius:9px;padding:7px 13px;background:${T.paper};`);
      box.appendChild(el("div",`font:800 15px ${UI};color:${SPAN_EDGE[k]};`, (k?"B":"A")+" · "+n+" bars"));
      box.appendChild(el("div",`font:500 10.5px ${UI};color:${T.faint};margin-top:2px;`, "bars "+(sp.b0+1)+"–"+(sp.b1+1)));
      pair.appendChild(box);
    });
    sheet.appendChild(pair);
    if(equal){
      sheet.appendChild(el("div",`text-align:center;font:700 15px ${UI};color:${T.ink};margin-bottom:4px;`,"Pool these two passes"));
      sheet.appendChild(el("div",`text-align:center;font:italic 12.5px ${SERIF};color:${T.faint};line-height:1.5;margin-bottom:16px;`,"Same music, heard twice — their audio is summed beat-by-beat, so the decoder gets twice the evidence and the shaky bars resolve."));
      const go2=el("button",`width:100%;border:none;background:${T.accent};color:#fff;border-radius:12px;padding:14px;font:600 14px ${UI};cursor:pointer;`,"Pool & re-infer");
      go2.onclick=()=>{ closeOverlay(back); runMerge(); };
      sheet.appendChild(go2);
    } else {
      // Told up front, not after a 20s decode that quietly threw the merge away:
      // pooling lines the two spans up beat-by-beat, so they must be the same
      // musical length.
      sheet.appendChild(el("div",`text-align:center;font:700 15px ${UI};color:${T.accent};margin-bottom:4px;`,"These can’t be pooled"));
      sheet.appendChild(el("div",`text-align:center;font:italic 12.5px ${SERIF};color:${T.faint};line-height:1.5;margin-bottom:16px;`,"Pooling lines the two passes up beat by beat, so they have to be the same length — you picked "+na+" bars and "+nb+" bars. Re-swipe one of them."));
      const go2=el("button",`width:100%;border:none;background:${T.deep};color:#fff;border-radius:12px;padding:13px;font:600 14px ${UI};cursor:pointer;`,"Pick again");
      go2.onclick=()=>{ S.spans=[]; closeOverlay(back); go("chart"); };
      sheet.appendChild(go2);
    }
    const cancel=el("button",`width:100%;margin-top:10px;background:transparent;border:none;color:${T.faint};font:600 13px ${UI};padding:8px;min-height:44px;cursor:pointer;`,"Cancel");
    cancel.onclick=()=>{ S.spans=[]; closeOverlay(back); go("chart"); };
    sheet.appendChild(cancel);
    back.appendChild(sheet); root.appendChild(back);
  }

  // ── re-infer ────────────────────────────────────────────────────────────
  // The wire shape the server expects (harmonia_server.api_reinfer):
  //   {confirms:[{t0,t1,root,q}], merges:[{spans:[[t0,t1],…]}]}
  // A confirmed chord in a folded (×N) section is confirmed in every pass —
  // one confirm per span, which is strictly more evidence for the decoder.
  function buildRequest(pending, barSpans){
    const confirms=[];
    pending.forEach(i=>{ const c=S.chords[i];
      c.spans.forEach(sp=>confirms.push({t0:sp[0], t1:sp[1], root:c.root, q:c.q})); });
    const merges=[];
    if(barSpans && barSpans.length===2){
      merges.push({spans: barSpans.map(spanTime)});
    }
    return {confirms, merges};
  }
  // context_rescore wire shape (harmonia.serving.api.api_context_rescore,
  // branch feat/chord-context-prior): {chords:[{t0,t1,root,q}], confirms:
  // [{t0,t1,root,q}]} — the FULL displayed chart (so the server can re-score
  // every span's neighbours around the lock(s)), not just the confirms
  // /api/reinfer takes. Same {t0,t1,root,q} field shape as buildRequest below
  // (q is the iReal-ish string tail; the server converts with the same
  // _ireal_q_to_q5 /api/reinfer already trusts) — no client-side quality
  // conversion needed. No-chord (nc) spans are left out: this endpoint never
  // invents a chord where the chart currently shows none.
  function buildContextRescoreRequest(pending){
    const chords=[];
    S.chords.forEach(c=>{
      if(c.nc) return;
      (c.spans||[[c.t0,c.t1]]).forEach(sp=>chords.push({t0:sp[0], t1:sp[1], root:c.root, q:c.q}));
    });
    chords.sort((a,b)=>a.t0-b.t0);
    const confirms=[];
    pending.forEach(i=>{ const c=S.chords[i];
      c.spans.forEach(sp=>confirms.push({t0:sp[0], t1:sp[1], root:c.root, q:c.q})); });
    return {chords, confirms};
  }
  function runReinfer(){
    if(!S.pending.length) return;
    // No merges pending → the fast lock-propagation path (span lattice
    // re-score around your locked chord(s), boundaries untouched) rather than
    // a full from-scratch re-decode.
    runFlow(buildContextRescoreRequest(S.pending), "Checking your fix's neighbours…",
            "re-scoring the chords around your locked chord — a couple seconds",
            false, "/api/context_rescore/");
  }
  function runMerge(){
    runFlow(buildRequest([], S.spans.slice()), "Pooling both passes…",
            "one shared reading, decoded from twice the evidence — about 20 seconds", true);
  }
  // Returns true iff the request landed and was actually applied (not
  // rejected/errored) — added 2026-07-18 so callers like confirmSuggestion()
  // can know whether to mark their own candidate "confirmed" after the
  // shared toast/banner UX above already ran. Existing callers (runReinfer,
  // runMerge) ignore the return value, so this is additive, not a behaviour
  // change for them.
  // ``endpoint`` (2026-07-30): defaults to the old full-decode /api/reinfer/
  // (still what runMerge uses — merges have no lock-lattice equivalent yet);
  // runReinfer passes /api/context_rescore/ instead.
  async function runFlow(req, title, sub, isMerge, endpoint){
    if(S.reinfering) return false; S.reinfering=true;
    const ov=el("div",`position:absolute;inset:0;z-index:60;background:rgba(247,243,233,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:ap-fade .2s both;`);
    ov.appendChild(el("div",`width:36px;height:36px;border:3px solid ${T.line};border-top-color:${T.accent};border-radius:50%;animation:ap-spin .8s linear infinite;`));
    ov.appendChild(el("div",`font:600 15px ${UI};color:${T.ink};`,title));
    ov.appendChild(el("div",`font:italic 12px ${SERIF};color:${T.faint};text-align:center;padding:0 30px;line-height:1.5;`,sub));
    // A full re-infer is TWO decodes of the whole track (constrained, and the
    // unconstrained baseline it diffs against) — ~20s for a 7-minute song.
    // The context-rescore path is a single cache-hit lattice pass instead
    // (sub-2s warm) but the clock stays honest either way rather than
    // pretending a fixed number.
    const clock=el("div",`font:600 12px ${UI};color:${T.faint};`,"0s");
    ov.appendChild(clock);
    const t0=Date.now();
    const tick=setInterval(()=>{ clock.textContent=Math.round((Date.now()-t0)/1000)+"s"; },500);
    root.appendChild(ov);
    let resp=null, err=null;
    try{ resp=await api.post((endpoint||"/api/reinfer/")+S.model.file, req); }
    catch(e){ err=String(e); }
    clearInterval(tick);
    ov.remove(); S.reinfering=false;
    if(err||!resp||resp.error){ toast(resp&&resp.error?resp.error:"Re-infer failed"); return false; }
    // The pipeline can decline a constraint and still return a decode. Never
    // report a merge/fix that the decoder actually threw away.
    if(resp.rejected && resp.rejected.length){
      S.spans=[]; go("chart");
      toast(isMerge?"The decoder refused that pool — the two passes aren’t the same musical length":"That correction couldn’t be applied");
      return false;
    }
    applyResp(resp,isMerge);
    return true;
  }
  // The response's diff is applied by TIME OVERLAP, not by index: the decoder
  // re-segments, so its chord i is not our chord i. Confirmed chords are never
  // overwritten — that is what "hard clamp" means.
  function applyResp(resp,isMerge){
    const diff=(resp&&resp.diff)||[]; const changed=[];
    diff.forEach(d=>{
      const nl=parseLabel(d.new_label);
      S.chords.forEach((ch,j)=>{
        if(ch.confirmed) return;
        const hit=ch.spans.some(sp=>overlaps(sp[0],sp[1],d.start_s,d.end_s));
        if(!hit) return;
        if(ch.root===nl.root && ch.q===nl.q) return;
        ch.root=nl.root; ch.q=nl.q;
        if(d.new_confidence!=null) ch.c=d.new_confidence;
        changed.push({j,d});
      });
    });
    S.pending=[]; S.spans=[]; S.mergeMode=false;
    saveAnnotations();
    go("chart");
    if(!changed.length){ toast(isMerge?"Merged — the reading didn't change":"Locked in — nothing else moved"); return; }
    showPropagation(changed.slice(0,6), changed.length, isMerge);
  }
  function showPropagation(changed,total,isMerge){
    const banner=el("div",`position:absolute;left:14px;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:55;background:${T.card};border:1.5px solid ${T.green};border-radius:16px;padding:15px 17px;box-shadow:0 18px 44px -18px rgba(31,138,91,.55);animation:ap-in .35s both;max-width:520px;margin:0 auto;`);
    const top=el("div","display:flex;align-items:center;gap:10px;margin-bottom:10px;");
    top.innerHTML='<span style="width:26px;height:26px;border-radius:50%;background:'+T.green+';display:flex;align-items:center;justify-content:center;flex:0 0 auto;"><svg width="13" height="13" viewBox="0 0 12 12"><path d="M2 6.2 4.8 9 10 3.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></span>';
    top.appendChild(el("div",`font:700 14px ${UI};color:${T.ink};`, isMerge?("Merged — one shared reading ("+total+" chord"+(total>1?"s":"")+" moved)"):("Your fix sharpened "+total+" nearby chord"+(total>1?"s":""))));
    banner.appendChild(top);
    changed.forEach(ch=>{ const d=ch.d; const o=parseLabel(d.old_label), nw=parseLabel(d.new_label);
      const row=el("div","display:flex;align-items:center;gap:9px;padding:5px 0;");
      const from=glyph(o.root,o.q,17,"exact",confColor(d.old_confidence!=null?d.old_confidence:.3)); from.style.opacity=".7";
      row.appendChild(from);
      row.appendChild(el("span",`color:${T.faint};font:600 13px ${UI};`,"→"));
      row.appendChild(glyph(nw.root,nw.q,19,"exact",T.ink));
      row.appendChild(el("span",`margin-left:auto;font:600 11px ${UI};color:${T.green};`, Math.round((d.old_confidence||0)*100)+"% → "+Math.round((d.new_confidence||0)*100)+"%"));
      banner.appendChild(row); });
    const done=el("button",`width:100%;margin-top:10px;border:none;background:${T.deep};color:#fff;border-radius:10px;padding:11px;font:600 13px ${UI};cursor:pointer;`,"Nice — keep going");
    done.onclick=()=>banner.remove(); banner.appendChild(done);
    root.appendChild(banner);
  }

  // ── persistence (annotation sidecar; keyed on (bar,beat) per its schema) ──
  async function saveAnnotations(){
    if(!S.model) return;
    // t0/t1 travel too (2026-07-20): a plain correction's (bar,beat) already
    // matches a real inferred chord so the server never needed timing from
    // the sidecar — but a SPLIT's new second-half chord has no matching raw
    // entry to inherit t0/t1 from, so to_chart_model synthesizes it straight
    // from what's saved here.
    const chords=S.chords.filter(c=>c.confirmed).map(c=>({bar:c.bar, beat:c.beat, root:c.root, bass:-1, q:c.q, t0:c.t0, t1:c.t1}));
    const merges=S.model.merges||[];
    try{ await api.post("/api/annotations/"+S.model.file, {annotator:"", chords, merges}); }catch(e){}
  }

  // ── overlay + toast ─────────────────────────────────────────────────────
  function overlay(){ const b=el("div",`position:absolute;inset:0;z-index:50;background:rgba(28,24,20,.32);display:flex;align-items:flex-end;justify-content:center;animation:ap-fade .2s both;`); b.setAttribute("data-overlay","1"); b.onclick=e=>{ if(e.target===b) closeOverlay(b); }; return b; }
  function sheetBox(){ return el("div",`width:100%;max-width:520px;background:${T.card};border-top-left-radius:22px;border-top-right-radius:22px;padding:16px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -14px 36px -16px rgba(50,35,20,.5);animation:ap-sheet .3s cubic-bezier(.32,.9,.35,1);max-height:88%;overflow-y:auto;`); }
  // A sheet whose ACTION never scrolls away: header + tabs pinned at the top,
  // the pane scrolls, Lock/Cancel pinned at the bottom. The compass is ~290px
  // tall and pushed the Lock button off a 844px screen entirely.
  function sheetCol(){ const s=sheetBox(); s.style.display="flex"; s.style.flexDirection="column"; s.style.overflow="hidden"; s.style.maxHeight="92%"; return s; }
  function handle(){ return el("div",`width:38px;height:4px;border-radius:2px;background:${T.rule};margin:0 auto 14px;`); }
  function closeOverlay(b){ b.style.animation="ap-fade .18s reverse both"; b.removeAttribute("data-overlay"); setTimeout(()=>b.remove(),160); immersiveArm(); }
  function toast(msg){ const t=el("div",`position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:${T.deep};color:#fff;font:600 12.5px ${UI};padding:10px 16px;border-radius:22px;box-shadow:0 10px 26px -10px rgba(0,0,0,.5);animation:ap-in .25s both;max-width:80%;text-align:center;`,msg); root.appendChild(t); setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),300); },1800); }

  return API;
})();
window.APP.build(document.getElementById("app"));
</script>
