<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Harmonia — comparateur A/B/C</title>
<style>
  :root{ --bg:#0e1013; --panel:#171a1f; --ink:#f2f4f8; --dim:#8b93a1; --line:#262b33;
         --accent:#5ad1c8; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none; }
  #wrap{ max-width:720px; margin:0 auto; min-height:100%; display:flex;
    flex-direction:column; padding:12px 14px calc(env(safe-area-inset-bottom) + 14px); }
  .row{ display:flex; gap:8px; align-items:center; }
  select{ flex:1; background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font-size:16px; }
  .tabs{ display:flex; gap:6px; margin:12px 0 6px; }
  .tab{ flex:1; text-align:center; padding:11px 6px; border-radius:12px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); user-select:none; transition:.12s; }
  .tab .k{ font-weight:700; font-size:15px; } .tab .n{ font-size:11px; color:var(--dim); }
  .tab.on{ background:var(--accent); color:#04211f; border-color:var(--accent); }
  .tab.on .n{ color:#04443f; }
  #stage{ flex:1; display:flex; flex-direction:column; touch-action:pan-y; }
  #hint{ color:var(--dim); font-size:12px; text-align:center; margin:10px 0 4px; letter-spacing:.03em; }
  #chord{ font-size:clamp(46px,15vw,104px); font-weight:800; line-height:1; letter-spacing:-.02em;
    text-align:center; margin-top:6px; }
  #chordsub{ color:var(--dim); font-size:13px; text-align:center; margin-top:6px; min-height:16px; }
  #spacer{ flex:1; min-height:8px; }

  /* the scrolling reel: fixed "now" marker, chords roll right→left past it */
  .reelwrap{ margin-top:10px; }
  .reellabel{ color:var(--dim); font-size:11px; margin-bottom:5px; letter-spacing:.04em; }
  #reel{ position:relative; height:96px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; overflow:hidden; }
  #reel .blocks{ position:absolute; inset:0; }
  .blk{ position:absolute; top:50%; transform:translateY(-50%); height:60px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px;
    color:#0c0e11; background:var(--c); opacity:.5; overflow:visible; white-space:nowrap;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.25); transition:opacity .1s,height .1s; }
  .blk.cur{ opacity:1; height:80px; font-size:22px; box-shadow:0 0 0 2px #fff, 0 4px 16px rgba(0,0,0,.5); z-index:3; }
  .blk.nc{ background:#3a4048; color:var(--dim); font-weight:600; }
  #marker{ position:absolute; top:0; bottom:0; width:2px; background:#fff; z-index:5;
    box-shadow:0 0 10px 1px rgba(255,255,255,.5); }
  #marker::before{ content:"▼"; position:absolute; top:-2px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:11px; }
  #marker::after{ content:"maintenant"; position:absolute; bottom:2px; left:5px; color:#fff;
    font-size:9px; opacity:.65; letter-spacing:.05em; }

  #tl{ width:100%; height:20px; margin-top:12px; border-radius:6px; overflow:hidden;
    background:var(--panel); position:relative; border:1px solid var(--line); cursor:pointer; }
  #tlsvg{ width:100%; height:100%; display:block; }
  #ph{ position:absolute; top:0; bottom:0; width:2px; background:#fff; pointer-events:none; }
  .ctrls{ display:flex; align-items:center; gap:12px; margin-top:12px; }
  #play{ width:56px; height:56px; border-radius:50%; border:none; background:var(--accent);
    color:#04211f; font-size:23px; cursor:pointer; flex:none; }
  #time{ color:var(--dim); font-variant-numeric:tabular-nums; font-size:13px; min-width:86px; }
  #scrub{ flex:1; accent-color:var(--accent); }
  .foot{ color:var(--dim); font-size:11px; margin-top:12px; text-align:center; line-height:1.5; }
  audio{ display:none; }
</style>
</head>
<body>
<div id="wrap">
  <div class="row"><select id="song"></select></div>
  <div class="tabs" id="tabs"></div>
  <div id="stage">
    <div id="hint">← swipe pour comparer les 3 versions →</div>
    <div id="chord">—</div>
    <div id="chordsub"></div>
    <div id="spacer"></div>
    <div class="reelwrap">
      <div class="reellabel">accords à venir →</div>
      <div id="reel"><div class="blocks"></div><div id="marker"></div></div>
    </div>
    <div id="tl"><svg id="tlsvg" preserveAspectRatio="none"></svg><div id="ph" style="left:0"></div></div>
    <div class="ctrls">
      <button id="play">▶</button>
      <span id="time">0:00 / 0:00</span>
      <input id="scrub" type="range" min="0" max="1000" value="0">
    </div>
  </div>
  <div class="foot">
    <b>A</b> pipe actuel · <b>B</b> musx brut (image-par-image, sans grille) · <b>C</b> beat grid réel (snap)<br>
    même audio, même instant — juge à l'oreille laquelle pose le mieux les accords.
  </div>
</div>
<audio id="au" preload="none"></audio>
<script>
const DATA = __DATA__;
const KEYS = ["A","B","C"];
const MARKER_FRAC = 0.26;              // fixed "now" position across the reel
const au = document.getElementById("au");
let si = 0, vi = 0, aheadS = 12, raf = 0;

function pc(label){
  if(!label) return -1; const m = label.match(/^([A-G])([#b]?)/); if(!m) return -1;
  const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];
  return (base + (m[2]=="#"?1:m[2]=="b"?-1:0) + 12) % 12;
}
function hue(label){ const p = pc(label); return p<0 ? null : `hsl(${p*30} 62% 56%)`; }
function fmtC(label){
  if(!label || label==="N" || label==="X") return "·";
  return label.replace(":"," ").replace("maj7","Δ7").replace("maj","").replace("min","m").trim() || "—";
}
function fmt(t){ t=Math.max(0,t|0); return (t/60|0)+":"+String(t%60).padStart(2,"0"); }
function song(){ return DATA[si]; }
function chords(){ return song().variants[KEYS[vi]].chords; }
function at(t){ for(const c of chords()) if(c.start_s<=t && t<c.end_s) return c; return null; }

function buildSongs(){
  const s=document.getElementById("song");
  s.innerHTML = DATA.map((d,i)=>`<option value="${i}">${d.title}</option>`).join("");
  s.onchange = ()=>{ si=+s.value; loadSong(); };
}
function buildTabs(){
  const t=document.getElementById("tabs");
  t.innerHTML = KEYS.map((k,i)=>{
    const nm = song().variants[k].name;
    return `<div class="tab ${i==vi?'on':''}" data-i="${i}"><div class="k">${k}</div><div class="n">${nm}</div></div>`;
  }).join("");
  [...t.children].forEach(el=> el.onclick=()=>{ setVariant(+el.dataset.i); });
}
function computeAhead(){
  // scroll speed constant WITHIN a song; ~4 chords visible ahead of the marker
  const cs=chords(); if(cs.length<2){ aheadS=12; return; }
  const durs=cs.map(c=>c.end_s-c.start_s).filter(d=>d>0).sort((a,b)=>a-b);
  const med=durs[durs.length>>1]||3;
  aheadS=Math.max(8,Math.min(20,med*4.5));
}
function drawTimeline(){
  const svg=document.getElementById("tlsvg"), dur=song().duration_s||1, W=1000,H=20;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML = chords().map(c=>{
    const x=c.start_s/dur*W, w=Math.max(0.6,(c.end_s-c.start_s)/dur*W), col=hue(c.label)||"#3a4048";
    return `<rect x="${x.toFixed(1)}" width="${w.toFixed(1)}" height="${H}" fill="${col}" opacity="0.8"/>`;
  }).join("");
}
function reelTick(now){
  const reel=document.getElementById("reel"), blocks=reel.querySelector(".blocks");
  const W=reel.clientWidth, mx=W*MARKER_FRAC, pxs=(W-mx)/aheadS;
  document.getElementById("marker").style.left=mx+"px";
  let html="";
  for(const c of chords()){
    const xs=mx+(c.start_s-now)*pxs, xe=mx+(c.end_s-now)*pxs;
    if(xe<-30 || xs>W+30) continue;
    const w=Math.max(3,xe-xs), cur=(c.start_s<=now && now<c.end_s);
    const isN=(!c.label||c.label==="N"||c.label==="X");
    const col=hue(c.label)||"#3a4048";
    html+=`<div class="blk${cur?' cur':''}${isN?' nc':''}" style="left:${xs.toFixed(1)}px;width:${w.toFixed(1)}px;--c:${col}">${fmtC(c.label)}</div>`;
  }
  blocks.innerHTML=html;
}
function tick(){
  const now=au.currentTime||0, dur=song().duration_s||au.duration||1, c=at(now);
  const el=document.getElementById("chord");
  el.textContent=fmtC(c?c.label:null); el.style.color=hue(c?c.label:null)||"var(--dim)";
  document.getElementById("chordsub").textContent=c?`${fmt(c.start_s)} – ${fmt(c.end_s)}`:"";
  document.getElementById("ph").style.left=(now/dur*100).toFixed(2)+"%";
  document.getElementById("time").textContent=fmt(now)+" / "+fmt(dur);
  const sc=document.getElementById("scrub"); if(!sc.dragging) sc.value=(now/dur*1000)|0;
  reelTick(now);
}
function loop(){ tick(); raf=requestAnimationFrame(loop); }
function startLoop(){ if(!raf) loop(); }
function stopLoop(){ if(raf){ cancelAnimationFrame(raf); raf=0; } tick(); }

function setVariant(i){ vi=i; buildTabs(); computeAhead(); drawTimeline(); tick(); }
function loadSong(){
  au.src="/compare/audio/"+song().sid; au.load(); vi=0;
  document.getElementById("play").textContent="▶";
  buildTabs(); computeAhead(); drawTimeline(); tick();
}

document.getElementById("play").onclick=()=>{ au.paused?au.play():au.pause(); };
au.onplay=()=>{ document.getElementById("play").textContent="❚❚"; startLoop(); };
au.onpause=()=>{ document.getElementById("play").textContent="▶"; stopLoop(); };
au.onloadedmetadata=tick; au.onended=stopLoop;
const sc=document.getElementById("scrub");
sc.oninput=()=>{ sc.dragging=true; const dur=song().duration_s||au.duration||1; au.currentTime=sc.value/1000*dur; tick(); };
sc.onchange=()=>{ sc.dragging=false; };
document.getElementById("tl").onclick=(e)=>{
  const r=e.currentTarget.getBoundingClientRect(), dur=song().duration_s||au.duration||1;
  au.currentTime=(e.clientX-r.left)/r.width*dur; tick();
};
let sx=0,sy=0; const stage=document.getElementById("stage");
stage.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
stage.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.4) setVariant((vi+(dx<0?1:2))%3);
});
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); au.paused?au.play():au.pause(); }
  if(e.key==="ArrowRight") setVariant((vi+1)%3);
  if(e.key==="ArrowLeft") setVariant((vi+2)%3);
});
window.addEventListener("resize",tick);
buildSongs(); loadSong();
</script>
</body>
</html>
