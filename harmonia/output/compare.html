<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Harmonia — comparateur A/B/C</title>
<style>
  :root{ --bg:#0e1013; --panel:#171a1f; --ink:#f2f4f8; --dim:#8b93a1; --line:#262b33;
         --accent:#5ad1c8; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none; }
  #wrap{ max-width:720px; margin:0 auto; min-height:100%; display:flex;
    flex-direction:column; padding:12px 14px calc(env(safe-area-inset-bottom) + 14px); }
  .row{ display:flex; gap:8px; align-items:center; }
  select{ flex:1; background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font-size:16px; }
  .tabs{ display:flex; gap:6px; margin:12px 0 6px; }
  .tab{ flex:1; text-align:center; padding:11px 6px; border-radius:12px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); user-select:none; transition:.12s; }
  .tab .k{ font-weight:700; font-size:15px; } .tab .n{ font-size:11px; color:var(--dim); }
  .tab.on{ background:var(--accent); color:#04211f; border-color:var(--accent); }
  .tab.on .n{ color:#04443f; }
  #stage{ flex:1; display:flex; flex-direction:column; justify-content:center;
    align-items:center; padding:18px 0 8px; touch-action:pan-y; }
  #hint{ color:var(--dim); font-size:12px; margin-bottom:8px; letter-spacing:.03em; }
  #chord{ font-size:clamp(52px,18vw,120px); font-weight:800; line-height:1; letter-spacing:-.02em;
    text-align:center; }
  #chordsub{ color:var(--dim); font-size:13px; margin-top:6px; min-height:16px; }
  #next{ display:flex; gap:7px; margin-top:20px; flex-wrap:wrap; justify-content:center; min-height:30px; }
  .nx{ background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:5px 9px; font-size:13px; } .nx b{ font-weight:700; } .nx span{ color:var(--dim); }
  #tl{ width:100%; height:34px; margin-top:14px; border-radius:8px; overflow:hidden;
    background:var(--panel); position:relative; border:1px solid var(--line); }
  #tlsvg{ width:100%; height:100%; display:block; }
  #ph{ position:absolute; top:0; bottom:0; width:2px; background:#fff; pointer-events:none; }
  .ctrls{ display:flex; align-items:center; gap:12px; margin-top:14px; }
  #play{ width:58px; height:58px; border-radius:50%; border:none; background:var(--accent);
    color:#04211f; font-size:24px; cursor:pointer; flex:none; }
  #time{ color:var(--dim); font-variant-numeric:tabular-nums; font-size:13px; min-width:86px; }
  #scrub{ flex:1; accent-color:var(--accent); }
  .foot{ color:var(--dim); font-size:11px; margin-top:12px; text-align:center; line-height:1.5; }
  audio{ display:none; }
</style>
</head>
<body>
<div id="wrap">
  <div class="row">
    <select id="song"></select>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="stage">
    <div id="hint">← swipe pour comparer →</div>
    <div id="chord">—</div>
    <div id="chordsub"></div>
    <div id="next"></div>
    <div id="tl"><svg id="tlsvg" preserveAspectRatio="none"></svg><div id="ph" style="left:0"></div></div>
    <div class="ctrls">
      <button id="play">▶</button>
      <span id="time">0:00 / 0:00</span>
      <input id="scrub" type="range" min="0" max="1000" value="0">
    </div>
  </div>
  <div class="foot">
    <b>A</b> pipe actuel · <b>B</b> musx brut (image-par-image, sans grille) · <b>C</b> beat grid réel (snap)<br>
    même audio, même instant — juge à l'oreille laquelle pose le mieux les accords.
  </div>
</div>
<audio id="au" preload="none"></audio>
<script>
const DATA = __DATA__;
const KEYS = ["A","B","C"];
const au = document.getElementById("au");
let si = 0, vi = 0;

function pc(label){                       // root pitch-class 0..11 or -1
  if(!label) return -1; const m = label.match(/^([A-G])([#b]?)/); if(!m) return -1;
  const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];
  return (base + (m[2]=="#"?1:m[2]=="b"?-1:0) + 12) % 12;
}
function hue(label){ const p = pc(label); return p<0 ? null : `hsl(${p*30} 62% 55%)`; }
function fmt(t){ t=Math.max(0,t|0); return (t/60|0)+":"+String(t%60).padStart(2,"0"); }
function song(){ return DATA[si]; }
function chords(){ return song().variants[KEYS[vi]].chords; }
function at(t){ const cs=chords(); for(const c of cs) if(c.start_s<=t && t<c.end_s) return c; return null; }

function buildSongs(){
  const s=document.getElementById("song");
  s.innerHTML = DATA.map((d,i)=>`<option value="${i}">${d.title}</option>`).join("");
  s.onchange = ()=>{ si=+s.value; loadSong(); };
}
function buildTabs(){
  const t=document.getElementById("tabs");
  t.innerHTML = KEYS.map((k,i)=>{
    const nm = song().variants[k].name;
    return `<div class="tab ${i==vi?'on':''}" data-i="${i}"><div class="k">${k}</div><div class="n">${nm}</div></div>`;
  }).join("");
  [...t.children].forEach(el=> el.onclick=()=>{ vi=+el.dataset.i; render(); });
}
function drawTimeline(){
  const svg=document.getElementById("tlsvg"), dur=song().duration_s||1;
  const W=1000,H=34; svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML = chords().map(c=>{
    const x=c.start_s/dur*W, w=Math.max(0.6,(c.end_s-c.start_s)/dur*W), col=hue(c.label)||"#3a4048";
    return `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${H}" fill="${col}" opacity="0.85"/>`;
  }).join("");
}
function render(){
  buildTabs(); drawTimeline(); tick();
}
function tick(){
  const t=au.currentTime||0, dur=song().duration_s||au.duration||1;
  const c=at(t), lab=c?c.label:"—";
  const el=document.getElementById("chord");
  el.textContent = lab==="N" ? "·" : lab.replace(":"," ").replace("maj","").replace("min","m").trim() || "—";
  el.style.color = hue(lab) || "var(--dim)";
  document.getElementById("chordsub").textContent = c ? `${fmt(c.start_s)}–${fmt(c.end_s)}` : "";
  // next chords
  const cs=chords(), idx=cs.findIndex(c2=>c2.start_s>t);
  const nx=(idx<0?[]:cs.slice(idx,idx+4));
  document.getElementById("next").innerHTML = nx.map(c2=>{
    const l=(c2.label==="N"?"·":c2.label.replace(":"," ").replace("maj","").replace("min","m").trim());
    return `<div class="nx" style="border-color:${hue(c2.label)||'var(--line)'}"><b>${l}</b> <span>${fmt(c2.start_s)}</span></div>`;
  }).join("");
  document.getElementById("ph").style.left = (t/dur*100).toFixed(2)+"%";
  document.getElementById("time").textContent = fmt(t)+" / "+fmt(dur);
  const sc=document.getElementById("scrub"); if(!sc.dragging) sc.value=(t/dur*1000)|0;
}
function loadSong(){
  au.src = "/compare/audio/"+song().sid; au.load(); vi=0;
  document.getElementById("play").textContent="▶"; render();
}

// controls
document.getElementById("play").onclick=()=>{ au.paused?au.play():au.pause(); };
au.onplay=()=>document.getElementById("play").textContent="❚❚";
au.onpause=()=>document.getElementById("play").textContent="▶";
au.ontimeupdate=tick; au.onloadedmetadata=tick;
const sc=document.getElementById("scrub");
sc.oninput=()=>{ sc.dragging=true; const dur=song().duration_s||au.duration||1; au.currentTime=sc.value/1000*dur; tick(); };
sc.onchange=()=>{ sc.dragging=false; };
document.getElementById("tl").onclick=(e)=>{
  const r=e.currentTarget.getBoundingClientRect(), dur=song().duration_s||au.duration||1;
  au.currentTime=(e.clientX-r.left)/r.width*dur; tick();
};
// swipe between variants (keep audio position)
let sx=0,sy=0;
const stage=document.getElementById("stage");
stage.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
stage.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.4){ vi=(vi+(dx<0?1:2))%3; render(); }
});
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); au.paused?au.play():au.pause(); }
  if(e.key==="ArrowRight"){ vi=(vi+1)%3; render(); }
  if(e.key==="ArrowLeft"){ vi=(vi+2)%3; render(); }
});
buildSongs(); loadSong();
</script>
</body>
</html>
