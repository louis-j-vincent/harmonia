<body><h1>Harmonia — la visite, après les deux lots UX</h1><p>iPhone 390 px, moteur Safari (WebKit), 2026-10-01. Chaque écran a été parcouru en faisant les gestes d'un utilisateur.</p><div class="g"><figure><img src="ux_visite_2026-10-01/01_accueil.jpg" alt=""><figcaption>Accueil : « Reprendre · mesure 40 » en tête, vrai champ, import d'un fichier</figcaption></figure><figure><img src="ux_visite_2026-10-01/02_bibliotheque.jpg" alt=""><figcaption>Bibliothèque : tri, « ＋ Nouveau dossier », pastille « corrigé »</figcaption></figure><figure><img src="ux_visite_2026-10-01/03_lire.jpg" alt=""><figcaption>Lire : « G mineur ↻ Transposer », partage, n° de mesure, vitesse « 1× », « aller à la mesure… »</figcaption></figure><figure><img src="ux_visite_2026-10-01/04_reglages.jpg" alt=""><figcaption>Réglages : l'essentiel, le reste sous « Plus de réglages »</figcaption></figure><figure><img src="ux_visite_2026-10-01/05_corriger.jpg" alt=""><figcaption>Corriger : un seul indice, toucher l'accord lui-même</figcaption></figure><figure><img src="ux_visite_2026-10-01/06_editeur.jpg" alt=""><figcaption>Éditeur : ▶ Original sur demande, ‹ › accord voisin, 2 onglets, « Garder G7 »</figcaption></figure><figure><img src="ux_visite_2026-10-01/07_couper.jpg" alt=""><figcaption>Couper la mesure : on touche le temps, « + ajouter »</figcaption></figure><figure><img src="ux_visite_2026-10-01/08_outils.jpg" alt=""><figcaption>Outils : 3 gestes + Tempo (♩ = 80), le reste sous « Plus d'outils »</figcaption></figure><figure><img src="ux_visite_2026-10-01/09_tempo.jpg" alt=""><figcaption>Tempo : « Passer à ♩ 40 ? » — un 2ᵉ tap pour confirmer</figcaption></figure><figure><img src="ux_visite_2026-10-01/10_entrainer.jpg" alt=""><figcaption>S'entraîner : 🎹, boucle 1·2·4·8, vitesse, rôle court en français</figcaption></figure><figure><img src="ux_visite_2026-10-01/11_entrainer_reglages.jpg" alt=""><figcaption>S'entraîner › Réglages : vitesse, piano expliqué, tic, décompte</figcaption></figure></div></bod
