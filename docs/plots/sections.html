<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3e9">
<title>Sections</title>
<style>
:root{
  --papier:#f7f3e9; --carte:#fffdf6; --filet:#e5dcc6;
  --encre:#1c1c1c; --second:#8a8371; --accent:#8a2b2b;
  --r1:9px; --r2:14px; --r3:20px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--papier); color:var(--encre); font-family:var(--ui);
  font-size:16px; line-height:1.45;
  padding:calc(18px + env(safe-area-inset-top)) 14px
          calc(24px + env(safe-area-inset-bottom));
  max-width:520px; margin:0 auto; -webkit-text-size-adjust:100%}

.retour{display:inline-flex; align-items:center; min-height:44px; margin:0 0 2px;
  color:var(--accent); text-decoration:none; font:600 14px/1 var(--ui)}
h1{font:italic 400 26px/1.15 var(--serif); margin:0 0 3px}
.sous{color:var(--second); font-size:13.5px; margin:0 0 14px}

/* les noms à poser : c'est le surligneur qu'on choisit */
.noms{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:9px}
.noms button{min-height:44px; min-width:52px; padding:0 13px; border-radius:var(--r2);
  border:2px solid var(--filet); background:var(--carte); color:var(--encre);
  font:600 15px/1 var(--ui); cursor:pointer}
.noms button[aria-pressed="true"]{border-color:var(--c,#8a2b2b);
  background:var(--t,#f2e6e6); box-shadow:0 0 0 3px var(--h,rgba(138,43,43,.16))}
.noms button.gomme{font-style:italic; color:var(--second)}
.aide{color:var(--second); font-size:13px; margin:0 2px 14px; min-height:2.6em}

/* le chart brut : une case par mesure */
.grille{display:grid; grid-template-columns:repeat(4,1fr); gap:5px;
  margin-bottom:14px; touch-action:pan-y}
.mes{position:relative; min-height:58px; border-radius:var(--r1);
  border:1px solid var(--filet); background:var(--carte); padding:15px 4px 4px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; cursor:pointer; user-select:none; -webkit-user-select:none;
  overflow:hidden}
.mes .no{position:absolute; top:2px; left:5px; font:600 9px/1 var(--ui);
  color:var(--second); font-variant-numeric:tabular-nums}
.mes .ac{font:italic 400 16px/1.1 var(--serif); white-space:nowrap}
.mes .ac.nc{color:var(--second); font-style:normal; font-size:12px}
.mes.sec{background:var(--t); border-color:var(--c)}
.mes.humain{border-width:2px}
.mes.algo::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(135deg, transparent 0 5px,
             var(--c) 5px 6px); opacity:.16}
/* propagé = ton nom, trouvé ailleurs par l'algorithme : hachures plus fines
   que les siennes, pour qu'un coup d'oeil suffise a savoir qui a dit quoi. */
.mes.propage::after{background:repeating-linear-gradient(135deg, transparent 0 9px,
             var(--c) 9px 10px); opacity:.3}
.mes.debut{box-shadow:inset 3px 0 0 var(--c)}
.mes .et{position:absolute; top:2px; right:5px; font:700 10px/1 var(--ui);
  color:var(--c)}
.mes.vise{outline:3px solid var(--accent); outline-offset:-3px}

.barre{display:flex; gap:8px; margin-bottom:12px}
.barre button{flex:1; min-height:48px; border-radius:var(--r2); border:1px solid var(--filet);
  background:var(--carte); color:var(--encre); font:600 14px/1 var(--ui); cursor:pointer}
.barre button.fort{background:var(--encre); color:var(--carte); border-color:var(--encre)}
.barre button:disabled{color:#b9b1a0; background:#f1ece0}

.piste{position:relative; height:24px; margin:0 0 10px; border-radius:var(--r1);
  background:#efe8d8; border:1px solid var(--filet); overflow:hidden;
  touch-action:none; cursor:pointer}
.piste i{position:absolute; top:0; bottom:0}
.piste .cur{width:3px; background:var(--accent); border-radius:2px; left:0;
  transition:left .26s linear; z-index:2}
.trans{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.rond{width:56px; height:56px; flex:0 0 auto; border-radius:50%; border:0;
  background:var(--encre); color:var(--carte); font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center}
.compte{flex:1; color:var(--second); font:13px/1.35 var(--ui)}

.liste{margin:0 0 14px}
.liste .l{display:flex; align-items:center; gap:9px; min-height:44px;
  border-bottom:1px solid var(--filet); font:14px/1.3 var(--ui)}
.liste .l:last-child{border-bottom:0}
.liste .pastille{width:26px; height:26px; flex:0 0 auto; border-radius:8px;
  background:var(--c); color:#fffdf6; display:flex; align-items:center;
  justify-content:center; font:700 12px/1 var(--ui)}
.liste .plage{flex:1; min-width:0; color:var(--second)}
.liste .qui{font:11px/1 var(--ui); color:var(--second); text-transform:uppercase;
  letter-spacing:.05em}
.valid{width:100%; min-height:52px; border-radius:var(--r2); border:1px solid var(--accent);
  background:var(--accent); color:#fff8ee; font:600 15px/1 var(--ui); cursor:pointer}
.valid:disabled{background:#e3dbc9; color:#a79f8c; border-color:var(--filet)}
.note{color:var(--second); font:13px/1.4 var(--ui); margin:9px 2px 0; min-height:1.2em}
</style>
</head>
<body>

<a class="retour" id="retour" hidden></a>
<h1 id="titre">Sections</h1>
<p class="sous" id="sous"></p>

<div class="noms" id="noms"></div>
<p class="aide" id="aide"></p>

<div class="grille" id="grille"></div>

<div class="barre">
  <button id="annuler">Annuler</button>
  <button id="tout" >Tout effacer</button>
</div>

<div class="piste" id="piste"><i class="cur" id="cur"></i></div>
<div class="trans">
  <button class="rond" id="pp" aria-label="lecture">▶</button>
  <div class="compte" id="compte"></div>
</div>

<div class="liste" id="liste"></div>
<button class="valid" id="valid">Valider — écrire dans le chart</button>
<p class="note" id="note"></p>

<script>
(function(){
"use strict";

/* ═══ la chanson ══════════════════════════════════════════════════════
   L'atelier sections (Louis, 2026-08-15) : « un chart brut, je peux
   sélectionner le nom de la section que je veux, puis j'ai juste à surligner
   sur le chart brut les accords concernés […] l'algo 4 mots infère les
   sections similaires + autres sections automatiquement ».

   LE MODÈLE, en une phrase : ce que Louis surligne est FIGÉ, l'algorithme
   remplit le reste, et les deux se distinguent à l'œil — plein pour lui,
   hachuré pour l'algorithme. C'est ce qui en fait un outil à deux mains et
   non une boîte noire qu'on regarde tourner. */
var SONG = window.SONG || {titre:"(sans chanson)", n_mesures:0, mesures:[],
                           temps_par_mesure:[], t0:0};
var NM = SONG.n_mesures || SONG.mesures.length;
var DUR = SONG.temps_par_mesure || [];
var T = [SONG.t0 || 0];
for (var i=0;i<NM;i++) T.push(T[i] + (DUR[i] || 2));

var NOMS = ["intro","A","B","C","D","E","pont","outro"];
var COUL = {"intro":"#8a8371","A":"#8a2b2b","B":"#2a6fb0","C":"#6b7a3a",
            "D":"#b07d2a","E":"#6d4670","pont":"#3d7a72","outro":"#a4552a"};
var SUITE = ["#8a2b2b","#2a6fb0","#6b7a3a","#b07d2a","#6d4670","#3d7a72",
             "#a4552a","#4a5c86"];
function couleur(lab){
  var base = String(lab).replace("′","");
  if (COUL[base]) return COUL[base];
  var h = 0;
  for (var k=0;k<base.length;k++) h = (h*31 + base.charCodeAt(k)) >>> 0;
  return SUITE[h % SUITE.length];
}
function rgba(hex,a){
  var n = parseInt(hex.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}

var NOTES = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
function accord(c){
  if (c.nc) return "—";
  var s = NOTES[((c.root % 12) + 12) % 12] + (c.q || "");
  if (c.bass != null && c.bass >= 0 && c.bass !== c.root)
    s += "/" + NOTES[((c.bass % 12) + 12) % 12];
  return s;
}

/* ═══ l'état ══════════════════════════════════════════════════════════ */
var S = {
  nom: "A",                 // le surligneur en main
  humain: [],               // [{label, mesure_debut, mesure_fin}] — ses traits
  sections: [],             // ce qui est affiché : les siens + ceux de l'algo
  hist: [],                 // pour Annuler
  peint: null,              // le trait en cours
  panne: null
};
var $ = function(id){ return document.getElementById(id); };

/* Ce que le chart dit déjà : un point de départ, pas une page blanche. */
if (SONG.sections_actuelles && SONG.sections_actuelles.length)
  S.sections = SONG.sections_actuelles.map(function(x){
    return {label:x.label, mesure_debut:x.mesure_debut, mesure_fin:x.mesure_fin,
            source:"chart"};
  });

/* ═══ rendu ═══════════════════════════════════════════════════════════ */
function sectionDe(mesure){                 // 1-indexée
  for (var i=0;i<S.sections.length;i++){
    var s = S.sections[i];
    if (mesure >= s.mesure_debut && mesure <= s.mesure_fin) return s;
  }
  return null;
}

function dessine(){
  if (SONG.retour && SONG.retour.href){
    var r = $("retour");
    r.href = SONG.retour.href;
    r.textContent = "‹ " + (SONG.retour.label || "retour");
    r.hidden = false;
  }
  $("titre").textContent = SONG.titre || "Sections";
  var nH = 0, nP = 0;
  S.sections.forEach(function(x){ if (x.source === "humain") nH++;
                                  else if (x.source === "propage") nP++; });
  var nA = S.sections.length - nH - nP;
  $("sous").textContent = NM + " mesures · " + S.sections.length + " sections"
    + (nH ? " · " + nH + " de toi" : "");

  /* les surligneurs */
  var noms = $("noms"); noms.innerHTML = "";
  NOMS.forEach(function(n){
    var b = document.createElement("button");
    b.textContent = n;
    var c = couleur(n);
    b.style.cssText = "--c:"+c+";--t:"+rgba(c,.13)+";--h:"+rgba(c,.2);
    b.setAttribute("aria-pressed", S.nom === n);
    b.onclick = function(){ S.nom = n; dessine(); };
    noms.appendChild(b);
  });
  var g = document.createElement("button");
  g.className = "gomme"; g.textContent = "gomme";
  g.setAttribute("aria-pressed", S.nom === null);
  g.onclick = function(){ S.nom = null; dessine(); };
  noms.appendChild(g);

  $("aide").style.color = S.panne ? "var(--accent)" : "";
  $("aide").textContent = S.panne ? S.panne
    : (S.nom === null
       ? "Glisse sur les mesures pour retirer ce que tu y avais mis."
       : "Glisse sur les mesures pour les nommer « " + S.nom + " ». "
         + "L’algorithme complète le reste — hachuré, c’est lui.");

  /* le chart brut */
  var gr = $("grille"); gr.innerHTML = "";
  for (var m=0;m<NM;m++){
    var d = document.createElement("div");
    d.className = "mes"; d.dataset.m = String(m + 1);
    var sec = sectionDe(m + 1);
    if (sec){
      var c = couleur(sec.label);
      d.style.cssText = "--c:"+c+";--t:"+rgba(c,.13);
      d.classList.add("sec");
      d.classList.add(sec.source === "humain" ? "humain" : "algo");
      if (sec.source === "propage") d.classList.add("propage");
      if (sec.mesure_debut === m + 1){
        d.classList.add("debut");
        var et = document.createElement("i");
        et.className = "et"; et.textContent = sec.label;
        d.appendChild(et);
      }
    }
    if (S.peint && m + 1 >= Math.min(S.peint.a, S.peint.b)
                && m + 1 <= Math.max(S.peint.a, S.peint.b)) d.classList.add("vise");
    var no = document.createElement("i"); no.className = "no";
    no.textContent = String(m + 1); d.appendChild(no);
    var bar = SONG.mesures[m] || [];
    if (!bar.length){
      var v = document.createElement("span"); v.className = "ac nc";
      v.textContent = "—"; d.appendChild(v);
    }
    for (var k=0;k<bar.length && k<3;k++){
      var a = document.createElement("span");
      a.className = "ac" + (bar[k].nc ? " nc" : "");
      a.textContent = accord(bar[k]); d.appendChild(a);
    }
    gr.appendChild(d);
  }

  /* la liste, pour corriger sans viser une case */
  var li = $("liste"); li.innerHTML = "";
  S.sections.forEach(function(s, idx){
    var row = document.createElement("div"); row.className = "l";
    var p = document.createElement("span"); p.className = "pastille";
    p.style.setProperty("--c", couleur(s.label));
    p.textContent = s.label.slice(0,3);
    var pl = document.createElement("span"); pl.className = "plage";
    pl.textContent = "mesures " + s.mesure_debut + "–" + s.mesure_fin;
    var q = document.createElement("span"); q.className = "qui";
    q.textContent = {humain:"toi", propage:"toi ↝ algo", algo:"algo"}[s.source] || "chart";
    var b = document.createElement("button");
    b.style.cssText = "min-height:44px;min-width:44px;border:0;background:none;"
      + "color:var(--second);font:15px var(--ui);cursor:pointer";
    b.textContent = S.nom === null ? "✕" : "→ " + S.nom;
    b.setAttribute("aria-label", S.nom === null ? "retirer" : "renommer en " + S.nom);
    b.onclick = (function(sec){ return function(){
      if (S.nom === null) retire(sec.mesure_debut, sec.mesure_fin);
      else pose(sec.mesure_debut, sec.mesure_fin, S.nom);
    }; })(s);
    row.appendChild(p); row.appendChild(pl); row.appendChild(q); row.appendChild(b);
    li.appendChild(row);
  });

  /* la piste : les sections vues de loin */
  var pi = $("piste");
  var vieux = pi.querySelectorAll("i:not(.cur)");
  for (var q2=0;q2<vieux.length;q2++) vieux[q2].remove();
  S.sections.forEach(function(s){
    var b = document.createElement("i");
    b.style.left = (100*(s.mesure_debut-1)/NM).toFixed(3) + "%";
    b.style.width = (100*(s.mesure_fin-s.mesure_debut+1)/NM).toFixed(3) + "%";
    b.style.background = rgba(couleur(s.label), s.source === "humain" ? .55 : .26);
    pi.insertBefore(b, $("cur"));
  });

  $("annuler").disabled = !S.hist.length;
  $("tout").disabled = !S.humain.length;
  $("valid").disabled = !S.sections.length || !SONG.file;
  $("compte").textContent = (nH || nP)
    ? nH + " posée" + (nH>1?"s":"") + " à la main · " + nP + " retrouvée"
      + (nP>1?"s":"") + " ailleurs sous ton nom · " + nA + " nommée"
      + (nA>1?"s":"") + " par l’algorithme"
    : "Rien de posé : ce que tu vois vient du chart.";
}

/* ═══ poser et retirer ════════════════════════════════════════════════ */
function memorise(){
  S.hist.push(JSON.stringify({h:S.humain, s:S.sections}));
  if (S.hist.length > 40) S.hist.shift();
}
function pose(m0, m1, lab){
  memorise();
  var a = Math.min(m0,m1), b = Math.max(m0,m1);
  S.humain = S.humain.filter(function(h){ return h.mesure_fin < a || h.mesure_debut > b; });
  S.humain.push({label: lab, mesure_debut: a, mesure_fin: b});
  S.humain.sort(function(x,y){ return x.mesure_debut - y.mesure_debut; });
  infere();
}
function retire(m0, m1){
  memorise();
  var a = Math.min(m0,m1), b = Math.max(m0,m1);
  S.humain = S.humain.filter(function(h){ return h.mesure_fin < a || h.mesure_debut > b; });
  infere();
}

/* ═══ l'algorithme complète ═══════════════════════════════════════════ */
var enVol = 0;
function infere(){
  if (!SONG.file){ dessine(); return; }
  var moi = ++enVol;
  S.panne = null; dessine();
  fetch("/api/sections/inferer/" + encodeURIComponent(SONG.file), {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({humain: S.humain})
  }).then(function(r){ return r.json(); }).then(function(d){
    if (moi !== enVol) return;
    if (!d || d.error || !d.sections){
      S.panne = "L’algorithme n’a pas répondu" + (d && d.error ? " (" + d.error + ")" : "") + ".";
      dessine(); return;
    }
    S.sections = d.sections;
    dessine();
  })["catch"](function(e){
    if (moi !== enVol) return;
    S.panne = "L’algorithme n’a pas répondu (" + e + ").";
    dessine();
  });
}

/* ═══ le geste de surlignage ══════════════════════════════════════════ */
var gr = $("grille");
function mesureSous(ev){
  var t = document.elementFromPoint(
    ev.touches ? ev.touches[0].clientX : ev.clientX,
    ev.touches ? ev.touches[0].clientY : ev.clientY);
  while (t && t !== gr && !t.classList.contains("mes")) t = t.parentNode;
  return (t && t.dataset && t.dataset.m) ? parseInt(t.dataset.m, 10) : null;
}
gr.addEventListener("pointerdown", function(ev){
  var m = mesureSous(ev);
  if (m == null) return;
  ev.preventDefault();
  S.peint = {a:m, b:m};
  try { gr.setPointerCapture(ev.pointerId); } catch(e){}
  dessine();
});
gr.addEventListener("pointermove", function(ev){
  if (!S.peint) return;
  var m = mesureSous(ev);
  if (m == null || m === S.peint.b) return;
  S.peint.b = m; dessine();
});
function finTrait(){
  if (!S.peint) return;
  var a = S.peint.a, b = S.peint.b;
  S.peint = null;
  if (S.nom === null) retire(a, b); else pose(a, b, S.nom);
}
gr.addEventListener("pointerup", finTrait);
gr.addEventListener("pointercancel", function(){ S.peint = null; dessine(); });

$("annuler").onclick = function(){
  if (!S.hist.length) return;
  var v = JSON.parse(S.hist.pop());
  S.humain = v.h; S.sections = v.s; dessine();
};
$("tout").onclick = function(){
  memorise(); S.humain = []; infere();
};

/* ═══ écrire dans le chart ════════════════════════════════════════════ */
$("valid").onclick = function(){
  if (!S.sections.length || !SONG.file) return;
  var b = $("valid"); b.disabled = true; b.textContent = "…";
  fetch("/api/soudure/valider/" + encodeURIComponent(SONG.file), {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({sections: S.sections.map(function(s){
      return {label:s.label, mesure_debut:s.mesure_debut, mesure_fin:s.mesure_fin}; })})
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d && d.ok && d.url){ window.location = d.url; return; }
    b.disabled = false; b.textContent = "Valider — écrire dans le chart";
    $("note").textContent = "Le chart n’a pas été réécrit"
      + (d && d.error ? " : " + d.error : "") + ".";
  })["catch"](function(e){
    b.disabled = false; b.textContent = "Valider — écrire dans le chart";
    $("note").textContent = "Le chart n’a pas été réécrit (" + e + ").";
  });
};

/* ═══ le son ══════════════════════════════════════════════════════════
   Mêmes pièges qu'ailleurs, mêmes parades : le fichier est téléchargé en
   entier et rejoué depuis un blob (le lecteur d'iOS ne bufferise parfois
   jamais un fichier servi en Range), et la tête de lecture avance sur
   l'horloge du média — jamais dans une boucle d'animation, qui empêcherait
   le son de démarrer sur iPhone. */
var el = null, lien = null, joue = false;
if (SONG.audio_url && window.fetch)
  fetch(SONG.audio_url).then(function(r){ return r.ok ? r.blob() : null; })
    .then(function(b){ if (b){ lien = URL.createObjectURL(b);
      if (el && !joue) el.src = lien; } })["catch"](function(){});

function media(){
  if (!el){
    el = new Audio(); el.preload = "auto"; el.playsInline = true;
    try { el.setAttribute("playsinline",""); el.setAttribute("webkit-playsinline",""); } catch(e){}
    el.src = lien || SONG.audio_url;
    el.addEventListener("timeupdate", tete);
    el.addEventListener("ended", function(){ joue = false; $("pp").textContent = "▶"; });
  } else if (lien && el.src !== lien && !joue){ el.src = lien; }
  return el;
}
function tete(){
  var c = $("cur");
  if (!el || !joue){ c.style.opacity = ".35"; return; }
  c.style.opacity = "1";
  var t = el.currentTime, m = -1;
  for (var k=0;k<NM;k++) if (t >= T[k] && t < T[k+1]){ m = k + (t-T[k])/Math.max(1e-6,T[k+1]-T[k]); break; }
  if (m >= 0) c.style.left = Math.max(0, Math.min(100, 100*m/NM)) + "%";
}
$("pp").onclick = function(){
  var a = media();
  if (joue){ a.pause(); joue = false; $("pp").textContent = "▶"; return; }
  joue = true; $("pp").textContent = "❙❙";
  var p = a.play(); if (p && p["catch"]) p["catch"](function(e){
    joue = false; $("pp").textContent = "▶";
    S.panne = "Le téléphone a refusé de démarrer le son."; dessine(); });
};
$("piste").addEventListener("pointerdown", function(ev){
