<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stand By Me — minimal</title><style>
body{font-family:-apple-system,Georgia,serif;background:#e7e0d0;color:#1c1c1c;margin:0;padding:18px;line-height:1.5}
main{max-width:820px;margin:0 auto}
h1{font:italic 700 24px Georgia;margin:6px 0 2px} .sub{color:#8a8371;font-size:13px;margin-bottom:12px}
.chip{background:#fffdf6;border:1.5px solid #8a2b2b;color:#8a2b2b;font:700 14px -apple-system;border-radius:16px;padding:4px 12px;margin:2px 3px;cursor:pointer}
.sec{display:flex;align-items:flex-start;margin-top:16px}
.letter{font:800 15px -apple-system;color:#8a2b2b;border:1.5px solid #8a2b2b;border-radius:5px;padding:1px 8px;background:#fffdf6;margin-right:10px;margin-top:8px}
.barsbox{flex:1}
.row{display:grid;grid-template-columns:repeat(4,1fr);border-left:2px solid #1c1c1c}
.bar{border-right:1px solid #b9b09a;border-bottom:1px solid #e5dcc6;padding:12px 8px;min-height:36px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;background:#fffdf6}
.q{grid-row:1} .q0{grid-column:1} .q1{grid-column:2} .q2{grid-column:3} .q3{grid-column:4}
.bar b{font:italic 700 21px Georgia} sup{font-size:12px;font-weight:700}
.bass{opacity:.65;font-size:13px} .nc{color:#8a8371;font-style:italic} .carry{opacity:.6}
audio{width:100%;margin:10px 0}</style></head><body><main>
<h1>Stand By Me</h1>
<div class="sub">A major · 4/4 · <a href="/">chart complet</a></div>
<audio id="aud" controls src="/audio/ben_e_king_stand_by_me_audio.m4a"></audio>
<p><button class='chip' onclick="play(1.92,16.38)">intro</button><button class='chip' onclick="play(16.38,32.40)">A</button><button class='chip' onclick="play(32.40,48.40)">A</button><button class='chip' onclick="play(48.40,64.48)">A</button><button class='chip' onclick="play(64.48,80.58)">A</button><button class='chip' onclick="play(80.58,96.68)">A</button><button class='chip' onclick="play(96.68,112.80)">A</button><button class='chip' onclick="play(112.80,128.86)">A</button><button class='chip' onclick="play(128.86,144.96)">A</button><button class='chip' onclick="play(144.96,160.96)">A</button><button class='chip' onclick="play(160.96,176.92)">A</button></p>
<div class='sec'><span class='letter'>intro</span><div class='barsbox'><div class='row'><div class='bar'><span class='q q0'><span class='nc'>N.C.</span></span></div><div class='bar'><span class='q q0 carry'><span class='nc'>N.C.</span></span></div><div class='bar'><span class='q q0 carry'><span class='nc'>N.C.</span></span></div><div class='bar'><span class='q q0 carry'><span class='nc'>N.C.</span></span></div></div><div class='row'><div class='bar'><span class='q q0 carry'><span class='nc'>N.C.</span></span></div><div class='bar'><span class='q q0 carry'><span class='nc'>N.C.</span></span></div></div></div></div><div class='sec'><span class='letter'>A</span><div class='barsbox'><div class='row'><div class='bar'><span class='q q0 carry'><span class='nc'>N.C.</span></span></div><div class='bar'><span class='q q0 carry'><span class='nc'>N.C.</span></span></div><div class='bar'><span class='q q0 carry'><span class='nc'>N.C.</span></span></div><div class='bar'><span class='q q0 carry'><span class='nc'>N.C.</span></span></div></div><div class='row'><div class='bar'><span class='q q0 carry'><span class='nc'>N.C.</span></span></div><div class='bar'><span class='q q0'><b>E</b><sup></sup></span></div><div class='bar'><span class='q q0'><span class='nc'>N.C.</span></span></div><div class='bar'><span class='q q0 carry'><span class='nc'>N.C.</span></span></div></div></div></div>
<script>let _st=null;
function play(t0,t1){const a=document.getElementById('aud');a.currentTime=t0;a.play();
if(_st)clearTimeout(_st);_st=setTimeout(()=>a.pause(),(t1-t0)*1000);}</script>
</main></body></html>
